<!doctype html><html lang="pt-BR" data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Provas · Só Tintas</title>
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --bg:#0f1522; --surface:#1a2336; --surface2:#222d44; --ink:#eef2fb; --muted:#9aa5bb; --line:#2c3850;
  --accent:#ff3b47; --navy:#6f95f5; --ok:#3fbf7f; --bad:#ff6b6b; --warn:#ffab5e; --neutro:#7c89a3;
  --okbg:#12301f; --badbg:#3a1a20; --warnbg:#3a2717; --navybg:#1e2b4d; --neutrobg:#2a3550;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f8; --ink:#16233d; --muted:#5a677f; --line:#e4e9f3;
  --navy:#1C3F8F; --ok:#178048; --bad:#c42a22; --warn:#b35600; --neutro:#7a869c;
  --okbg:#e1f3e8; --badbg:#fdeceb; --warnbg:#ffefdd; --navybg:#e7edf9; --neutrobg:#e9edf4;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.topbar{height:8px;background:var(--accent);border-radius:0 0 6px 6px;margin:-20px 0 4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.05;margin:4px 0 0;color:var(--accent)}
h2{font-family:var(--f-display);font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed=true]{background:var(--navybg);color:var(--ink)}
.btema{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:42px;cursor:pointer;font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:10px}

/* resumo */
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.anel{position:relative;width:150px;height:150px}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .cen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anel b{font-family:var(--f-display);font-size:34px;line-height:1}
.anel small{color:var(--muted);font-size:12px;margin-top:2px}
.frase{font-family:var(--f-display);font-size:clamp(18px,2.6vw,23px);font-weight:600;line-height:1.2;margin:0 0 8px}
.frase em{font-style:normal;color:var(--bad)}.frase em.ok{color:var(--ok)}
.prazo{display:inline-block;background:var(--surface2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}

/* placas de situação */
.placas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.placa{text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px;cursor:pointer;min-height:92px}
.placa:hover{background:var(--surface2)}
.placa[aria-pressed=true]{outline:2px solid var(--navy);outline-offset:1px}
.placa b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.05}
.placa span{display:block;font-weight:700;font-size:13px}
.placa small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.p-faltam{border-left-color:var(--bad)}.p-respondido{border-left-color:var(--ok)}.p-liberado{border-left-color:var(--warn)}.p-aguardando{border-left-color:var(--bad)}.p-perdeu{border-left-color:var(--bad)}.p-sempdi{border-left-color:var(--neutro)}

/* barras */
.barra{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.barra i{display:block;height:100%}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.sups{display:flex;flex-direction:column;gap:6px}
.sup{display:grid;grid-template-columns:130px 1fr 74px 84px;gap:12px;align-items:center;background:transparent;border:0;padding:8px;border-radius:8px;cursor:pointer;text-align:left;width:100%;min-height:44px}
.sup:hover{background:var(--surface2)}
.sup[aria-pressed=true]{background:var(--navybg)}
.sup .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sup .med{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* lojas */
.lojas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.loja{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:left;min-height:74px;display:flex;flex-direction:column;gap:6px}
.loja:hover{border-color:var(--line)}
.loja[aria-pressed=true]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.loja .t{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:13px}
.loja .t span:last-child{font-variant-numeric:tabular-nums}
.loja .barra{height:7px}
.loja small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* lista */
.ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
#busca{flex:1 1 220px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px;min-height:44px}
.limpar{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line)}
th button{background:transparent;border:0;padding:8px;cursor:pointer;font-weight:700;color:var(--muted);min-height:40px}
th[aria-sort] button{color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nome b{display:block}
.nome small{color:var(--muted);font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.c-respondido{background:var(--okbg);color:var(--ok)}
.c-liberado{background:var(--warnbg);color:var(--warn)}
.c-aguardando,.c-nao_feito,.c-nao_respondeu{background:var(--badbg);color:var(--bad)}
.c-sem_pdi{background:var(--neutrobg);color:var(--muted)}
.nota{display:inline-block;min-width:48px;text-align:center;border-radius:8px;padding:4px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.n-a{background:var(--okbg);color:var(--ok)}.n-b{background:var(--warnbg);color:var(--warn)}.n-c{background:var(--badbg);color:var(--bad)}
.traco{color:var(--muted)}
.app-ok{color:var(--ok);font-weight:600}.app-mal{color:var(--bad);font-weight:600}.app-med{color:var(--warn);font-weight:600}
.vazio{padding:22px;text-align:center;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:8px}


.acao{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer;font-size:12px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.acao:hover{background:var(--surface2)}
.ajustar{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;min-height:36px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px}
.prazo-l{display:block;color:var(--muted);font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px)}

.m-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.m-corpo{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fechar{border:0;background:var(--surface2);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:18px;flex:none}
.alerta{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.perg b{display:block;margin-bottom:6px}
.perg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.perg li{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.perg li.certa{border-color:var(--ok);background:var(--okbg)}
.perg li.errada{border-color:var(--bad);background:var(--badbg)}
.perg li small{font-weight:700;white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label,.campo legend{font-weight:700;font-size:13px}
.campo input[type=datetime-local],.campo select{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px;min-height:44px;width:100%}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.opc{display:flex;align-items:center;gap:8px;min-height:36px;font-size:14px;cursor:pointer}
.m-pe{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.btn2{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.m-pe .btn{margin-top:0;min-height:44px}
.btn[disabled]{opacity:.55;cursor:default}
.erro-m{color:var(--bad);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;max-width:90vw}

/* central: abas, gráfico, destaques, ficha */
.abas{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:8px}
.aba{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:84px;transition:background .15s,border-color .15s,transform .15s}
.aba:hover{background:var(--surface2)}.aba:active{transform:scale(.98)}
.aba[aria-pressed=true]{background:var(--navybg);border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.aba-t{font-weight:700;font-size:13px}
.aba-n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.aba-n small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.aba .barra{height:6px}
.barra i+i{margin-left:2px}
.hero-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prazo.quente{background:var(--warnbg);color:var(--warn)}
.compara{font-size:12px;color:var(--muted)}.compara b{color:var(--ink)}
.histo{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.hb{background:transparent;border:0;border-radius:8px;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:128px}
.hb:hover:not([disabled]){background:var(--surface2)}.hb[disabled]{cursor:default}
.hv{font-size:12px;font-weight:700;min-height:17px;font-variant-numeric:tabular-nums}
.hc{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:76px}
.hc i{display:block;width:min(70%,30px);background:var(--navy);border-radius:4px 4px 0 0;transition:height .25s}
.hb.sel{background:var(--navybg)}.hb.sel .hc i{background:var(--accent)}
.hl{font-size:12px;color:var(--muted);font-weight:600}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pess{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pes{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 6px 6px 12px;min-height:40px;cursor:pointer;font-size:13px}
.pes:hover{border-color:var(--navy)}
.pes small{color:var(--muted);font-size:12px}
.pes span{border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.pes.alta span{background:var(--okbg);color:var(--ok)}.pes.baixa span{background:var(--badbg);color:var(--bad)}
tr[data-ficha]{cursor:pointer;transition:background .12s}
tbody tr[data-ficha]:hover{background:var(--surface2)}
.nomeb{display:block;background:transparent;border:0;padding:0;cursor:pointer;text-align:left}
.nomeb b:after{content:" ›";color:var(--muted)}
.f-nota{display:flex;align-items:center;gap:10px}
.nota.grande{font-family:var(--f-display);font-size:26px;padding:8px 14px}
.tempo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tempo li{position:relative;padding:0 0 16px 28px}
.tempo li:last-child{padding-bottom:0}
.tempo li:before{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--neutro);box-sizing:border-box}
.tempo li:not(:last-child):after{content:"";position:absolute;left:9px;top:19px;bottom:1px;width:2px;background:var(--line)}
.tempo li.ok:before{background:var(--ok);border-color:var(--ok)}
.tempo li.mal:before{background:var(--bad);border-color:var(--bad)}
.tempo li.agora:before{border-color:var(--warn);background:var(--warnbg)}
.tempo b{display:block}.tempo small{color:var(--muted);font-size:12px}
.mods{display:flex;flex-direction:column;gap:2px}
.mod{display:grid;grid-template-columns:28px 1fr 150px;gap:12px;align-items:center;background:transparent;border:0;border-radius:8px;padding:8px;cursor:pointer;text-align:left;min-height:52px}
.mod:hover{background:var(--surface2)}.mod[aria-pressed=true]{background:var(--navybg)}
.mod-n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.mod-t{display:flex;flex-direction:column;gap:6px;min-width:0}.mod-t b{font-size:13px}.mod-t .barra{height:8px}
.mod-v{text-align:right;font-variant-numeric:tabular-nums}.mod-v b{display:block}.mod-v small{color:var(--muted);font-size:12px}
.prog{display:flex;align-items:center;gap:8px}.prog .barra{flex:1;min-width:50px;height:8px}.prog b{font-variant-numeric:tabular-nums;font-size:13px}
.hist-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hist-f select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;min-height:42px}
.temas{display:flex;flex-direction:column;gap:10px}
.tema{display:grid;grid-template-columns:minmax(120px,240px) 1fr 74px;gap:12px;align-items:center}
.tema-n{font-weight:600;font-size:13px}.tema .barra{height:10px}.tema-v{text-align:right;font-variant-numeric:tabular-nums}.tema-v b{display:block}.tema-v small{color:var(--muted);font-size:12px}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px}.spark i{display:block;width:8px;border-radius:2px 2px 0 0;background:var(--surface2)}
.spark i.a{background:var(--ok)}.spark i.b{background:var(--warn)}.spark i.c{background:var(--bad)}.spark i.nf{background:var(--neutro)}
.r-prev{display:flex;flex-direction:column;gap:8px}.r-prev img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.avc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.avc:hover{background:var(--surface2)}.avc[aria-pressed=true]{background:var(--navybg);border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.avc>small{color:var(--muted);font-size:12px}.avc .barra{height:6px}
circle.arco{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cresce{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ergue{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.entra>*{animation:sobe .38s both}
.entra>*:nth-child(2){animation-delay:.05s}.entra>*:nth-child(3){animation-delay:.1s}.entra>*:nth-child(4){animation-delay:.15s}.entra>*:nth-child(5){animation-delay:.2s}.entra>*:nth-child(n+6){animation-delay:.25s}
.entra .barra{animation:cresce .7s .1s both}
.entra .hc i{transform-origin:bottom;animation:ergue .55s .15s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){
  .abas{gap:6px;grid-auto-flow:row;grid-template-columns:1fr 1fr}.abas .aba:last-child:nth-child(odd){grid-column:1/-1}.aba{padding:10px;min-height:74px}.aba-n{font-size:19px}
  .mod{grid-template-columns:26px 1fr 92px;gap:8px}
  .tema{grid-template-columns:1fr 62px;gap:4px 8px}.tema .barra{grid-column:1/-1;grid-row:2}
  .abas .aba:last-child:nth-child(odd){grid-column:1/-1}
  .histo{gap:1px}
  td.cacoes{grid-column:1/-1}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .sup{grid-template-columns:82px 1fr 48px}.sup .med{display:none}
  table,tbody,tr,td{display:block;width:100%}thead{display:none}
  tr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
  td{border:0;padding:0;width:auto}
  td.nome{grid-column:1}td.cnota{grid-column:2;grid-row:1;text-align:right}
  td.csit{grid-column:1/-1}td.cpasso,td.capp{grid-column:1/-1;font-size:13px}td.csup{display:none}
  td[data-r]:before{content:attr(data-r)": ";color:var(--muted)}
}

<div class="wrap">

    <div><div class="eyebrow">Avaliações do time</div><h1>Central de Provas</h1><div class="sub" id="sub">&nbsp;</div></div>

<script>
(function(){
  function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}

  var p=(qp('tema')||'').toLowerCase(), t=(p==='claro'||p==='light')?'light':(p==='escuro'||p==='dark')?'dark':null;
  if(!t){ var s=(ls('st_tema')||'').toLowerCase(); t=(s==='light'||s==='claro')?'light':'dark'; }
  window.__setTema=function(tema){ document.documentElement.setAttribute('data-theme',tema); document.documentElement.style.colorScheme=tema;
    var ic=document.getElementById('temaIc'), tx=document.getElementById('temaTx'); if(ic) ic.textContent=tema==='light'?'☀️':'🌙'; if(tx) tx.textContent=tema==='light'?'Claro':'Escuro';
    try{localStorage.setItem('st_tema',tema);}catch(e){} try{ if(window.parent&&window.parent!==window) window.parent.postMessage({st_tema:tema},'*'); }catch(e){} };
  window.__setTema(t);
  window.addEventListener('message',function(ev){ var d=ev&&ev.data; if(d&&(d.st_tema==='light'||d.st_tema==='dark')) window.__setTema(d.st_tema); });
  document.getElementById('btnTema').onclick=function(){ window.__setTema(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); };
})();
</script>
<script src="st-hora.js?v=1"></script>
<script src="st-dados.js?v=93"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   CENTRAL DE PROVAS — quem fez, quem não fez e as notas das provas.
   Vendedores, gerentes e supervisores. Usa as ações 'semana', 'semanaGer',
   'semanaSup' e 'acessos' do Servidor de Dados ST,
   que já devolvem o recorte de cada perfil (rede / carteira / loja).
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();};
  var nm=function(s){return String(s||'').replace(/\s+-\s+\S.*$/,'').replace(/\s+\d+\s*$/,'').replace(/\s+/g,' ').trim();};
  var dBr=function(iso){var p=String(iso||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]:'';};
  var virg=function(n){return n.toFixed(1).replace('.',',');};

  var GRUPO={respondido:'respondido',liberado:'liberado',aguardando:'aguardando',nao_feito:'perdeu',nao_respondeu:'perdeu',sem_pdi:'sempdi'};
  var ORDEM={liberado:1,aguardando:2,nao_respondeu:3,nao_feito:4,sem_pdi:5,respondido:6};

  var S=null, AC=null, SEM='', F={g:'',sup:'',loja:'',q:'',nota:null}, SORT={c:'sit',d:1}, GESTAO=false, ACMAP=null, ACGER=null, ACSUP=null, ACP=null, GERD=null, SUPD=null, TIPO='vend';

  function lev(a,b){ var m=a.length,n=b.length,d=[],i,j; for(j=0;j<=n;j++) d[j]=j;
    for(i=1;i<=m;i++){ var ant=d[0]; d[0]=i; for(j=1;j<=n;j++){ var t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,ant+(a[i-1]===b[j-1]?0:1)); ant=t; } } return d[n]; }
  /* o nome no PDI e no cadastro às vezes difere uma letra (Luiz Mateus/Matheus): mesma loja + até 2 letras = mesma pessoa */
  function acharPessoa(loja,nome){
    if(!ACMAP) return null;
    var L=ACMAP[loja]||[], n=norm(nome), i, melhor=null, md=3;
    for(i=0;i<L.length;i++){ if(L[i].n===n) return L[i]; }
    for(i=0;i<L.length;i++){ var dd=lev(L[i].n,n); if(dd<md){ md=dd; melhor=L[i]; } }
    return melhor;
  }
  function statusApp(p){
    if(!p) return null;
    if(p.liberado===false&&!p.acessos) return {t:'Sem acesso liberado',c:'app-mal',o:0};
    if(!p.acessos) return {t:'Nunca entrou',c:'app-mal',o:1};
    if(p.hoje) return {t:'Entrou hoje',c:'app-ok',o:4};
    if(p.d7>0) return {t:'Ativo na semana',c:'app-ok',o:3};
    return {t:'Sumido há 7+ dias',c:'app-med',o:2};
  }
  function supDe(loja){ return (AC&&AC.lojaSup&&AC.lojaSup[loja])||''; }

  /* ── quem conduz e quem responde em cada tipo de prova ── */
  var TIPOS={
    vend:{aba:'Vendedores',um:'vendedor',plural:'vendedores',cond:'gerente',aval:'vendedor',Cond:'Gerente',Aval:'Vendedor'},
    ger:{aba:'Gerentes',um:'gerente',plural:'gerentes',cond:'supervisor',aval:'gerente',Cond:'Supervisor',Aval:'Gerente'},
    sup:{aba:'Supervisores',um:'supervisor',plural:'supervisores',cond:'coordenação',aval:'supervisor',Cond:'Coordenação',Aval:'Supervisor'}
  };
  function rotSit(s,t){ var T=TIPOS[t]; return {respondido:'Fez a prova',liberado:'Prova aberta',aguardando:T.Cond+' não fez o PDI',nao_feito:'PDI não feito no prazo',nao_respondeu:'Não respondeu no prazo',sem_pdi:'Sem PDI gerado'}[s]||s; }
  function passoSit(s,t){ var T=TIPOS[t]; return {respondido:'Concluído',liberado:T.Aval+' responder a prova',aguardando:T.Cond+' fazer o PDI e liberar',nao_feito:'Prazo perdido ('+T.cond+')',nao_respondeu:'Prazo perdido ('+T.aval+')',sem_pdi:'Conferir o cadastro'}[s]||''; }
  function quando(){ return SEM===S.atual?'atual':'anterior'; }
  function fonte(t){ return t==='ger'?GERD:t==='sup'?SUPD:S; }
  function semanaDe(t,q){ var D=fonte(t); return D?(q==='anterior'?D.anterior:D.atual):''; }

  /* linhas cruas de um tipo numa semana, no mesmo formato para os três */
  function cru(t,q){
    var D=fonte(t); if(!D) return [];
    var sem=semanaDe(t,q), L=(D.linhas||[]).filter(function(x){return x.semana===sem;});
    if(t==='ger') return L.map(function(x){ var f=x.ficha||{}, lj=String(x.loja);
      return {tipo:t,chave:x.chave,nome:nm(x.gerente||f.gerente||'Gerente'),loja:lj,lojaNome:(AC&&AC.lojaNome&&AC.lojaNome[lj])||'',sup:supDe(lj)||nm(f.supervisor||''),sit:x.situacao||'sem_pdi',aval:x.aval||null,prazo:x.situacao==='aguardando'?(x.prazoFeito||''):(x.prazoAval||''),feito:x.feito_em||'',feitoPor:x.feito_por||'',q:x.questoes||null}; });
    if(t==='sup') return L.filter(function(x){return S.perfil!=='sup'||x.meu;}).map(function(x){ var d=x.dados||{};
      return {tipo:t,chave:x.chave,nome:nm(x.supervisor),loja:'',lojaNome:d.carteira?d.carteira.lojas+' lojas na carteira':'',sup:nm(x.supervisor),sit:x.situacao||'sem_pdi',aval:x.aval||null,prazo:x.situacao==='aguardando'?(d.prazoFeito||''):(x.prazoAval||''),feito:x.feito_em||'',feitoPor:x.feito_por||'',q:x.questoes||null,plano:!!x.plano}; });
    return L.map(function(l){ return {tipo:t,chave:l.chave,nome:nm(l.comp&&l.comp.nome?l.comp.nome:l.vendedor),loja:String(l.loja),lojaNome:(AC&&AC.lojaNome&&AC.lojaNome[String(l.loja)])||'',sup:supDe(l.loja),sit:l.situacao,aval:l.aval||null,prazo:l.prazo,feito:l.feito_em||'',feitoPor:l.feito_por||''}; });
  }
  function linhasDaSemana(){
    if(ACMAP){ Object.keys(ACMAP).forEach(function(k){ ACMAP[k].forEach(function(x){ x.usado=false; }); }); }
    var q=quando(), R=cru(TIPO,q);
    R.forEach(function(r){
      if(TIPO==='vend'){ var p=acharPessoa(r.loja,r.nome); if(p){ p.usado=true; if(!r.lojaNome) r.lojaNome=p.p.lojaNome||''; } r.app=statusApp(p&&p.p); }
      else if(TIPO==='ger'){ var g=(ACGER&&ACGER[r.loja])||null; r.app=statusApp(g); }
      else { r.app=statusApp((ACSUP&&ACSUP[norm(r.nome)])||null); }
    });
    if(TIPO==='vend'&&ACMAP&&q==='atual') Object.keys(ACMAP).forEach(function(k){ ACMAP[k].forEach(function(x){
      if(!x.usado) R.push({tipo:'vend',chave:'',nome:nm(x.p.nome),loja:String(x.p.loja),lojaNome:x.p.lojaNome,sup:x.p.sup||'',sit:'sem_pdi',aval:null,prazo:'',feito:'',app:statusApp(x.p)});
    }); });
    R.forEach(function(r,i){ r.i=i; });
    return R;
  }
  function notaDe(r){ return r.aval&&r.aval.total?r.aval.nota/r.aval.total*10:null; }
  function media(L){ var a=L.map(notaDe).filter(function(x){return x!=null;}); return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null; }
  function conta(L){ var o={respondido:0,liberado:0,aguardando:0,perdeu:0,sempdi:0}; L.forEach(function(r){ o[GRUPO[r.sit]||'perdeu']++; }); return o; }
  function validos(L){ return L.filter(function(r){return r.sit!=='sem_pdi';}); }

  var REDUZ=false; try{ REDUZ=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var ENTRA=true;

  function anel(c,n){
    var R=62, C=2*Math.PI*R, off=0, seg=function(v,cor){ if(!v) return ''; var l=v/n*C, da=l+' '+(C-l), s='<circle class="arco" data-d="'+da+'" cx="75" cy="75" r="'+R+'" fill="none" stroke="var('+cor+')" stroke-width="16" stroke-dasharray="'+((ENTRA&&!REDUZ)?'0 '+C:da)+'" stroke-dashoffset="'+(-off)+'"/>'; off+=l; return s; };
    return '<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--surface2)" stroke-width="16"/>'+seg(c.respondido,'--ok')+seg(c.liberado,'--warn')+'</svg>';
  }
  function barra(c,n){ if(!n) return '<div class="barra"></div>'; var w=function(v){return (v/n*100)+'%';};
    return '<div class="barra"><i class="b-ok" style="width:'+w(c.respondido)+'"></i><i class="b-warn" style="width:'+w(c.liberado)+'"></i><i class="b-bad" style="width:'+w(c.aguardando+c.perdeu)+'"></i></div>'; }
  function prazoMax(L){ return L.map(function(r){return r.prazo;}).filter(Boolean).sort().pop()||''; }
  function ms(p){ return new Date(String(p).replace(' ','T').slice(0,16)+':00-03:00').getTime(); }
  function textoPrazo(p){
    if(!p) return {t:'',q:false};
    var agora=String(S.agora||''), dia=p.slice(0,10), h=p.slice(11,16).replace(':','h').replace('h00','h');
    var d=dia===agora.slice(0,10)?'hoje':dBr(dia);
    var resta=ms(p)-ms(agora)-(Date.now()-CARGA);
    if(!agora||isNaN(resta)) return {t:'Prazo: '+d+', até '+h,q:false};
    if(resta<=0) return {t:'Prazo encerrado ('+d+', '+h+')',q:false};
    var min=Math.ceil(resta/60000), hs=Math.floor(min/60), dd=Math.floor(hs/24);
    var f=dd>=1?dd+(dd>1?' dias':' dia')+(hs%24?' e '+(hs%24)+'h':''):hs?hs+'h'+String(min%60).padStart(2,'0'):min+' min';
    return {t:'Faltam '+f+' · '+d+', até '+h,q:resta<3*3600000};
  }
  var CARGA=Date.now(), PRAZO_HERO='';
  setInterval(function(){ var e=$('contagem'); if(!e||!S) return; var x=textoPrazo(PRAZO_HERO); e.textContent=x.t; e.classList.toggle('quente',x.q); },30000);

  function frase(c,n){
    var T=TIPOS[TIPO];
    if(!n) return 'Ainda não há PDI gerado nesta semana.';
    var falta=n-c.respondido;
    if(!falta) return '<em class="ok">Todo mundo fez a prova.</em>';
    var p=[]; if(c.aguardando) p.push(c.aguardando+(c.aguardando>1?' dependem':' depende')+' d'+(TIPO==='sup'?'a':'o')+' '+T.cond);
    if(c.liberado) p.push(c.liberado+(c.liberado>1?' dependem':' depende')+' do '+T.aval);
    if(c.perdeu) p.push(c.perdeu+(c.perdeu>1?' perderam':' perdeu')+' o prazo');
    return '<em>'+(falta>1?'Faltam '+falta+' provas':'Falta 1 prova')+'.</em> '+p.join(', ')+'.';
  }
  function placa(g,num,tit,obs){ return '<button type="button" class="placa p-'+g+'" data-g="'+g+'" aria-pressed="'+(F.g===g)+'"><b data-n="'+num+'">'+num+'</b><span>'+tit+'</span><small>'+obs+'</small></button>'; }
  function abas(){
    var ts=['vend','ger','sup'].filter(function(t){return cru(t,'atual').length||cru(t,'anterior').length;});
    var trilha='<button type="button" class="aba" data-tipo="mentor" aria-pressed="'+(TIPO==='mentor')+'"><span class="aba-t">Trilha Mentor</span>'+(MT?'<span class="aba-n">'+ctMT(MT.L).aprovado+' <small>de '+MT.L.length+'</small></span>'+barraMT(ctMT(MT.L),MT.L.length):'<span class="aba-n"><small>Toque para abrir</small></span>')+'</button>';
    return '<nav class="abas" aria-label="Tipo de prova">'+ts.map(function(t){
      var L=validos(cru(t,(TIPO==='mentor'||TIPO==='avulsa'||TIPO==='hist')?'atual':quando())), c=conta(L), n=L.length, nomeAba=(t==='ger'&&S.perfil==='ger')||(t==='sup'&&S.perfil==='sup')?'Minha prova':TIPOS[t].aba;
      return '<button type="button" class="aba" data-tipo="'+t+'" aria-pressed="'+(TIPO===t)+'"><span class="aba-t">'+nomeAba+'</span><span class="aba-n">'+c.respondido+' <small>de '+n+'</small></span>'+barra(c,n)+'</button>';
    }).join('')+trilha+'<button type="button" class="aba" data-tipo="avulsa" aria-pressed="'+(TIPO==='avulsa')+'"><span class="aba-t">Avulsas</span><span class="aba-n">'+(AV?AV.provas.length+' <small>'+(AV.provas.length===1?'prova':'provas')+'</small>':'<small>Toque para abrir</small>')+'</span></button><button type="button" class="aba" data-tipo="hist" aria-pressed="'+(TIPO==='hist')+'"><span class="aba-t">Histórico</span><span class="aba-n">'+(H?H.semanas.length+' <small>'+(H.semanas.length===1?'semana':'semanas')+'</small>':'<small>Toque para abrir</small>')+'</span></button></nav>';
  }
  function histograma(base){
    var nt=base.filter(function(r){return notaDe(r)!=null;}); if(nt.length<3) return '';
    var B=[], i; for(i=0;i<=10;i++) B[i]=0; nt.forEach(function(r){ B[Math.round(notaDe(r))]++; });
    var mx=Math.max.apply(null,B);
    return '<section class="card"><div class="card-top"><h2>Distribuição das notas</h2><span class="sub">Toque numa nota para ver quem tirou.</span></div><div class="histo">'+
      B.map(function(v,k){ var sel=F.nota===k; return '<button type="button" class="hb'+(sel?' sel':'')+'" data-nota="'+k+'" aria-pressed="'+sel+'" aria-label="Nota '+k+': '+v+(v===1?' pessoa':' pessoas')+'" title="Nota '+k+': '+v+(v===1?' pessoa':' pessoas')+'"'+(v?'':' disabled')+'><span class="hv">'+(v||'')+'</span><span class="hc"><i style="height:'+(v?Math.max(6,v/mx*100):0)+'%"></i></span><span class="hl">'+k+'</span></button>'; }).join('')+'</div></section>';
  }
  function nomesChips(L,cls){ var m=6, h=L.slice(0,m).map(function(r){return '<button type="button" class="pes '+cls+'" data-ficha="'+r.i+'"><b>'+esc(r.nome.split(' ').slice(0,2).join(' '))+'</b>'+(r.loja?'<small>'+esc(r.loja)+'</small>':'')+'<span>'+r.aval.nota+'/'+r.aval.total+'</span></button>';}).join(''); if(L.length>m) h+='<span class="sub">e mais '+(L.length-m)+'</span>'; return h; }
  function destaques(base){
    var nt=base.filter(function(r){return notaDe(r)!=null;}); if(nt.length<3) return '';
    var top=nt.filter(function(r){return notaDe(r)>=9;}).sort(function(a,b){return notaDe(b)-notaDe(a);});
    var bx=nt.filter(function(r){return notaDe(r)<6;}).sort(function(a,b){return notaDe(a)-notaDe(b);});
    if(!top.length&&!bx.length) return '';
    return '<section class="duo">'+
      (top.length?'<div class="card"><div class="card-top"><h2>🏆 Quadro de honra</h2><span class="sub">nota 9 ou mais</span></div><div class="pess">'+nomesChips(top,'alta')+'</div></div>':'')+
      (bx.length?'<div class="card"><div class="card-top"><h2>🎯 Para reforçar</h2><span class="sub">nota abaixo de 6</span></div><div class="pess">'+nomesChips(bx,'baixa')+'</div></div>':'')+'</section>';
  }

  function montar(){
    if(TIPO==='mentor'){ montarTrilha(); return; }
    if(TIPO==='avulsa'){ montarAvulsas(); return; }
    if(TIPO==='hist'){ montarHist(); return; }
    var TUDO=linhasDaSemana(), comPdi=validos(TUDO), T=TIPOS[TIPO];
    var base=comPdi.filter(function(r){return (!F.sup||r.sup===F.sup)&&(!F.loja||r.loja===F.loja);});
    var cBase=conta(base), n=base.length, pct=n?Math.round(cBase.respondido/n*100):0, med=media(base);
    var sem=TUDO.filter(function(r){return r.sit==='sem_pdi'&&(!F.sup||r.sup===F.sup)&&(!F.loja||r.loja===F.loja);}).length;
    var h=abas();
    var titulo=F.loja?'Loja '+F.loja:F.sup?'Carteira de '+F.sup:S.perfil==='sup'?'Sua carteira':S.perfil==='ger'?'Sua loja':'Rede Só Tintas';
    $('sub').textContent=titulo+' · semana de '+dBr(semanaDe(TIPO,quando()))+(S.agora?' · posição das '+String(S.agora).slice(11,16):'');
    PRAZO_HERO=prazoMax(base); var pz=textoPrazo(PRAZO_HERO);
    /* a semana atual ainda está em andamento: mostra quanto a anterior fechou, sem seta de sobe/desce */
    var compara='';
    if(quando()==='atual'){ var ant=validos(cru(TIPO,'anterior')).filter(function(r){return (!F.sup||r.sup===F.sup)&&(!F.loja||r.loja===F.loja);});
      if(ant.length){ var ca=conta(ant), ma=media(ant); compara='<span class="compara">Semana passada fechou em <b>'+Math.round(ca.respondido/ant.length*100)+'%</b>'+(ma!=null?' · média <b>'+virg(ma)+'</b>':'')+'</span>'; } }
    h+='<section class="card hero"><div class="anel">'+anel(cBase,n||1)+'<div class="cen"><b><span data-n="'+pct+'">'+pct+'</span>%</b><small>'+cBase.respondido+' de '+n+'</small></div></div>'+
       '<div><p class="frase">'+frase(cBase,n)+'</p><div class="hero-l">'+(pz.t?'<span class="prazo'+(pz.q?' quente':'')+'" id="contagem">'+esc(pz.t)+'</span>':'')+(podePrazo()&&TIPO==='vend'&&n?'<button type="button" class="ajustar" data-abrirprazo="1">Ajustar prazo</button>':'')+compara+'</div></div></section>';
    h+='<section class="placas" aria-label="Filtrar por situação">'+
      placa('respondido',cBase.respondido,'Fizeram a prova',med!=null?'média '+virg(med):'sem notas ainda')+
      /* Atalho de cobrança: junta num só lugar todo mundo que ainda não fez —
         prova aberta, PDI travado e prazo perdido. As placas de baixo continuam
         separando o motivo; esta responde "quem eu preciso cobrar". */
      ((((cBase.liberado?1:0)+(cBase.aguardando?1:0)+(cBase.perdeu?1:0))>1)?placa('faltam',cBase.liberado+cBase.aguardando+cBase.perdeu,'Ainda não fez','todos os pendentes juntos'):'')+
      (SEM===S.atual?placa('liberado',cBase.liberado,'Prova aberta','falta o '+T.aval+' responder')+placa('aguardando',cBase.aguardando,T.Cond+' não fez o PDI','a prova nem abriu'):'')+
      (cBase.perdeu||SEM!==S.atual?placa('perdeu',cBase.perdeu,'Perderam o prazo','não fizeram a tempo'):'')+
      (sem?placa('sempdi',sem,'Sem PDI gerado','conferir o cadastro'):'')+'</section>';
    h+=histograma(base)+destaques(base);

    if(TIPO!=='sup'){
      var sups={}; comPdi.forEach(function(r){ if(r.sup)(sups[r.sup]=sups[r.sup]||[]).push(r); });
      var ks=Object.keys(sups);
      if(ks.length>1&&!F.loja){
        var RS=ks.map(function(k){var c=conta(sups[k]);return {k:k,c:c,n:sups[k].length,m:media(sups[k]),p:c.respondido/sups[k].length};}).sort(function(a,b){return b.p-a.p||b.n-a.n;});
        h+='<section class="card"><div class="card-top"><h2>Por supervisor</h2><div class="legenda"><span><i class="b-ok"></i>fez</span><span><i class="b-warn"></i>prova aberta</span><span><i class="b-bad"></i>pendente do '+T.cond+' ou prazo perdido</span></div></div><div class="sups">'+
          RS.map(function(x){return '<button type="button" class="sup" data-sup="'+esc(x.k)+'" aria-pressed="'+(F.sup===x.k)+'"><b>'+esc(x.k)+'</b>'+barra(x.c,x.n)+'<span class="num">'+x.c.respondido+' de '+x.n+'</span><span class="med">'+(x.m!=null?'média '+virg(x.m):'')+'</span></button>';}).join('')+'</div></section>';
      }
      var lojas={}; comPdi.filter(function(r){return !F.sup||r.sup===F.sup;}).forEach(function(r){ (lojas[r.loja]=lojas[r.loja]||[]).push(r); });
