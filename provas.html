<!doctype html><html lang="pt-BR" data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Provas · Só Tintas</title>
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f1522; --surface:#1a2336; --surface2:#222d44; --ink:#eef2fb; --muted:#9aa5bb; --line:#2c3850;
  --accent:#ff3b47; --navy:#6f95f5; --ok:#3fbf7f; --bad:#ff6b6b; --warn:#ffab5e; --neutro:#7c89a3;
  --okbg:#12301f; --badbg:#3a1a20; --warnbg:#3a2717; --navybg:#1e2b4d; --neutrobg:#2a3550;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f8; --ink:#16233d; --muted:#5a677f; --line:#e4e9f3;
  --navy:#1C3F8F; --ok:#178048; --bad:#c42a22; --warn:#b35600; --neutro:#7a869c;
  --okbg:#e1f3e8; --badbg:#fdeceb; --warnbg:#ffefdd; --navybg:#e7edf9; --neutrobg:#e9edf4;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.topbar{height:8px;background:var(--accent);border-radius:0 0 6px 6px;margin:-20px 0 4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.05;margin:4px 0 0;color:var(--accent)}
h2{font-family:var(--f-display);font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed=true]{background:var(--navybg);color:var(--ink)}
.btema{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:42px;cursor:pointer;font-weight:600;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:10px}

/* resumo */
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.anel{position:relative;width:150px;height:150px}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .cen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anel b{font-family:var(--f-display);font-size:34px;line-height:1}
.anel small{color:var(--muted);font-size:12px;margin-top:2px}
.frase{font-family:var(--f-display);font-size:clamp(18px,2.6vw,23px);font-weight:600;line-height:1.2;margin:0 0 8px}
.frase em{font-style:normal;color:var(--bad)}.frase em.ok{color:var(--ok)}
.prazo{display:inline-block;background:var(--surface2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}

/* placas de situação */
.placas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.placa{text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px;cursor:pointer;min-height:92px}
.placa:hover{background:var(--surface2)}
.placa[aria-pressed=true]{outline:2px solid var(--navy);outline-offset:1px}
.placa b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.05}
.placa span{display:block;font-weight:700;font-size:13px}
.placa small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.p-respondido{border-left-color:var(--ok)}.p-liberado{border-left-color:var(--warn)}.p-aguardando{border-left-color:var(--bad)}.p-perdeu{border-left-color:var(--bad)}.p-sempdi{border-left-color:var(--neutro)}

/* barras */
.barra{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.barra i{display:block;height:100%}
.b-ok{background:var(--ok)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.sups{display:flex;flex-direction:column;gap:6px}
.sup{display:grid;grid-template-columns:130px 1fr 74px 84px;gap:12px;align-items:center;background:transparent;border:0;padding:8px;border-radius:8px;cursor:pointer;text-align:left;width:100%;min-height:44px}
.sup:hover{background:var(--surface2)}
.sup[aria-pressed=true]{background:var(--navybg)}
.sup .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sup .med{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* lojas */
.lojas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.loja{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:left;min-height:74px;display:flex;flex-direction:column;gap:6px}
.loja:hover{border-color:var(--line)}
.loja[aria-pressed=true]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.loja .t{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:13px}
.loja .t span:last-child{font-variant-numeric:tabular-nums}
.loja .barra{height:7px}
.loja small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* lista */
.ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
#busca{flex:1 1 220px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px;min-height:44px}
.limpar{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:700;padding:0;border-bottom:1px solid var(--line)}
th button{background:transparent;border:0;padding:8px;cursor:pointer;font-weight:700;color:var(--muted);min-height:40px}
th[aria-sort] button{color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.nome b{display:block}
.nome small{color:var(--muted);font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.c-respondido{background:var(--okbg);color:var(--ok)}
.c-liberado{background:var(--warnbg);color:var(--warn)}
.c-aguardando,.c-nao_feito,.c-nao_respondeu{background:var(--badbg);color:var(--bad)}
.c-sem_pdi{background:var(--neutrobg);color:var(--muted)}
.nota{display:inline-block;min-width:48px;text-align:center;border-radius:8px;padding:4px 8px;font-weight:800;font-variant-numeric:tabular-nums}
.n-a{background:var(--okbg);color:var(--ok)}.n-b{background:var(--warnbg);color:var(--warn)}.n-c{background:var(--badbg);color:var(--bad)}
.traco{color:var(--muted)}
.app-ok{color:var(--ok);font-weight:600}.app-mal{color:var(--bad);font-weight:600}.app-med{color:var(--warn);font-weight:600}
.vazio{padding:22px;text-align:center;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:8px}


.acao{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer;font-size:12px;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.acao:hover{background:var(--surface2)}
.ajustar{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;min-height:36px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px}
.prazo-l{display:block;color:var(--muted);font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,9,18,.65)}
.m-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.m-corpo{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fechar{border:0;background:var(--surface2);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:18px;flex:none}
.alerta{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.perg b{display:block;margin-bottom:6px}
.perg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.perg li{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.perg li.certa{border-color:var(--ok);background:var(--okbg)}
.perg li.errada{border-color:var(--bad);background:var(--badbg)}
.perg li small{font-weight:700;white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label,.campo legend{font-weight:700;font-size:13px}
.campo input[type=datetime-local],.campo select{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px;min-height:44px;width:100%}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.opc{display:flex;align-items:center;gap:8px;min-height:36px;font-size:14px;cursor:pointer}
.m-pe{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.btn2{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.m-pe .btn{margin-top:0;min-height:44px}
.btn[disabled]{opacity:.55;cursor:default}
.erro-m{color:var(--bad);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;max-width:90vw}

/* central: abas, gráfico, destaques, ficha */
.abas{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:8px}
.aba{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:84px;transition:background .15s,border-color .15s,transform .15s}
.aba:hover{background:var(--surface2)}.aba:active{transform:scale(.98)}
.aba[aria-pressed=true]{background:var(--navybg);border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.aba-t{font-weight:700;font-size:13px}
.aba-n{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.aba-n small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.aba .barra{height:6px}
.barra i+i{margin-left:2px}
.hero-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prazo.quente{background:var(--warnbg);color:var(--warn)}
.compara{font-size:12px;color:var(--muted)}.compara b{color:var(--ink)}
.histo{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.hb{background:transparent;border:0;border-radius:8px;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:128px}
.hb:hover:not([disabled]){background:var(--surface2)}.hb[disabled]{cursor:default}
.hv{font-size:12px;font-weight:700;min-height:17px;font-variant-numeric:tabular-nums}
.hc{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:76px}
.hc i{display:block;width:min(70%,30px);background:var(--navy);border-radius:4px 4px 0 0;transition:height .25s}
.hb.sel{background:var(--navybg)}.hb.sel .hc i{background:var(--accent)}
.hl{font-size:12px;color:var(--muted);font-weight:600}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pess{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pes{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 6px 6px 12px;min-height:40px;cursor:pointer;font-size:13px}
.pes:hover{border-color:var(--navy)}
.pes small{color:var(--muted);font-size:12px}
.pes span{border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.pes.alta span{background:var(--okbg);color:var(--ok)}.pes.baixa span{background:var(--badbg);color:var(--bad)}
tr[data-ficha]{cursor:pointer;transition:background .12s}
tbody tr[data-ficha]:hover{background:var(--surface2)}
.nomeb{display:block;background:transparent;border:0;padding:0;cursor:pointer;text-align:left}
.nomeb b:after{content:" ›";color:var(--muted)}
.f-nota{display:flex;align-items:center;gap:10px}
.nota.grande{font-family:var(--f-display);font-size:26px;padding:8px 14px}
.tempo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tempo li{position:relative;padding:0 0 16px 28px}
.tempo li:last-child{padding-bottom:0}
.tempo li:before{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--neutro);box-sizing:border-box}
.tempo li:not(:last-child):after{content:"";position:absolute;left:9px;top:19px;bottom:1px;width:2px;background:var(--line)}
.tempo li.ok:before{background:var(--ok);border-color:var(--ok)}
.tempo li.mal:before{background:var(--bad);border-color:var(--bad)}
.tempo li.agora:before{border-color:var(--warn);background:var(--warnbg)}
.tempo b{display:block}.tempo small{color:var(--muted);font-size:12px}
.mods{display:flex;flex-direction:column;gap:2px}
.mod{display:grid;grid-template-columns:28px 1fr 150px;gap:12px;align-items:center;background:transparent;border:0;border-radius:8px;padding:8px;cursor:pointer;text-align:left;min-height:52px}
.mod:hover{background:var(--surface2)}.mod[aria-pressed=true]{background:var(--navybg)}
.mod-n{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.mod-t{display:flex;flex-direction:column;gap:6px;min-width:0}.mod-t b{font-size:13px}.mod-t .barra{height:8px}
.mod-v{text-align:right;font-variant-numeric:tabular-nums}.mod-v b{display:block}.mod-v small{color:var(--muted);font-size:12px}
.prog{display:flex;align-items:center;gap:8px}.prog .barra{flex:1;min-width:50px;height:8px}.prog b{font-variant-numeric:tabular-nums;font-size:13px}
circle.arco{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cresce{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ergue{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.entra>*{animation:sobe .38s both}
.entra>*:nth-child(2){animation-delay:.05s}.entra>*:nth-child(3){animation-delay:.1s}.entra>*:nth-child(4){animation-delay:.15s}.entra>*:nth-child(5){animation-delay:.2s}.entra>*:nth-child(n+6){animation-delay:.25s}
.entra .barra{animation:cresce .7s .1s both}
.entra .hc i{transform-origin:bottom;animation:ergue .55s .15s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){
  .abas{gap:6px;grid-auto-flow:row;grid-template-columns:1fr 1fr}.aba{padding:10px;min-height:74px}.aba-n{font-size:19px}
  .mod{grid-template-columns:26px 1fr 92px;gap:8px}
  .histo{gap:1px}
  td.cacoes{grid-column:1/-1}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .sup{grid-template-columns:82px 1fr 48px}.sup .med{display:none}
  table,tbody,tr,td{display:block;width:100%}thead{display:none}
  tr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
  td{border:0;padding:0;width:auto}
  td.nome{grid-column:1}td.cnota{grid-column:2;grid-row:1;text-align:right}
  td.csit{grid-column:1/-1}td.cpasso,td.capp{grid-column:1/-1;font-size:13px}td.csup{display:none}
  td[data-r]:before{content:attr(data-r)": ";color:var(--muted)}
}

<script>
(function(){

<script>
/* ═══════════════════════════════════════════════════════════════
   CENTRAL DE PROVAS — quem fez, quem não fez e as notas das provas.
   Vendedores, gerentes e supervisores. Usa as ações 'semana', 'semanaGer',
   'semanaSup' e 'acessos' do Servidor de Dados ST,
   que já devolvem o recorte de cada perfil (rede / carteira / loja).
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();};
  var nm=function(s){return String(s||'').replace(/\s+-\s+\S.*$/,'').replace(/\s+\d+\s*$/,'').replace(/\s+/g,' ').trim();};

    var bl=$('limpar'); if(bl) bl.hidden=!(F.g||F.sup||F.loja||F.q||F.mod);
    var q=norm(F.q), L=MT.L.filter(function(r){ return (!F.g||r.sit===F.g)&&(!F.sup||r.sup===F.sup)&&(!F.loja||r.loja===F.loja)&&(!F.mod||r.mods.some(function(x){return x.id===F.mod&&!x.ok;})&&r.sit!=='nao_iniciou')&&(!q||norm(r.nome+' '+r.loja+' '+r.lojaNome).indexOf(q)>=0); });
    var d=SORT.d, cmp={ sit:function(a,b){return (MT_ORD[a.sit]-MT_ORD[b.sit])*d||b.feitos-a.feitos||(a.loja<b.loja?-1:1);}, nome:function(a,b){return norm(a.nome)<norm(b.nome)?-d:d;}, sup:function(a,b){return (a.sup<b.sup?-d:a.sup>b.sup?d:0)||(a.loja<b.loja?-1:1);}, trilha:function(a,b){return (a.feitos-b.feitos)*d;}, final:function(a,b){ if(a.final==null&&b.final==null) return 0; if(a.final==null) return 1; if(b.final==null) return -1; return (a.final-b.final)*d; }, ult:function(a,b){ var x=a.parado==null?9e9:a.parado,y=b.parado==null?9e9:b.parado; return (x-y)*d; } }[SORT.c]||function(){return 0;};
    L.sort(cmp);
    var c=$('contLista'); if(c) c.textContent=L.length+(L.length===1?' pessoa':' pessoas');
    if(!L.length){ $('lista').innerHTML='<div class="vazio">Ninguém nesse filtro.</div>'; return; }
    var temSup=S.perfil!=='sup'&&S.perfil!=='ger', th=function(k,t){return '<th'+(SORT.c===k?' aria-sort="'+(d>0?'ascending':'descending')+'"':'')+'><button type="button" data-sort="'+k+'">'+t+(SORT.c===k?(d>0?' ▲':' ▼'):'')+'</button></th>';};
    $('lista').innerHTML='<table><thead><tr>'+th('nome','Colaborador')+(temSup?th('sup','Supervisor'):'')+th('sit','Situação')+th('trilha','Módulos')+th('final','Final')+th('ult','Último estudo')+'</tr></thead><tbody>'+L.map(function(r){ var p=r.total?r.feitos/r.total*100:0;
      return '<tr data-ficha="'+r.i+'"><td class="nome"><button type="button" class="nomeb" data-ficha="'+r.i+'"><b>'+esc(r.nome)+'</b></button><small>'+(r.loja?'Loja '+esc(r.loja)+(r.lojaNome?' · '+esc(r.lojaNome):''):'')+'</small></td>'+(temSup?'<td class="csup">'+esc(r.sup)+'</td>':'')+'<td class="csit"><span class="chip c-'+MT_CHIP[r.sit]+'">'+MT_ROT[r.sit]+'</span></td><td class="cpasso"><span class="prog"><span class="barra"><i class="b-ok" style="width:'+p+'%"></i></span><b>'+r.feitos+'/'+r.total+'</b></span></td><td class="cnota">'+(r.final!=null?'<span class="nota '+(r.final>=8?'n-a':r.final>=6?'n-b':'n-c')+'">'+virg(r.final)+'</span>':'<span class="traco">—</span>')+'</td><td class="capp" data-r="Último estudo">'+diasTxt(r)+'</td></tr>'; }).join('')+'</tbody></table>';
  }
  function fichaTrilha(r){
    var h=r.final!=null?'<div class="f-nota"><span class="nota grande '+(r.final>=8?'n-a':r.final>=6?'n-b':'n-c')+'">'+virg(r.final)+'</span><span class="sub">avaliação final</span></div>':(r.finalT?'<div class="alerta">Fez a avaliação final '+r.finalT+(r.finalT>1?' vezes':' vez')+' e ainda não passou.</div>':'');
    if(r.semRegistro) h+='<div class="alerta">Ainda não abriu o Mentor neste cadastro.</div>';
    h+='<ol class="tempo">'+r.mods.map(function(x){ var s=x.ok?'Aprovado'+(x.nota!=null?' · nota '+virg(x.nota):''):x.falhou?'Reprovado, precisa refazer':'Pendente'; if(x.tent) s+=' · '+x.tent+(x.tent>1?' tentativas':' tentativa'); return '<li class="'+(x.ok?'ok':x.falhou?'mal':'')+'"><b>'+esc(x.titulo)+'</b><small>'+esc(s)+'</small></li>'; }).join('')+'</ol><p class="sub" style="margin:0">Último estudo: '+esc(diasTxt(r))+'</p>';
    abrirDlg(r.nome,(r.loja?'Loja '+r.loja+(r.lojaNome?' · '+r.lojaNome:'')+' · ':'')+MT_ROT[r.sit]+' · '+r.feitos+'/'+r.total+' módulos',h);
  }
  function cobrancaTrilha(){
    var L=baseMT().filter(function(r){return r.sit==='refazer'||r.sit==='nao_iniciou';}); if(!L.length){ toast('Ninguém pendente nesse filtro.'); return; }
    L.sort(function(a,b){return (a.loja<b.loja?-1:a.loja>b.loja?1:0)||(norm(a.nome)<norm(b.nome)?-1:1);});
    return copiar('*Trilha Mentor · pendências*\n\n'+L.map(function(r){return '• '+(r.loja?r.loja+' · ':'')+r.nome+' — '+MT_ROT[r.sit];}).join('\n'),L.length);
  }
  function copiar(tx,n){
    var ok=function(){ toast(n+(n===1?' pendência copiada.':' pendências copiadas.')+' Cole no WhatsApp.'); };
    var alt=function(){ var a=document.createElement('textarea'); a.value=tx; document.body.appendChild(a); a.select(); var f=false; try{f=document.execCommand('copy');}catch(e){} a.remove(); if(f) ok(); else toast('Não consegui copiar neste aparelho.'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(ok,alt); else alt();
  }

  function emVisao(){ return !!(window.STDados&&STDados.visao&&STDados.visao()); }
  function podeVer(){ return !!S&&(S.perfil==='coord'||S.perfil==='sup')&&!emVisao(); }
  function podePrazo(){ return !!S&&S.perfil==='coord'&&!emVisao(); }
  function prazoCurto(p){ return dBr(p)+' '+String(p).slice(11,16); }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},3200); }
  function abrirDlg(tit,sub,corpo){ var d=$('dlg');
    d.innerHTML='<div class="m-top"><div><h2 id="dlgTit">'+esc(tit)+'</h2><div class="sub">'+esc(sub)+'</div></div><button type="button" class="fechar" data-fechar="1" aria-label="Fechar">×</button></div><div class="m-corpo" id="dlgCorpo">'+corpo+'</div>';
    if(!d.open) d.showModal(); }
  function fecharDlg(){ var d=$('dlg'); if(d.open) d.close(); }

  /* ── prova completa: perguntas, resposta do vendedor e gabarito (coordenação e supervisor) ── */
  function verProva(chave){
    var r=TUDO_ATUAL.filter(function(x){return x.chave===chave;})[0]; if(!r) return;
    abrirDlg(r.nome,'Loja '+r.loja+(r.lojaNome?' · '+r.lojaNome:'')+' · '+rotSit(r.sit,'vend'),'<p class="sub">Carregando a prova…</p>');
    STDados.chamar('semanaProva',{chave:chave}).then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não respondeu.');
      if(!$('dlg').open) return;
      var Q=j.questoes||[], h='';
      if(j.aval) h+='<div><span class="nota '+(j.aval.nota/j.aval.total*10>=8?'n-a':j.aval.nota/j.aval.total*10>=6?'n-b':'n-c')+'">'+j.aval.nota+'/'+j.aval.total+'</span> <span class="sub">respondida em '+esc(j.aval.em?prazoCurto(j.aval.em):'')+(j.aval.mentor?' · Mentor '+j.aval.mentor.acertos+'/'+j.aval.mentor.total:'')+'</span></div>';
      else h+='<div class="alerta">Prova ainda sem resposta. O gabarito está visível aqui: não repasse ao vendedor.</div>';
      if(!Q.length) h+='<p class="sub">Esta prova não tem questões registradas.</p>';
      h+=Q.map(function(q,i){ return '<div class="perg"><b>'+(i+1)+'. '+esc(q.t)+'</b><ul>'+(q.ops||[]).map(function(o,k){
        var certa=k===Number(q.certa), marcou=q.resposta!=null&&k===Number(q.resposta), cl=certa?'certa':marcou?'errada':'';
        var tag=certa&&marcou?'✓ Acertou':certa?'✓ Gabarito':marcou?'✕ Resposta do vendedor':'';
        return '<li'+(cl?' class="'+cl+'"':'')+'><span>'+esc(o)+'</span>'+(tag?'<small>'+tag+'</small>':'')+'</li>'; }).join('')+'</ul></div>'; }).join('');
      $('dlgCorpo').innerHTML=h;
    }).catch(function(e){ var c=$('dlgCorpo'); if(c) c.innerHTML='<p class="erro-m">'+esc(e.message||e)+'</p>'; });
  }

  /* ── ajustar prazo: um vendedor, uma loja ou a semana toda (só coordenação) ── */
  function valorPadrao(){ var a=String(S.agora||''), d=new Date(a.slice(0,10)+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10)+'T18:00'; }
  function alvos(){ return TUDO_ATUAL.filter(function(r){return r.chave&&r.sit!=='respondido';}); }
  function abrirPrazo(chave){
    var A=alvos(), lj={}, r=chave?A.filter(function(x){return x.chave===chave;})[0]:null;
    A.forEach(function(x){ lj[x.loja]=x.lojaNome||''; });
    var esc0=chave?'vendedor':F.loja?'loja':'rede', ks=Object.keys(lj).sort(), vs=A.slice().sort(function(a,b){return (a.loja<b.loja?-1:a.loja>b.loja?1:0)||(norm(a.nome)<norm(b.nome)?-1:1);});
    var op=function(v,t){return '<label class="opc"><input type="radio" name="esc" value="'+v+'"'+(esc0===v?' checked':'')+'> '+t+'</label>';};
    abrirDlg('Ajustar prazo da avaliação','Semana de '+dBr(SEM),
      '<div class="campo"><label for="pzData">Novo prazo</label><input id="pzData" type="datetime-local" value="'+valorPadrao()+'"></div>'+
      '<fieldset class="campo"><legend>Para quem</legend>'+op('vendedor','Um vendedor')+op('loja','Uma loja')+op('rede','Semana toda')+'</fieldset>'+
      '<div class="campo" id="cVend"><label for="pzVend">Vendedor</label><select id="pzVend">'+vs.map(function(x){return '<option value="'+esc(x.chave)+'"'+(x.chave===chave?' selected':'')+'>'+esc(x.loja+' · '+x.nome)+'</option>';}).join('')+'</select></div>'+
      '<div class="campo" id="cLoja"><label for="pzLoja">Loja</label><select id="pzLoja">'+ks.map(function(k){return '<option value="'+esc(k)+'"'+((r?r.loja:F.loja)===k?' selected':'')+'>'+esc(k+(lj[k]?' · '+lj[k]:''))+'</option>';}).join('')+'</select></div>'+
      '<p class="sub" id="pzRes" style="margin:0"></p><p class="sub" style="margin:0">Quem já fez a prova não muda. Quem perdeu o prazo volta a ficar aberto, e quem responder dentro do novo prazo ganha os pontos normais.</p><p class="erro-m" id="pzErr" hidden></p>'+
      '<div class="m-pe"><button type="button" class="btn2" data-fechar="1">Cancelar</button><button type="button" class="btn" id="pzOk" data-salvarprazo="1">Salvar prazo</button></div>');
    pzAtualiza();
  }
  function pzEscopo(){ var e=document.querySelector('input[name=esc]:checked'); return e?e.value:'rede'; }
  function pzAlvos(){ var e=pzEscopo(), A=alvos(); if(e==='vendedor') return A.filter(function(x){return x.chave===$('pzVend').value;}); if(e==='loja') return A.filter(function(x){return x.loja===$('pzLoja').value;}); return A; }
  function pzAtualiza(){ if(!$('pzRes')) return; var e=pzEscopo(); $('cVend').hidden=e!=='vendedor'; $('cLoja').hidden=e!=='loja'; var n=pzAlvos().length; $('pzRes').textContent=n===1?'Vai alterar 1 vendedor.':'Vai alterar '+n+' vendedores.'; $('pzOk').disabled=!n; }
  function salvarPrazo(){
    var v=$('pzData').value, er=$('pzErr'), bt=$('pzOk'); er.hidden=true;
    var mostra=function(m){ er.textContent=m; er.hidden=false; bt.disabled=false; bt.textContent='Salvar prazo'; };
    if(!v) return mostra('Informe a data e a hora.');
    var prazo=v.replace('T',' ').slice(0,16), e=pzEscopo(), x={semana:SEM,prazo:prazo,escopo:e};
    if(prazo<=String(S.agora||'')) return mostra('O novo prazo precisa ser depois de agora.');
    if(e==='vendedor') x.chave=$('pzVend').value; if(e==='loja') x.loja=$('pzLoja').value;
    bt.disabled=true; bt.textContent='Salvando…';
    STDados.chamar('semanaPrazoAjustar',x).then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.');
      fecharDlg(); toast(j.alterados===1?'Prazo alterado para 1 vendedor.':'Prazo alterado para '+j.alterados+' vendedores.'); return carregar();
    }).catch(function(err){ mostra(err.message||String(err)); });
  }

  function semanas(){
    var op=[[S.atual,'Esta semana']]; if(S.anterior&&(S.linhas||[]).some(function(l){return l.semana===S.anterior;})) op.push([S.anterior,'Semana passada']);
    $('semanas').innerHTML=op.map(function(o){return '<button type="button" data-sem="'+o[0]+'" aria-pressed="'+(SEM===o[0])+'">'+o[1]+'</button>';}).join('');
  }
  function falha(m){ $('raiz').innerHTML='<div class="card"><h2>Não consegui abrir</h2><p class="sub">'+esc(m)+'</p><button class="btn" type="button" id="deNovo">Tentar de novo</button></div>'; $('deNovo').onclick=carregar; }

  function carregar(){
    $('raiz').innerHTML='<p class="sub">Carregando as provas…</p>';
    ENTRA=true; CARGA=Date.now();
    var tenta=function(ac){ return STDados.chamar(ac).catch(function(){return null;}); };
    return STDados.chamar('semana').then(function(s){
      if(!s||!s.ok) throw new Error((s&&s.erro)||'O servidor não respondeu.');
      S=s; if(S.perfil==='vend') return [s,null,null,null];
      var pf=S.perfil, vSup=pf==='sup'||pf==='coord'||pf==='anl', vGer=vSup||pf==='ger';
      return Promise.all([s,tenta('acessos'),vGer?tenta('semanaGer'):null,vSup?tenta('semanaSup'):null]);
    }).then(function(rs){
      var a=rs[1]; GERD=(rs[2]&&rs[2].ok)?rs[2]:null; SUPD=(rs[3]&&rs[3].ok)?rs[3]:null;
      if(S.perfil==='vend'){ $('raiz').innerHTML='<div class="card"><h2>Tela da gestão</h2><p class="sub">Sua prova fica em PDI Semanal.</p></div>'; return; }
      GESTAO=true; AC=null; ACMAP=null; ACGER=null; ACSUP=null; ACP=(a&&a.ok&&a.pessoas)||[]; MT=null;
      if(a&&a.ok){ AC={lojaSup:{},lojaNome:{}}; ACMAP={}; ACGER={}; ACSUP={};
        (a.pessoas||[]).forEach(function(p){ var k=String(p.loja||''); if(k){ if(p.sup) AC.lojaSup[k]=p.sup; if(p.lojaNome) AC.lojaNome[k]=p.lojaNome; }
          if(p.tipo==='vend'&&k) (ACMAP[k]=ACMAP[k]||[]).push({n:norm(nm(p.nome)),p:p}); if(p.tipo==='ger'&&k) ACGER[k]=p; if(p.tipo==='sup') ACSUP[norm(nm(p.nome))]=p; }); }
      if(!SEM||(SEM!==S.atual&&SEM!==S.anterior)) SEM=S.atual;
      semanas(); montar();
    }).catch(function(e){ falha(e.message||e); });
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b&&S){ var tr=e.target.closest('tr[data-ficha]'); if(tr) abrirFicha(Number(tr.dataset.ficha)); return; } if(!b||!S) return;
    if(b.dataset.fechar){ fecharDlg(); return; }
    if(b.dataset.ficha){ abrirFicha(Number(b.dataset.ficha)); return; }
    if(b.dataset.revisao){ verRevisao(Number(b.dataset.revisao)); return; }
    if(b.dataset.cobrar){ cobranca(); return; }
    if(b.dataset.tipo){ if(TIPO!==b.dataset.tipo){ TIPO=b.dataset.tipo; F={g:'',sup:'',loja:'',q:'',nota:null}; SORT={c:'sit',d:1}; ENTRA=true; if(TIPO==='mentor') abrirTrilha(); else { $('semanas').hidden=false; montar(); } } return; }
    if(b.dataset.mod){ F.mod=F.mod===b.dataset.mod?'':b.dataset.mod; montar(); if(window.innerWidth<=640&&F.mod){ var ll=$('lista'); if(ll) ll.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
    if(b.dataset.nota!=null){ var nv=Number(b.dataset.nota); F.nota=F.nota===nv?null:nv; montar(); rolarLista(); return; }
    if(b.dataset.prova){ verProva(b.dataset.prova); return; }
    if(b.dataset.prazochave){ abrirPrazo(b.dataset.prazochave); return; }
    if(b.dataset.abrirprazo){ abrirPrazo(''); return; }
    if(b.dataset.salvarprazo){ salvarPrazo(); return; }
    if(b.dataset.sem){ SEM=b.dataset.sem; F.g=''; F.nota=null; ENTRA=true; semanas(); montar(); return; }
    if(b.dataset.g){ F.g=F.g===b.dataset.g?'':b.dataset.g; montar(); rolar(); return; }
    if(b.dataset.sup){ F.sup=F.sup===b.dataset.sup?'':b.dataset.sup; F.loja=''; montar(); return; }
    if(b.dataset.loja){ F.loja=F.loja===b.dataset.loja?'':b.dataset.loja; montar(); return; }
    if(b.dataset.limpar){ F={g:'',sup:'',loja:'',q:'',nota:null}; montar(); return; }
    if(b.dataset.sort){ if(SORT.c===b.dataset.sort) SORT.d=-SORT.d; else { SORT.c=b.dataset.sort; SORT.d=/nota|trilha|final/.test(b.dataset.sort)?-1:1; } lista(); }
  });
  function rolarLista(){ if(F.nota==null) return; var l=$('lista'); if(l&&l.scrollIntoView&&window.innerWidth<=640) l.scrollIntoView({behavior:'smooth',block:'start'}); }
  function rolar(){ if(!F.g) return; var l=$('lista'); if(l&&l.scrollIntoView&&window.innerWidth<=640) l.scrollIntoView({behavior:'smooth',block:'start'}); }
  document.addEventListener('change',function(e){ if(e.target.name==='esc'||e.target.id==='pzVend'||e.target.id==='pzLoja') pzAtualiza(); });
  var tB=null;
  document.addEventListener('input',function(e){ if(e.target.id!=='busca') return; clearTimeout(tB); var v=e.target.value; tB=setTimeout(function(){ F.q=v; lista(); },200); });

  if(window.STDados) carregar(); else $('raiz').innerHTML='<p class="sub">Abra pelo Só Tintas App.</p>';
})();
</script>
