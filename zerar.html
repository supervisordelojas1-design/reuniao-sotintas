<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizar o Assistente ST</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F2B46;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}.c{max-width:420px}h1{font-size:20px;margin:0 0 10px}p{opacity:.9;margin:0 0 18px}b{color:#FFD100}a{display:inline-block;margin-top:6px;padding:13px 20px;border-radius:10px;background:#FFD100;color:#0F2B46;font-weight:700;text-decoration:none}</style>
</head><body><div class="c">
<h1 id="t">Atualizando o aplicativo...</h1>
<p id="m">Limpando a versao guardada no aparelho. Aguarde.</p>
<div id="b"></div></div>
<script>
(async function(){
var t=document.getElementById("t"),m=document.getElementById("m"),b=document.getElementById("b");
var n=0,c=0;
try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); n=rs.length; for(var i=0;i<rs.length;i++){ await rs[i].unregister(); } } }catch(e){}
try{ var ks=await caches.keys(); c=ks.length; for(var j=0;j<ks.length;j++){ await caches.delete(ks[j]); } }catch(e){}
t.textContent="Pronto!";
m.innerHTML="Removi <b>"+n+"</b> registro(s) e <b>"+c+"</b> cache(s). Agora toque abaixo para abrir a versao nova.";
b.innerHTML="<a href=\"./?novo="+Date.now()+"\">Abrir o Assistente ST</a>";
})();
</script>
</body></html>
