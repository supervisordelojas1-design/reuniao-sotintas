<!doctype html><html lang="pt-BR" data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel de Conteúdo · Só Tintas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f1522; --surface:#1a2336; --surface2:#222d44; --ink:#eef2fb; --muted:#9aa5bb; --line:#2c3850;
  --accent:#ff3b47; --navy:#6f95f5; --ok:#3fbf7f; --bad:#ff6b6b; --warn:#ffab5e;
  --okbg:#12301f; --badbg:#3a1a20; --warnbg:#3a2717; --navybg:#1e2b4d;
  --heat:111,149,245;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f8; --ink:#16233d; --muted:#5a677f; --line:#e4e9f3;
  --navy:#1C3F8F; --ok:#178048; --bad:#c42a22; --warn:#b35600;
  --okbg:#e1f3e8; --badbg:#fdeceb; --warnbg:#ffefdd; --navybg:#e7edf9;
  --heat:28,63,143;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.topbar{height:8px;background:var(--accent);border-radius:0 0 6px 6px;margin:-20px 0 4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.05;margin:4px 0 0;color:var(--accent)}
h2{font-family:var(--f-display);font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:700 13px var(--f-body);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.s-hoje{background:var(--okbg);color:var(--ok)}.s-ativo{background:var(--okbg);color:var(--ok)}
.s-sumido{background:var(--warnbg);color:var(--warn)}.s-nunca{background:var(--badbg);color:var(--bad)}.s-semacesso{background:var(--surface2);color:var(--muted)}
.filtros{display:flex;flex-wrap:wrap;gap:6px}
.filtros button,.abas button{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 12.5px var(--f-body);cursor:pointer}
.filtros button[aria-pressed="true"],.abas button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.grupo{margin:8px 0 2px;font-weight:800;font-size:13px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding:6px 0}
.lista li span:last-child{color:var(--muted);white-space:nowrap;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabw{overflow-x:auto}
.barra{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--navy);border-radius:0 4px 4px 0}
.hb{display:grid;grid-template-columns:minmax(90px,140px) 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hb .tr{height:12px;background:transparent;position:relative}
.hb .tr i{display:block;height:100%;background:var(--navy);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.colunas{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--line);padding-top:16px}
.colunas .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default}
.colunas .c i{display:block;width:100%;max-width:26px;background:var(--navy);border-radius:4px 4px 0 0;min-height:2px}
.colunas .c b{position:absolute;top:-2px;font-size:11px;color:var(--ink)}
.eixo{display:flex;gap:2px;font-size:10.5px;color:var(--muted);margin-top:4px}.eixo span{flex:1;text-align:center}
.heat{display:grid;grid-template-columns:34px repeat(17,1fr);gap:2px;font-size:10.5px;color:var(--muted);align-items:center}
.heat .cel{aspect-ratio:1/1;border-radius:3px;background:var(--surface2);min-width:10px}
.heat .h{text-align:center}
.escala{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.escala i{width:16px;height:12px;border-radius:3px;display:inline-block}
.busca{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 14px var(--f-body);margin:6px 0 8px}
.aviso{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px}
.tip{position:fixed;z-index:50;pointer-events:none;background:#16233d;color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:240px}
[data-tip]:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mais{background:none;border:0;color:var(--navy);font:700 12.5px var(--f-body);cursor:pointer;padding:6px 0}
@media(max-width:560px){ .esc{display:none} .kpi b{font-size:24px} }
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cod{font:700 11.5px ui-monospace,Menlo,monospace;background:var(--surface2);border-radius:6px;padding:2px 6px;color:var(--muted)}
.apel{font-size:12px;color:var(--muted)}
.btnp{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:700 12px var(--f-body);cursor:pointer}
.btnp.azul{background:var(--navy);border-color:var(--navy);color:#fff}
.btnp.verde{background:var(--ok);border-color:var(--ok);color:#06130b}
.lib{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.lib input,.campo input,.campo select,.campo textarea{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:600 14px var(--f-body)}
.lib input{width:110px}
.modal{position:fixed;inset:0;background:rgba(6,10,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .caixa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.campo{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:12px;color:var(--muted);font-weight:700}
.campo textarea{min-height:80px;font-weight:500}
.ok{color:var(--ok);font-weight:700}.ruim{color:var(--bad);font-weight:700}

/* Painel de Conteúdo */
a.btnp{text-decoration:none;display:inline-flex;align-items:center}
.btnp:disabled{opacity:.45;cursor:default}
.lista li.item{align-items:center;flex-wrap:wrap}
.lista li.item span{text-align:left;white-space:normal;color:inherit}
.lista li.item span.sub{color:var(--muted)}
.lista li span.sub{display:block;font-size:12px}
.acoes{gap:6px!important;justify-content:flex-end}
.corta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(52vw,460px)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface2);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.thumb.larga{width:120px;height:42px;object-fit:contain;background:#0b1020}
.thumb.logo{width:56px;height:56px;object-fit:contain;background:#fff;padding:4px}
.prev{margin:6px 0;border-radius:12px;overflow:hidden;background:var(--surface2);min-height:60px;display:flex;align-items:center;justify-content:center}
.prevImg{display:block;width:100%;aspect-ratio:1600/560;object-fit:contain;background:#0b1020}
.modal .caixa.larga{max-width:760px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.campo input,.campo select{width:100%}
.lista.mini li{font-size:12.5px}
.questoes{margin:8px 0;padding-left:18px}
.questoes .q{border-bottom:1px solid var(--line);padding:6px 0 12px;margin-bottom:6px}
.op{display:flex;align-items:center;gap:8px;margin:5px 0}
.op b{width:16px;color:var(--muted)}
.op input[type=text],.op input:not([type]){flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 8px;font:500 14px var(--f-body)}
.op input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
h3{font-family:var(--f-display);font-size:15px}
label.linha{flex-wrap:nowrap;align-items:flex-start}label.linha input[type=checkbox]{flex:none;margin-top:3px}
@media(max-width:560px){ .corta{max-width:58vw} .acoes{width:100%} }
</style></head>
<body>
<div class="wrap">
  <div class="topbar"></div>
  <header>
    <div><div class="eyebrow">Só Tintas · conteúdo</div><h1>Painel de Conteúdo</h1><div class="sub" id="sub">Carregando…</div></div>
    <button type="button" class="btn" id="btnTema"><span id="temaIc">🌙</span> <span id="temaTx">Escuro</span></button>
  </header>
  <nav class="abas" id="abas" role="tablist" aria-label="Áreas do painel"></nav>
  <main id="raiz" style="display:flex;flex-direction:column;gap:14px"><p class="sub">Carregando o conteúdo…</p></main>
</div>
<div id="modal" class="modal" hidden></div>
<script>
(function(){
  function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var p=(qp('tema')||'').toLowerCase(), t=(p==='claro'||p==='light')?'light':(p==='escuro'||p==='dark')?'dark':null;
  if(!t){ var s=(ls('st_tema')||'').toLowerCase(); t=(s==='light'||s==='claro')?'light':'dark'; }
  window.__setTema=function(tema){ document.documentElement.setAttribute('data-theme',tema); document.documentElement.style.colorScheme=tema;
    var ic=document.getElementById('temaIc'), tx=document.getElementById('temaTx'); if(ic) ic.textContent=tema==='light'?'☀️':'🌙'; if(tx) tx.textContent=tema==='light'?'Claro':'Escuro';
    try{localStorage.setItem('st_tema',tema);}catch(e){} try{ if(window.parent&&window.parent!==window) window.parent.postMessage({st_tema:tema},'*'); }catch(e){} };
  window.__setTema(t);
  window.addEventListener('message',function(ev){ var d=ev&&ev.data; if(d&&(d.st_tema==='light'||d.st_tema==='dark')) window.__setTema(d.st_tema); });
  document.getElementById('btnTema').onclick=function(){ window.__setTema(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); };
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   PAINEL DE CONTEÚDO (nov/2026) — coordenação e administrador de conteúdo (Marketing)
   Banners da tela inicial · fornecedores e portfólio · provas geradas de um arquivo ·
   vídeos e trilha do Mentor. Tudo grava no Servidor de Dados ST (aba MENTOR_CONTEUDO);
   imagens e PDFs vão para a pasta "Só Tintas App - Conteúdo" do Drive.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var sem=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();};
  var clone=function(o){return JSON.parse(JSON.stringify(o));};
  var B=window.CONTEUDO||{};
  var CONT={}, PERFIL=null, ABA='banners', PREV={}, PROVA=null, ADM=null, FORN_ABERTO=null;
  var AVL=null, AVL_CARR=false, AVL_ERR='', MT=null;
  var BANNERS_PADRAO=[['acelera-coral','Acelera Coral · Copa Só Tintas de Kart · 01/10 a 22/11/26'],['pintor-cadastrado','Pintor cadastrado, prêmio garantido · R$ 5 por cadastro Citel, R$ 10 a partir do 11º'],
    ['pix-semanal','Pix Semanal · bônus extra por antecipação'],['elite-das-vendas','Elite das Vendas · premiação mensal e trimestral'],['trinca-de-ouro','Trinca de Ouro · maior venda CNPJ da semana'],
    ['boca-de-caixa-suvinil','Boca de Caixa Suvinil · balde R$ 10, galão R$ 5, bônus liberado ao acumular R$ 20']]
    .map(function(b,i){ return { id:'b-'+b[0], titulo:b[1], src:'banners/'+b[0]+'.webp?v=1', ordem:i+1, ativo:true }; });
  var FORN_PADRAO=[{id:'coral',ordem:1,nome:'Coral',descricao:'Tintas Coral (AkzoNobel) · catálogo 2025/2º semestre.',site:'https://www.coral.com.br',catalogos:[],videos:[],ativo:true},
    {id:'eucatex',ordem:2,nome:'Eucatex',descricao:'Tintas Eucatex · catálogo 2026.',site:'https://www.eucatex.com.br',catalogos:[],videos:[],ativo:true}];
  var CATEG=['Institucional','Produtos','Técnica','Atendimento','Fornecedores','Outros'];

  function toast(m){ var t=document.createElement('div'); t.className='tip'; t.style.cssText='left:0;right:0;margin:auto;bottom:18px;top:auto;width:max-content;max-width:calc(100% - 24px)'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},3600); }
  function tab(t){ var v=CONT[t]; if(Array.isArray(v)) return clone(v);
    if(t==='banners') return clone(BANNERS_PADRAO); if(t==='fornecedores') return clone(FORN_PADRAO);
    return clone(B[t]||[]); }
  var ehCoord=function(){ return PERFIL==='coord'; };
  var ordenar=function(L){ return L.sort(function(a,b){ return (Number(a.ordem)||0)-(Number(b.ordem)||0); }); };
  function novoId(px,L){ var n=0; L.forEach(function(x){ var m=String(x.id||'').match(new RegExp('^'+px+'(\\d+)$')); if(m) n=Math.max(n,+m[1]); }); return px+String(n+1).padStart(2,'0'); }
  function hoje(){ try{ return new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}); }catch(e){ return new Date().toISOString().slice(0,10); } }
  function dBr(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?m[3]+'/'+m[2]+'/'+m[1]:''; }
  function salvar(T,msg){
    return STDados.chamar('conteudoSalvar',{tabelas:T}).then(function(r){
      if(!r||!r.ok) throw new Error((r&&r.erro)||'O servidor não confirmou.');
      Object.keys(T).forEach(function(k){ if(T[k]===null) delete CONT[k]; else CONT[k]=clone(T[k]); });
      if(T.banners){ try{ localStorage.setItem('st_banners_v1',JSON.stringify(T.banners)); }catch(e){} try{ window.parent.postMessage({st_banners:1},'*'); }catch(e){} }
      toast(msg||'✓ Publicado para todos.'); return r;
    });
  }
  function erroBox(e){ return '<p class="ruim" role="alert">'+esc((e&&e.message)||e)+'</p>'; }

  /* ── arquivos: imagem reduzida no aparelho; PDF como está ── */
  function lerDataUrl(file){ return new Promise(function(ok,nao){ var r=new FileReader(); r.onload=function(){ ok(r.result); }; r.onerror=function(){ nao(new Error('Não consegui ler o arquivo.')); }; r.readAsDataURL(file); }); }
  function reduzir(file,max){ return new Promise(function(ok,nao){ var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){ var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/w); w=Math.round(w*k); h=Math.round(h*k);
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u);
      var d=c.toDataURL('image/webp',0.86); if(!/^data:image\/webp/.test(d)) d=c.toDataURL(/png/.test(file.type)?'image/png':'image/jpeg',0.86); ok({dataUrl:d,w:w,h:h}); };
    img.onerror=function(){ nao(new Error('Essa imagem não abriu. Use PNG, JPG ou WEBP.')); }; img.src=u; }); }
  function subir(file,max){
    var img=/^image\//.test(file.type), pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
    if(!img&&!pdf) return Promise.reject(new Error('Envie imagem (PNG, JPG, WEBP) ou PDF.'));
    if(file.size>20*1024*1024) return Promise.reject(new Error('Arquivo grande demais (máximo 20 MB).'));
    return (img?reduzir(file,max||1600).then(function(r){ return r.dataUrl; }):lerDataUrl(file)).then(function(d){
      var mime=(d.match(/^data:([^;]+);/)||[])[1]||(pdf?'application/pdf':file.type);
      var nome=file.name.replace(/\.[^.]+$/,'')+(mime==='image/webp'?'.webp':mime==='image/jpeg'?'.jpg':mime==='image/png'?'.png':'.pdf');
      return STDados.chamar('arquivoSubir',{nome:nome,mime:mime,b64:d.replace(/^data:[^;]+;base64,/,'')}).then(function(r){
        if(!r||!r.ok) throw new Error((r&&r.erro)||'Não consegui enviar o arquivo.');
        if(img) PREV[r.arq.id]=d; return r.arq; });
    });
  }
  function imgHtml(ref,alt,cls){ if(!ref) return '<span class="thumb vazio">🖼️</span>';
    if(typeof ref==='string'||ref.src) return '<img class="'+(cls||'thumb')+'" src="'+esc(ref.src||ref)+'" alt="'+esc(alt||'')+'">';
    if(PREV[ref.id]) return '<img class="'+(cls||'thumb')+'" src="'+esc(PREV[ref.id])+'" alt="'+esc(alt||'')+'">';
    return '<img class="'+(cls||'thumb')+'" data-arq="'+esc(JSON.stringify(ref))+'" alt="'+esc(alt||'')+'">'; }
  function depois(){ setTimeout(function(){ STDados.preencherArquivos($('raiz')); STDados.preencherArquivos($('modal')); },0); }

  /* ── abas ── */
  function abas(){
    var A=[['banners','🖼️ Banners'],['fornecedores','🏭 Fornecedores'],['provas','📝 Provas'],['videos','🎬 Vídeos'],['trilha','📚 Trilha do Mentor']];
    if(ehCoord()) A.push(['admins','🔑 Quem administra']);
    $('abas').innerHTML=A.map(function(a){ return '<button type="button" role="tab" aria-selected="'+(ABA===a[0])+'" data-aba="'+a[0]+'">'+a[1]+'</button>'; }).join('');
  }
  function montar(){ abas(); var f={banners:telaBanners,fornecedores:telaForn,provas:telaProvas,videos:telaVideos,trilha:telaTrilha,admins:telaAdmins}[ABA]||telaBanners; $('raiz').innerHTML=f(); depois(); }

  /* ═════════ BANNERS ═════════ */
  function telaBanners(){

  /* texto de arquivos do Office (docx, pptx, xlsx são zip de XML): lido aqui no aparelho */
  function textoOffice(buf,tipo){
    var dv=new DataView(buf), e=buf.byteLength-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--; if(e<0) return Promise.reject(new Error('Arquivo do Office corrompido.'));
    var n=dv.getUint16(e+10,true), p=dv.getUint32(e+16,true), A=[], td=new TextDecoder();
    for(var i=0;i<n;i++){ var nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true); A.push({nome:td.decode(new Uint8Array(buf,p+46,nl)),met:dv.getUint16(p+10,true),tam:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)}); p+=46+nl+xl+cl; }
    var re=tipo==='docx'?/^word\/document\.xml$/:tipo==='pptx'?/^ppt\/slides\/slide(\d+)\.xml$/:/^xl\/(sharedStrings|worksheets\/sheet\d+)\.xml$/;
    var alvo=A.filter(function(a){return re.test(a.nome);}).sort(function(a,b){ var x=+(a.nome.match(/(\d+)\.xml$/)||[0,0])[1], y=+(b.nome.match(/(\d+)\.xml$/)||[0,0])[1]; return x-y; });
    if(!alvo.length) return Promise.reject(new Error('Não achei texto nesse arquivo.'));
    function ler(a){ var nl=dv.getUint16(a.lo+26,true), xl=dv.getUint16(a.lo+28,true), b=new Uint8Array(buf,a.lo+30+nl+xl,a.tam);
      if(a.met===0) return Promise.resolve(td.decode(b));
      if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador não abre Word/PowerPoint/Excel. Salve o arquivo em PDF e envie de novo.'));
      return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); }
    return Promise.all(alvo.map(ler)).then(function(X){
      var dp=new DOMParser(), out=[];
      if(tipo==='xlsx'){ var ss=[]; alvo.forEach(function(a,k){ if(/sharedStrings/.test(a.nome)){ var d=dp.parseFromString(X[k],'application/xml'); Array.prototype.forEach.call(d.getElementsByTagName('si'),function(si){ ss.push(Array.prototype.map.call(si.getElementsByTagName('t'),function(t){return t.textContent;}).join('')); }); } });
        alvo.forEach(function(a,k){ if(/sharedStrings/.test(a.nome)) return; var d=dp.parseFromString(X[k],'application/xml');
          Array.prototype.forEach.call(d.getElementsByTagName('row'),function(r){ var cs=[]; Array.prototype.forEach.call(r.getElementsByTagName('c'),function(c){ var v=c.getElementsByTagName('v')[0], t=c.getAttribute('t');
            var tx=t==='s'&&v?ss[+v.textContent]:t==='inlineStr'?Array.prototype.map.call(c.getElementsByTagName('t'),function(x){return x.textContent;}).join(''):(v?v.textContent:''); if(tx) cs.push(tx); }); if(cs.length) out.push(cs.join(' | ')); }); });
        return out.join('\n'); }
      var par=tipo==='docx'?'w:p':'a:p', tt=tipo==='docx'?'w:t':'a:t';
      X.forEach(function(x,k){ var d=dp.parseFromString(x,'application/xml'); if(tipo==='pptx') out.push('--- slide '+(k+1)+' ---');
        Array.prototype.forEach.call(d.getElementsByTagName(par),function(pp){ var t=Array.prototype.map.call(pp.getElementsByTagName(tt),function(z){return z.textContent;}).join(''); if(t.trim()) out.push(t); }); });
      return out.join('\n');
    });
  }
  function prepararArquivo(f){
    var ext=(f.name.match(/\.([a-z0-9]+)$/i)||[])[1]; ext=(ext||'').toLowerCase();
    if(f.size>20*1024*1024) return Promise.reject(new Error('Arquivo grande demais (máximo 20 MB). Divida em partes ou salve em PDF menor.'));
    if(ext==='pdf'||f.type==='application/pdf') return lerDataUrl(f).then(function(d){ return {arquivo:d.replace(/^data:[^;]*;/,'data:application/pdf;')}; });
    if(/^image\//.test(f.type)) return reduzir(f,2000).then(function(r){ return {arquivo:r.dataUrl}; });
    if(ext==='docx'||ext==='pptx'||ext==='xlsx') return f.arrayBuffer().then(function(b){ return textoOffice(b,ext); }).then(function(t){ return {texto:t}; });
    if(ext==='doc'||ext==='ppt'||ext==='xls') return Promise.reject(new Error('Formato antigo do Office: abra e salve como .docx/.pptx/.xlsx ou PDF.'));
    return f.text().then(function(t){ return {texto:t}; });
  }

    abrirModal();
    var del=$('modal').querySelector('[data-vd-del]'); if(del) del.onclick=function(){ if(!confirm('Excluir o vídeo "'+v.titulo+'"?')) return; V.splice(i,1); fecharModal(); salvar({videos:V},'✓ Vídeo excluído.').then(montar).catch(function(e){ toast(e.message); }); };
    $('modal').querySelector('[data-vd-ok]').onclick=function(){
      v.titulo=$('vdTit').value.trim(); v.url=$('vdUrl').value.trim(); v.categoria=$('vdCat').value; v.descricao=$('vdDesc').value.trim(); v.xp=Number($('vdXp').value)||15; v.ativo=$('vdAtivo').checked;
      if(!v.titulo){ $('mdErro').textContent='Informe o título.'; return; }
      if(v.url&&!/^https?:\/\//i.test(v.url)){ $('mdErro').textContent='O link tem de começar com https://'; return; }
      if(i==null){ v.id=novoId('v',V); v.ordem=V.reduce(function(m,x){return Math.max(m,Number(x.ordem)||0);},0)+1; v.criado_em=hoje(); v.anunciar=true; V.push(v); } else V[i]=v;
      this.disabled=true; fecharModal(); salvar({videos:V},'✓ Vídeo publicado.').then(montar).catch(function(e){ toast(e.message); });
    };
  }

  /* ═════════ TRILHA ═════════ */
  function telaTrilha(){
    var M=ordenar(tab('modulos'));
    return '<section class="card"><h2>Trilha de treinamento (Mentor ST PRO)</h2><p class="sub">Módulos, aulas, questões uma a uma, base de conhecimento do Assessor, história, valores, jornada dos 30 dias e conquistas ficam no editor completo do Mentor. O que você salvar lá é publicado para todos, igual a este painel.</p>'+
      '<div class="linha"><a class="btnp azul" href="mentor/gestor.html">🛠️ Abrir o editor da trilha</a><span class="sub">'+M.length+' módulos na trilha hoje</span></div></section>'+
      '<section class="card"><h2>Ordem da trilha</h2><ul class="lista">'+M.map(function(m,i){ return '<li><span>'+(i+1)+'. '+esc(m.icone||'📘')+' '+esc(m.titulo)+'</span><span class="cod">'+esc(m.id)+'</span></li>'; }).join('')+'</ul></section>';
  }

  /* ═════════ QUEM ADMINISTRA (coordenação) ═════════ */
  function telaAdmins(){
    if(!ADM){ ADM={lista:null,pessoas:[]}; Promise.all([STDados.chamar('conteudoAdmins'),STDados.chamar('pessoas').catch(function(){return null;})]).then(function(r){
        if(!r[0]||!r[0].ok) throw new Error((r[0]&&r[0].erro)||'Não consegui ler a lista.'); ADM.lista=r[0].lista; ADM.pessoas=(r[1]&&r[1].pessoas||[]).filter(function(p){return p.ativo&&p.cargo!=='coord';}); if(ABA==='admins') montar(); })
      .catch(function(e){ ADM.erro=e.message; if(ABA==='admins') montar(); }); }
    if(ADM.erro) return erroBox(ADM.erro);
    if(!ADM.lista) return '<p class="sub">Carregando…</p>';
    return '<section class="card"><h2>Administradores de conteúdo</h2><p class="sub" style="margin:0 0 8px">Quem está aqui entra com o perfil <b>Marketing</b>: edita este painel e a trilha do Mentor, inclui, libera e arquiva pessoas no Cadastro da Equipe (menos a coordenação) e <b>não vê</b> vendas, PDI, ranking, níveis nem bônus. Use o nome exatamente como a pessoa entra no app. Vale na hora, sem novo login.</p>'+
      '<ul class="lista">'+(ADM.lista.map(function(n,i){ return '<li><span><b>'+esc(n)+'</b></span><button class="btnp" type="button" data-adm-del="'+i+'">tirar</button></li>'; }).join('')||'<li class="sub">Ninguém ainda.</li>')+'</ul>'+
      '<div class="linha" style="margin-top:8px"><input class="busca" id="admNome" list="admLista" placeholder="Nome como no login (ex.: Amanda Souza)" style="flex:1 1 240px;margin:0"><datalist id="admLista">'+ADM.pessoas.map(function(p){ return '<option value="'+esc(p.nome)+'">'; }).join('')+'</datalist><button class="btnp azul" type="button" data-adm-add="1">＋ Adicionar</button></div></section>';
  }
  function admSalvar(L){ STDados.chamar('conteudoAdmins',{lista:L}).then(function(r){ if(!r||!r.ok) throw new Error((r&&r.erro)||'Não salvou.'); ADM.lista=r.lista; toast('✓ Lista salva.'); montar(); }).catch(function(e){ toast(e.message); }); }

  /* ── modal ── */
  var antesModal=null;
  function abrirModal(){ antesModal=document.activeElement; $('modal').hidden=false; depois(); setTimeout(function(){ var x=$('modal').querySelector('input:not([type=file]),textarea,select'); if(x) x.focus(); },30); }
  function fecharModal(){ $('modal').hidden=true; $('modal').innerHTML=''; try{ if(antesModal) antesModal.focus(); }catch(e){} }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; var d=b.dataset;
    if(d.aba){ lerRevisao(); ABA=d.aba; montar(); return; }
    if(d.fx){ fecharModal(); return; }
    /* banners */
    var L;
    if(d.bnNovo){ bnModal(null); return; }
    if(d.bnEd!=null){ bnModal(+d.bnEd); return; }
    if(d.bnSobe!=null||d.bnDesce!=null){ L=ordenar(tab('banners')); var i=+(d.bnSobe!=null?d.bnSobe:d.bnDesce), j=d.bnSobe!=null?i-1:i+1; if(j<0||j>=L.length) return; var t=L[i]; L[i]=L[j]; L[j]=t; bnSalvarLista(L,'✓ Ordem salva.'); return; }
    if(d.bnLiga!=null){ L=ordenar(tab('banners')); L[+d.bnLiga].ativo=L[+d.bnLiga].ativo===false; bnSalvarLista(L,L[+d.bnLiga].ativo?'✓ Banner no ar.':'✓ Banner desligado.'); return; }
    if(d.bnDel!=null){ L=ordenar(tab('banners')); if(!confirm('Excluir o banner "'+(L[+d.bnDel].titulo||'')+'"?')) return; L.splice(+d.bnDel,1); bnSalvarLista(L,'✓ Banner excluído.'); return; }
    /* fornecedores e produtos */
    if(d.foNovo){ foModal(null); return; }
    if(d.foEd!=null){ foModal(+d.foEd); return; }
    if(d.foSobe!=null){ var F=ordenar(tab('fornecedores')), k=+d.foSobe; if(!k) return; var x=F[k]; F[k]=F[k-1]; F[k-1]=x; F.forEach(function(f,n){ f.ordem=n+1; }); salvar({fornecedores:F},'✓ Ordem salva.').then(montar).catch(function(er){ toast(er.message); }); return; }
    if(d.foProd){ FORN_ABERTO=FORN_ABERTO===d.foProd?null:d.foProd; montar(); return; }
    if(d.prNovo!=null){ prModal(null,d.prNovo); return; }
    if(d.prEd){ prModal(d.prEd); return; }
    /* provas */
    if(d.pvModo){ Array.prototype.forEach.call(document.querySelectorAll('[data-pv-modo]'),function(x){ x.setAttribute('aria-pressed',String(x===b)); }); return; }
    if(d.pvGerar){ gerar(); return; }
    if(d.pvDel!=null){ lerRevisao(); PROVA.questoes.splice(+d.pvDel,1); montar(); return; }
    if(d.pvMais){ lerRevisao(); PROVA.questoes.push({enunciado:'',opcoes:['','','',''],correta:0,explicacao:''}); montar(); return; }
    if(d.pvDescartar){ if(!confirm('Descartar as questões geradas?')) return; PROVA=null; montar(); return; }
    if(d.pvPub){ publicarProva(); return; }
    if(d.mdDel){ excluirModulo(d.mdDel); return; }
    if(d.avDel){ excluirAvulsa(d.avDel); return; }
    /* vídeos */
    if(d.vdNovo){ vdModal(null); return; }
    if(d.vdEd!=null){ vdModal(+d.vdEd); return; }
    if(d.vdParar!=null){ var VP=ordenar(tab('videos')); VP[+d.vdParar].anunciar=false; salvar({videos:VP},'✓ Parou de anunciar.').then(montar).catch(function(er){ toast(er.message); }); return; }
    if(d.vdSobe!=null){ var V=ordenar(tab('videos')), q=+d.vdSobe; if(!q) return; var y=V[q]; V[q]=V[q-1]; V[q-1]=y; V.forEach(function(v,n){ v.ordem=n; }); salvar({videos:V},'✓ Ordem salva.').then(montar).catch(function(er){ toast(er.message); }); return; }
    /* administradores */
    if(d.admAdd){ var nm=$('admNome').value.trim(); if(!nm){ toast('Digite o nome.'); return; } admSalvar(ADM.lista.concat([nm])); return; }
    if(d.admDel!=null){ var c=ADM.lista.slice(); c.splice(+d.admDel,1); admSalvar(c); return; }
  });
  document.addEventListener('change',function(e){ if(e.target.id==='pvDest'){ var l=$('pvNovoTitL'); if(l){ l.style.display=(e.target.value==='__novo'||e.target.value==='__avulsa')?'':'none'; var tx=l.firstChild; if(tx&&tx.nodeType===3) tx.nodeValue=e.target.value==='__avulsa'?'Nome da prova':'Nome do novo módulo'; } var av=e.target.value==='__avulsa', a=$('pvAvBloco'), fi=$('pvFinalL'); if(a) a.hidden=!av; if(fi) fi.hidden=av;
    var mm=$('pvAvMin'); if(mm&&!av&&e.target.value!=='__novo'){ var alvo=tab('modulos').filter(function(x){return x.id===e.target.value;})[0]; if(alvo&&alvo.nota_minima!=null&&alvo.nota_minima!=='') mm.value=alvo.nota_minima; } } });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('modal').hidden) fecharModal(); });

  function iniciar(){
    if(!window.STDados){ $('raiz').innerHTML='<p class="sub">Abra pelo Só Tintas App.</p>'; return; }
    if(STDados.visao&&STDados.visao()){ $('sub').textContent='Modo "Ver como"'; $('raiz').innerHTML='<div class="card"><h2>Saia do "Ver como"</h2><p class="sub">O Painel de Conteúdo publica para todos; use com o seu próprio acesso.</p></div>'; return; }
    STDados.cracha(true).then(function(){ return Promise.all([STDados.atualizarPerfil(),STDados.chamar('conteudoLer')]); }).then(function(r){
      PERFIL=STDados.perfil(); var j=r[1];
      if(PERFIL!=='coord'&&PERFIL!=='mkt'){ $('sub').textContent='Acesso restrito'; $('raiz').innerHTML='<div class="card"><h2>Este painel é da coordenação e do Marketing</h2><p class="sub">Peça à coordenação para incluir o seu nome em "Quem administra".</p></div>'; $('abas').innerHTML=''; return; }
      if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não respondeu.');
      CONT=j.cont||{};
      $('sub').textContent=(PERFIL==='mkt'?'Marketing':'Coordenação')+' · o que você publica aqui vale para todos'+(j.em?' · última publicação '+new Date(j.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+(j.por?' por '+j.por:''):'');
      montar();
    }).catch(function(e){ $('raiz').innerHTML='<div class="card"><h2>Não consegui abrir</h2>'+erroBox(e)+'<button class="btn" type="button" id="deNovo">Tentar de novo</button></div>'; $('deNovo').onclick=iniciar; });
  }
  iniciar();
})();
</script>
