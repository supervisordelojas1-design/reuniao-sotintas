<!doctype html><html data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bônus do Mês · Só Tintas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f1522; --surface:#1a2336; --surface2:#141c2c; --ink:#eef2fb; --muted:#9aa5bb; --line:#2c3850;
  --accent:#ff3b47; --navy:#4f7cf0; --ok:#2FD08E; --warn:#FFC94D; --bad:#ff6b74; --pend:#b9a4ff;
  --ouro:#E6B935; --ouro-ink:#2a2000; --prata:#C3CBD8; --prata-ink:#1a2030; --bronze:#D98A3D; --bronze-ink:#2a1500;
  --ok-bg:rgba(47,208,142,.13); --warn-bg:rgba(255,201,77,.13); --bad-bg:rgba(255,107,116,.13); --pend-bg:rgba(185,164,255,.13);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#f7f9fd; --ink:#16233d; --muted:#5a677f; --line:#e4e9f3;
  --navy:#1C3F8F; --ok:#128a52; --warn:#9a6700; --bad:#c62833; --pend:#5b3fc4;
  --ok-bg:rgba(18,138,82,.10); --warn-bg:rgba(183,121,0,.11); --bad-bg:rgba(198,40,51,.09); --pend-bg:rgba(91,63,196,.09);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.topbar{height:8px;background:var(--accent);border-radius:0 0 6px 6px;margin:-20px -16px 4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,36px);line-height:1.05;margin:4px 0 0;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px var(--f-body);padding:8px 13px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:focus-visible,.sn button:focus-visible,tr.lk:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
html.embutido #btnTema{display:none}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.nl{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11.5px;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.nl.n3{background:var(--ouro);color:var(--ouro-ink)}.nl.n2{background:var(--prata);color:var(--prata-ink)}.nl.n1{background:var(--bronze);color:var(--bronze-ink)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:800 13.5px var(--f-body);padding:10px 8px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.filtro{display:inline-flex;align-items:center;gap:8px;font:800 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.filtro select{font:700 13px var(--f-body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0}
.vc{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 6px;border-radius:6px;font-weight:800;font-size:11px;background:var(--navy);color:#fff}
.aviso{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:12px 16px;font-size:13.5px}

.hero{background:linear-gradient(135deg,#1C3F8F,#0f2b5c);color:#fff;border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:1.05fr 2fr;gap:18px;align-items:center}
.hero .quem{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#9fb6e6}
.hero .nv{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;margin:4px 0 8px}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:#c9d6f2}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tot .c{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 12px}
.tot .c .l{font-size:11px;font-weight:800;color:#9fb6e6;text-transform:uppercase;letter-spacing:.05em}
.tot .c .v{font-family:var(--f-display);font-weight:800;font-size:26px;margin:2px 0;font-variant-numeric:tabular-nums}
.tot .c .d{font-size:11.5px;color:#c9d6f2}
.tot .c.g{border-color:rgba(47,208,142,.6);background:rgba(47,208,142,.12)}
.nota{font-size:12.5px;color:#c9d6f2;grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:10px}
.nota b{color:#fff}

.barra{position:relative;height:14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:visible;margin:22px 0 20px}
.barra i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--navy)}
.barra i.pj{background:repeating-linear-gradient(135deg,rgba(79,124,240,.45) 0 6px,rgba(79,124,240,.2) 6px 12px)}
.barra s{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.barra s.b em{top:auto;bottom:-17px}
.barra s em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:800 10.5px var(--f-body);color:var(--muted);white-space:nowrap;font-style:normal}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.full{grid-column:1/-1}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card .qd{font-size:11.5px;color:var(--muted);font-weight:700}
.st{font:800 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.rit{background:rgba(79,124,240,.16);color:var(--navy)}
html[data-theme="dark"] .st.rit{color:#9db8ff}
.st.risco{background:var(--warn-bg);color:var(--warn)}.st.trava{background:var(--bad-bg);color:var(--bad)}.st.pend{background:var(--pend-bg);color:var(--pend)}.st.na{background:var(--surface2);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums>div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.nums .l{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nums .v{font-family:var(--f-display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.nums .v.z{color:var(--muted)}
.falta{font-size:13px}
.falta b{font-variant-numeric:tabular-nums}
.regra{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk span{font:700 12px var(--f-body);padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.chk span.s{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.chk span.n{border-color:transparent;background:var(--bad-bg);color:var(--bad)}
.sn{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px}
.sn .g{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sn button{border:0;background:transparent;color:var(--muted);font:800 12px var(--f-body);padding:6px 14px;cursor:pointer}
.sn button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sn button:disabled{opacity:.5;cursor:default}

.ni{width:84px;font:700 14px var(--f-body);padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.ni:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.invg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.invl{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.invh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.invn{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.invn b{color:var(--ink);font-variant-numeric:tabular-nums}
.invf{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:flex-end;border-top:1px dashed var(--line);padding-top:8px}
.invf label{display:flex;flex-direction:column;gap:3px;font:800 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.invf input[type=file]{font:500 12.5px var(--f-body);color:var(--ink);max-width:100%;text-transform:none;letter-spacing:0}
.invimg{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
@media(max-width:820px){.invg{grid-template-columns:1fr}}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:right;padding:10px 12px;background:var(--surface2);white-space:nowrap}
th:first-child,td:first-child,th.e,td.e{text-align:left}
td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
td small{display:block;font-weight:500;color:var(--muted);font-size:12px}
tr.lk{cursor:pointer}tr.lk:hover td{background:var(--surface2)}
tr.tt td{background:var(--surface2);font-weight:800}
td.mut{color:var(--muted);font-weight:600}
.rodape{font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:820px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media(max-width:520px){.tot{grid-template-columns:1fr}.nums .v{font-size:17px}td,th{padding:8px 9px}table{font-size:13px}}
</style></head>
<body>
<div class="wrap">
 <div class="topbar"></div>
 <header>
  <div><div class="eyebrow">Só Tintas · Acompanhamento do mês</div>
   <h1>Bônus do Mês</h1>
   <div class="sub" id="sub">Supervisor, gerente e vendedor: quanto já garantiu, quanto o ritmo entrega e o que falta</div></div>
  <div class="acoes"><button class="btn" id="btnVoltar" hidden>&larr; Todas as lojas</button><button class="btn" id="btnZap" hidden>Enviar no WhatsApp</button><button class="btn" id="btnTema">◐ Tema</button></div>
 </header>
 <div class="tabs" id="tabs" role="tablist" aria-label="De quem é o bônus" hidden></div>
 <div class="aviso" id="aviso" hidden></div>
 <div id="app"></div>
 <div class="rodape" id="rodape"></div>
</div>
<script src="st-hora.js?v=1"></script>
<script src="st-dados.js?v=93"></script>
<script src="st-indicadores.js?v=1"></script>
<script>
(function(){
/* ===== Regras do fechamento (mesmos parâmetros do painel Bonificações e da planilha de fechamento) ===== */
var B={
 ger:{1:[400,900,1500],2:[600,1200,2000],3:[800,1500,2500]},   /* meta da loja: 95% · 100% · 130% — paga a maior faixa */
 time:[75,150,200],                                           /* meta de time: 95% · 100% · 130% da loja */
 perf:{1:0,2:0.004,3:0.005},                                  /* % do faturamento do mês · exige contagem de estoque */
 inv:{1:500,2:700,3:1000},                                    /* exige loja >= 90% + inventário confirmado */
 cpf:50, cnpj:100, euc:100,
 /* vendedor: linhas V1..V5 por nível de loja (iguais às do Simulador de Bônus) */
 vperf:{1:[0,0,0,350,500],2:[0,0,300,500,600],3:[0,250,400,600,800]},
 m95:{1:[100,120,150,180,220],2:[220,250,280,320,380],3:[250,280,350,420,500]},
 m100:{1:[280,300,330,380,440],2:[290,330,380,440,530],3:[330,380,450,550,750]},
 m130:{1:[480,500,530,550,650],2:[420,480,550,650,800],3:[480,550,750,850,1500]},
 regua:{3:[50000,70000,100000,150000],2:[40000,60000,90000,110000],1:[30000,50000,65000,85000]},
 vcpf:20, veuc:50,
 /* supervisor */
 sfat:[150,300,500], sreg:[500,1000,2000], scnpj:500, seuc:200, sinv:100, sinvItens:50, sinvMin:0.95
};
var FX=[0.95,1,1.3], FXR=['95%','100%','130%'];
var NL={1:['N1','Bronze'],2:['N2','Prata'],3:['N3','Ouro']};
var API_PAINEL='https://script.google.com/macros/s/AKfycbzVe8joykFt0rWX9CjFgpeOaABckMFttVwV8u4e-yJh8qXPr6JTmlAzfgNjiAPAHGEwLg/exec';
var API_EQUIPE='https://script.google.com/macros/s/AKfycbxC916U8rNw_-HFTW7vtFZz4AC_B1bHcTLE3bvMDWji6E5lAqkXgC0EIgQFtjHYTp8I/exec?acao=equipe';
var TAB='bonus_gerente';   /* tabela no conteúdo compartilhado: {'AAAA-MM':{'002':{inv:1,cont:0,por,em}}} */

var $=function(id){return document.getElementById(id)};
var R=function(n){return 'R$ '+Math.round(n||0).toLocaleString('pt-BR')};
var P=function(x){return x==null||!isFinite(x)?'—':(x*100).toFixed(1).replace('.',',')+'%'};
var N=function(n){return Math.round(n||0).toLocaleString('pt-BR')};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var code3=function(t){var m=String(t||'').match(/\d+/);return m?('00'+m[0]).slice(-3):''};
var nvLoja=function(m){return m>250000?3:m>=150000?2:1};
var vc=function(v){return '<span class="vc">V'+v+'</span>'};
var up=function(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()};
function nomeChave(n){return up(n).replace(/\s*-?\s*N\s*\d+\s*$/,'').replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function mesmo(a,b){a=nomeChave(a);b=nomeChave(b);if(!a||!b)return false;if(a===b)return true;var x=a.split(' '),y=b.split(' ');return x.length>1&&y.length>1&&x[0]===y[0]&&x[x.length-1]===y[y.length-1]}
var nl=function(n){return '<span class="nl n'+n+'">'+NL[n][0]+' · '+NL[n][1]+'</span>'};
var tc=function(t){return String(t||'').toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()})};

/* tema (segue o app) */
(function(){var q=new URLSearchParams(location.search),H=document.documentElement,t=q.get('tema');
 try{t=t||localStorage.getItem('st_tema')}catch(e){} if(t)H.dataset.theme=t; if(q.get('tema'))H.classList.add('embutido');
 $('btnTema').onclick=function(){H.dataset.theme=H.dataset.theme==='light'?'dark':'light'};
 window.addEventListener('message',function(ev){var d=ev&&ev.data;if(d&&(d.st_tema==='light'||d.st_tema==='dark'))H.dataset.theme=d.st_tema});})();

var BASE=null, NIV=null, CONF={}, GER={}, LOJAS=[], TODAS=[], SUPS=[], ABAS=[], EU=null, ST={tab:'ger',sup:null,loja:null,vend:null,fl:''}, PODE=false, INV={}, INV_OK=false, LANCA=false, MESK='', UT=0, UD=0, UR=0, FECH=false, SALVANDO=false;

function faixa(p){return p>=1.3?2:p>=1?1:p>=0.95?0:-1}
function conf(cod){var m=CONF[MESK]||{},c=m[cod]||{};return{inv:c.inv===1||c.inv===true,cont:!(c.cont===0||c.cont===false),por:c.por||'',em:c.em||''}}
/* contagem de inventário do supervisor (servidor: aba INV_SUP). st: pendente | validado | recusado */
function invDe(cod){var r=INV[cod]; if(!r||!(r.ic>0)) return null; return {ic:+r.ic,ie:+r.ie||0,ass:Math.max(r.ic-(+r.ie||0),0)/r.ic,st:r.st||'pendente',foto:!!r.foto,por:r.por||'',em:r.em||'',vpor:r.vpor||'',vem:r.vem||'',motivo:r.motivo||''}}
function contDe(t){return Array.isArray(t)?(t[0]||{}):(t||{})}   /* o servidor só aceita tabela em lista: guardamos [ {mes:{loja:{}}} ] */

/* ===== CÁLCULO de uma loja =====
   garantido = já travado pelos números de hoje · proj = no ritmo dos dias úteis · alvo = fechando 100% em tudo */
function calc(a){
 var cod=code3(a[0]), meta=+a[3]||0, fat=+a[5]||0, C=a[8]||[];
 var proj=FECH?fat:((+a[6]>0)?+a[6]:(UD?fat/UD*UT:fat));
 var n=nvLoja(+a[7]||0);
 if(NIV&&NIV.LOJAS){var o=NIV.LOJAS.filter(function(z){return code3(z.id)===cod})[0]; if(o&&+o.niv) n=+o.niv}
 var pct=meta?fat/meta:0, pp=meta?proj/meta:0, cf=conf(cod), it=[];
 var x={cod:cod,nome:a[1],sup:a[2],nl:n,meta:meta,fat:fat,proj:proj,pct:pct,pp:pp,med90:+a[7]||0,cf:cf,ger:GER[cod]||''};
 var ritmo=function(alvo){var f=Math.max(alvo-fat,0);return f?('<b>'+R(f)+'</b>'+(UR&&!FECH?' · <b>'+R(f/UR)+'</b> por dia útil':'')):''};
 var prox=function(){for(var i=0;i<3;i++) if(pct<FX[i]) return i; return -1};

 /* 1 · meta da loja */
 (function(){var g=B.ger[n],fa=faixa(pct),fp=faixa(pp),px=prox();
  var f=px<0?'Super meta batida: a maior faixa já está garantida.':(FECH?'Fechou em '+P(pct)+'.':'Faltam '+ritmo(FX[px]*meta)+' para a faixa de '+FXR[px]+' ('+R(g[px])+').');
  it.push({k:'meta',n:'Meta da loja',qd:'pago no 5º dia útil',gar:fa<0?0:g[fa],prj:fp<0?0:g[fp],alvo:g[1],
   st:fa>=1?'ok':fa===0?'ok':fp>=0?'rit':'risco',stT:fa>=0?'faixa '+FXR[fa]+' garantida':fp>=0?'no ritmo de '+FXR[fp]:'abaixo de 95% no ritmo',
   falta:f,regra:'Paga a maior faixa batida: 95% '+R(g[0])+' · 100% '+R(g[1])+' · 130% '+R(g[2])+' (loja '+NL[n][1]+').'})})();

 /* 2 · meta de time */
 (function(){var g=B.time,fa=faixa(pct),fp=faixa(pp),px=prox();
  it.push({k:'time',n:'Meta de time',qd:'pago no dia 10',gar:fa<0?0:g[fa],prj:fp<0?0:g[fp],alvo:g[1],
   st:fa>=0?'ok':fp>=0?'rit':'risco',stT:fa>=0?'faixa '+FXR[fa]+' garantida':fp>=0?'no ritmo de '+FXR[fp]:'abaixo de 95% no ritmo',
   falta:px<0?'Maior faixa garantida.':(FECH?'':'Anda junto com a meta da loja: próxima faixa em '+FXR[px]+' ('+R(g[px])+').'),
   regra:'Pelo alcance da loja: 95% '+R(g[0])+' · 100% '+R(g[1])+' · 130% '+R(g[2])+'.'})})();

 /* 3 · performance (% do faturamento) */
 (function(){var t=B.perf[n];
  if(!t){ var t2=B.perf[2]; it.push({k:'perf',n:'Performance',qd:'pago no dia 20',gar:0,prj:0,alvo:0,st:'na',stT:'não paga em loja Bronze',
   falta:'Em loja Prata este mesmo faturamento projetado pagaria <b>'+R(t2*proj)+'</b>.',regra:'0,4% do faturamento do mês em loja Prata e 0,5% em loja Ouro. Bronze não tem.'}); return; }
  var on=cf.cont;

function invAcao(box,ac){

  p.then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); INV[cod]=j.reg; SALVANDO=false; render();
    var b=document.querySelector('.invl[data-inv="'+cod+'"]'); if(b) invMsg(b,okMsg); })
   .catch(function(e){SALVANDO=false;invMsg(box,'Não consegui: '+((e&&e.message)||e))})};
 if(ac==='foto'){ var fb=box.querySelector('[data-fotobox]'); if(fb.firstChild){fb.innerHTML='';return} invMsg(box,'Abrindo a foto…');

 if(ac==='lancar'){ var ic=Math.round(+q('ic').value), ie=q('ie').value===''?NaN:Math.round(+q('ie').value), f=q('foto').files[0];

  if(!f&&!PODE){invMsg(box,'Anexe a foto da última divergência, mostrando data e horário.');return}
  fim((f?invReduz(f):Promise.resolve('')).then(function(d){return STDados.chamar('invsupLancar',{mes:MESK,loja:cod,itens:ic,erros:ie,mime:d?'image/jpeg':'',b64:d?d.replace(/^data:[^;]+;base64,/,''):''})}),'✓ Contagem enviada. Aguarda a validação da coordenação.'); return; }

  fim(STDados.chamar('invsupValidar',{mes:MESK,loja:cod,st:'recusado',motivo:m}),'Contagem recusada. O supervisor vê o motivo.'); return; }

  var a=ST.loja?LOJAS.filter(function(l){return code3(l[0])===ST.loja})[0]:(LOJAS.length===1?LOJAS[0]:null);
  if(a){ ATUAL=calc(a); ATUAL._a=a; h=telaLoja(ATUAL); volta=LOJAS.length>1; } else h=listaLojas();

 }
 $('btnVoltar').hidden=!volta; $('btnVoltar').textContent='← '+(ST.tab==='sup'?'Todos os supervisores':ST.tab==='ger'?'Todas as lojas':'Todos os vendedores'); $('btnZap').hidden=!ATUAL;
