<style>
:root{--bg:#0f1522;--surface:#1a2336;--surface2:#141c2c;--ink:#eef2fb;--muted:#9aa5bb;--line:#2c3850;--accent:#ff3b47;--navy:#4f7cf0;--ok:#2FD08E;--warn:#FFC94D;
--f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html[data-theme="light"]{--bg:#f5f7fb;--surface:#fff;--surface2:#f7f9fd;--ink:#16233d;--muted:#5a677f;--line:#e4e9f3;--navy:#1C3F8F;--ok:#128a52;--warn:#b77900;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}

.aviso{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:12px 16px}.aviso.erro{border-left-color:#d9363e}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.campo input,.campo select,.campo textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:110px}
.campo textarea{min-width:260px;min-height:64px}
td input{width:84px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right}

</head><body><div class="wrap"><div class="topbar"></div>
<header><div><div class="eyebrow">Só Tintas · Bonificação</div><h1>🎯 Campanhas</h1><div class="sub" id="sub">Pix Semanal e campanhas da rede</div></div>
<div class="row"><input type="month" id="mes" aria-label="Mês" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px"><button class="btn" id="btnTema">◐ Tema</button></div></header>
<div class="chips" id="camps"></div>

<script src="st-hora.js?v=1"></script><script src="st-dados.js?v=93"></script>
<script>
(function(){
'use strict';
/* URL do Servidor de Campanhas ST (Apps Script novo). Preenchida na publicação. */
var URL_CAMP='https://script.google.com/macros/s/AKfycbxJW4qMOTHnuF9CVAMuBXS6IxqBa5I6QU-iVzet3jWl0dkkDjdHDbctht1mAD9rBw4DhA/exec';
var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var brl=function(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var brl0=function(v){return 'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR')};
var pct1=function(v){return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'};
var isNum=function(v){return typeof v==='number'&&!isNaN(v)};
var norm=function(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()};
var cod3=function(f){var m=String(f||'').match(/^\s*(\d+)/);return m?('00'+m[1]).slice(-3):''};
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3500)}
function aviso(t,erro){var a=$('aviso');a.innerHTML=t||'';a.className='aviso'+(erro?' erro':'');a.hidden=!t}

try{var q=new URLSearchParams(location.search),t=q.get('tema')||localStorage.getItem('st_tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('btnTema').onclick=function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme=='light'?'dark':'light'};

/* ═════════ servidor ═════════ */
function post(corpo){return fetch(URL_CAMP,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(corpo)}).then(function(r){return r.json()})}
function chamar(acao,extra){
  function vai(tk){var b={acao:acao,tk:tk};for(var k in(extra||{}))b[k]=extra[k];return post(b)}
  return STDados.cracha().then(vai).then(function(r){
    if(r&&!r.ok&&r.cracha){try{localStorage.removeItem('st_cracha_v1')}catch(e){}return STDados.cracha().then(vai)}
    return r}).then(function(r){if(!r||!r.ok)throw new Error((r&&r.erro)||'Falha no servidor de campanhas.');return r});
}

/* ═════════ motor do Pix Semanal ═════════ */
var PIX_PADRAO={
 semanas:[{n:1,datas:'02 a 07',pct:.25,nota:''},{n:2,datas:'09 a 14',pct:.30,nota:''},{n:3,datas:'16 a 21',pct:.25,nota:''},{n:4,datas:'23 a 28',pct:.40,nota:''},{n:5,datas:'30',pct:.15,nota:'Fecha no último dia do mês'}],
 bonus:{1:[45,95,140,185,220],2:[55,110,165,220,265],3:[45,95,140,185,220],4:[75,150,220,295,355],5:[30,50,85,115,140]},
 carteira:{BRUNO:'002,004,006,007,009,010,012,013,017,022,023',RAMON:'018,019,021,024,025,026,035,036',DANILO:'016,027,028,029,030,032,033,034,038','CARLOS EDUARDO':'008,015'},
 regua:{loja:[100000,180000],vend:{3:[50000,65000,85000,130000],2:[40000,55000,70000,95000],1:[30000,45000,60000,80000]}}
};
var EXCLUI=/ATENDIMENTO|ADMINISTRA|TESTE|EXPEDI|MP -/i;
var E={};
E.parse=function(rows){var occ={},store={},cur=null;
 for(var i=1;i<rows.length;i++){var r=rows[i]||[],a=r[0],b=r[1];
  if(a&&String(a).indexOf('Filtros')===0)continue;
  if(b==='Total'){if(a!=null){cur=String(a).trim();store[cur]=r[7]}continue}
  if(a)cur=String(a).trim();
  if(b&&cur){var n=String(b).trim();(occ[n]=occ[n]||[]).push([cur,r[2],r[3],r[7]])}}
 return{occ:occ,store:store}};
E.baseMetas=function(p){var vend={};
 Object.keys(p.occ).forEach(function(n){var es=p.occ[n],home=es.filter(function(e){return isNum(e[1])})[0];
  if(home){var med=home[3];if(!isNum(med)){var o=es.filter(function(e){return e!==home&&isNum(e[3])})[0];med=o?o[3]:null}vend[n]={f:home[0],m:home[1],d:isNum(med)?med:null}}
  else vend[n]={f:es[0][0],m:null,d:null}});
 var st={};Object.keys(p.store).forEach(function(k){if(isNum(p.store[k]))st[k]=p.store[k]});return{vend:vend,store:st}};
E.nl=function(m,rg){return m>=rg.loja[1]?3:m>=rg.loja[0]?2:1};
E.nv=function(m,nl,rg){var l=1;rg.vend[nl].forEach(function(x,i){if(m>=x)l=i+2});return l};
E.fechar=function(base,pf,rg){var fat={};
 Object.keys(pf.occ).forEach(function(n){var es=pf.occ[n];fat[n]={v:es.reduce(function(s,e){return s+(e[2]||0)},0),fil:es[0][0]}});
 var linhas=[],excl=[],nomes={};Object.keys(base.vend).concat(Object.keys(fat)).forEach(function(n){nomes[n]=1});
 Object.keys(nomes).sort().forEach(function(n){var m=base.vend[n],f=fat[n],fil=(m&&m.f)||(f&&f.fil)||'';
  if(EXCLUI.test(n)||fil.indexOf('(CD)')>=0)return;
  function ex(x){excl.push([n,fil,x])}
  if(!m)return ex('Só aparece nas vendas, não está na base de metas');
  if(!f)return ex('Só aparece na base de metas, sem venda na semana');
  if(m.m==null)return ex('Sem meta cadastrada');
  if(m.m<1000)return ex('Meta mensal de '+brl(m.m)+' — placeholder de cadastro');
  var eff=(m.m>=49999&&m.m<50000)?50000:m.m;
  if(eff<50000)return ex('Meta mensal abaixo de R$ 50 mil — fora do piso da campanha');
  if(m.d==null)return ex('Sem Média 90 dias do vendedor — não dá para nivelar');
  var sm=base.store[fil];if(sm==null)return ex('Loja sem Média 90 dias registrada');
  var nl=E.nl(sm,rg);linhas.push([fil,n,eff,f.v,m.d,sm,nl,E.nv(m.d,nl,rg)])});
 return{linhas:linhas,excl:excl}};
E.sup=function(fil,cart){var c=cod3(fil);for(var s in cart){if(String(cart[s]).split(/[,\s;]+/).map(function(x){return('00'+x).slice(-3)}).indexOf(c)>=0)return s}return'SEM SUPERVISOR'};
E.resultado=function(sem,pct,bonus,cart){return sem.linhas.map(function(l){var at=l[3]/l[2],ok=at>=pct;
 return{filial:l[0],nome:l[1],meta:l[2],fat:l[3],at:at,ok:ok,nv:l[7],valor:ok?bonus[l[7]-1]:0,falta:ok?0:Math.max(0,pct*l[2]-l[3]),sup:E.sup(l[0],cart)}}).sort(function(a,b){return b.at-a.at})};
window.__E=E;

/* ═════════ estado ═════════ */
var S={def:[],camp:null,mes:'',aba:'resumo',perfil:null,nome:'',full:null,pub:{},erro:null,carregando:true,editando:false};
var coord=function(){return S.perfil==='coord'};
var mesHoje=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function campAtual(){return S.def.filter(function(c){return c.id===S.camp})[0]}
function seed(){return[
 {id:'pix',nome:'Pix Semanal',tipo:'pix',ativa:true,desc:'Bônus semanal por nível de vendedor (V1–V5): bateu o % mínimo da meta mensal na semana, ganha.',param:JSON.parse(JSON.stringify(PIX_PADRAO))},
 {id:'gerentes70',nome:'Gerentes 70%',tipo:'meta_loja',ativa:true,desc:'Loja que atingir o % da meta do mês até o prazo ganha o prêmio (gerente).',param:{pct:.70,prazo:'',premio:500}}]}
function novoFull(c){return c.tipo==='pix'?{base:null,semanas:{}}:{lojas:null}}

function carregar(){
 S.carregando=true;S.erro=null;render();
 var ex={mes:S.mes};if(S.camp)ex.id=S.camp;
 return chamar('campLer',ex).then(function(r){
  S.perfil=r.perfil;S.nome=r.nome;S.def=r.def||[];S.pub=r.pub||{};S.full=r.full||null;
  if(!S.def.length&&coord()){S.def=seed();return salvarDef()}
 }).then(function(){
  if(!S.camp||!campAtual()){S.camp=S.def.length?S.def[0].id:null;if(S.camp&&coord())return chamar('campLer',{mes:S.mes,id:S.camp}).then(function(r){S.pub=r.pub||{};S.full=r.full||null})}
 }).then(function(){
  var c=campAtual();if(c&&coord()&&!S.full)S.full=novoFull(c);
  S.carregando=false;render();
 }).catch(function(e){S.carregando=false;S.erro=e.message;render()});
}
function trocarCamp(id){S.camp=id;S.aba='resumo';S.editando=false;S.full=null;S.pub={};carregar()}

/* ═════════ salvar / publicar ═════════ */
function salvarFull(){return chamar('campSalvarFull',{id:S.camp,mes:S.mes,full:S.full})}
function salvarDef(){return chamar('campSalvarDef',{def:S.def})}
function porLoja(rows,fn){var o={};rows.forEach(function(x){var l=cod3(x.filial);(o[l]=o[l]||fn(x)).linhas.push(x)});return o}
function visaoSemana(n){var c=campAtual();
 if(coord()){var s=S.full&&S.full.semanas&&S.full.semanas[n];if(!s)return null;var P=c.param,p=P.semanas[n-1],sn=s.fechada&&s.snap,pct=sn?sn.pct:p.pct;
  return{n:n,datas:p.datas,pct:pct,fechada:!!s.fechada,R:E.resultado(s,pct,sn?sn.bonus:P.bonus[n],sn?sn.carteira:P.carteira),excl:s.excl,arq:s.arq}}
 var d=S.pub['s'+n];if(!d)return null;var cods=Object.keys(d);if(!cods.length)return null;var R=[];cods.forEach(function(k){d[k].linhas.forEach(function(x){R.push(x)})});
 R.sort(function(a,b){return b.at-a.at});var f=d[cods[0]];return{n:n,datas:f.datas,pct:f.pct,fechada:f.fechada,R:R,excl:[],arq:''}}
function publicarSemana(n){var v=visaoSemana(n);if(!v)return Promise.resolve();var pub={};
 pub['s'+n]=porLoja(v.R,function(){return{n:n,datas:v.datas,pct:v.pct,fechada:v.fechada,linhas:[]}});
 return chamar('campPublicar',{id:S.camp,mes:S.mes,pub:pub})}
function pixCarteira(){var p=S.def.filter(function(c){return c.tipo==='pix'})[0];return p?p.param.carteira:PIX_PADRAO.carteira}
/* a linha "Total" do arquivo META não é loja: fica fora da lista, da contagem e do prêmio */
function ehLoja(f){return!/^total\b/i.test(String(f==null?'':f).trim())}
function dadosMeta(){var c=campAtual(),P=c.param;
 if(coord()){var g=S.full&&S.full.lojas;if(!g)return null;return{P:P,arq:S.full.arq,R:Object.keys(g).filter(ehLoja).map(function(k){var l=g[k],at=l.m?l.f/l.m:0,ok=at>=P.pct;return{filial:k,meta:l.m,fat:l.f,at:at,ok:ok,premio:ok?P.premio:0,sup:E.sup(k,pixCarteira())}}).sort(function(a,b){return b.at-a.at})}}
 var d=S.pub.meta;if(!d)return null;var R=Object.keys(d).map(function(k){return d[k]}).filter(function(x){return ehLoja(x.filial)});if(!R.length)return null;return{P:{pct:R[0].pct,prazo:R[0].prazo,premio:R[0].premioBase},R:R.sort(function(a,b){return b.at-a.at})}}
function publicarMeta(){var d=dadosMeta();if(!d)return Promise.resolve();var o={};
 d.R.forEach(function(x){o[cod3(x.filial)]={filial:x.filial,meta:x.meta,fat:x.fat,at:x.at,ok:x.ok,premio:x.premio,sup:x.sup,pct:d.P.pct,prazo:d.P.prazo,premioBase:d.P.premio}});
 return chamar('campPublicar',{id:S.camp,mes:S.mes,pub:{meta:o}})}

/* ═════════ planilhas (leitor carregado só quando a coordenação precisa) ═════════ */
function carregaXlsx(){return window.XLSX?Promise.resolve():new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=function(){no(new Error('Não consegui carregar o leitor de planilhas (precisa de internet).'))};document.head.appendChild(s)})}
function lerArquivo(f){return carregaXlsx().then(function(){return new Promise(function(ok,no){var fr=new FileReader();fr.onerror=function(){no(new Error('Não consegui abrir o arquivo.'))};
 fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array'});ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,raw:true}))}catch(e){no(e)}};fr.readAsArrayBuffer(f)})})}
function hoje(){return new Date().toISOString().slice(0,10)}
function upload(fn){return function(inp,extra){var f=inp.files[0];if(!f)return;lerArquivo(f).then(function(rows){return fn(rows,f.name,extra)}).then(function(m){toast(m+' ✔');render()}).catch(function(e){toast(e.message)});inp.value=''}}
var aplicarBase=function(rows,nome){var b=E.baseMetas(E.parse(rows));if(!Object.keys(b.vend).length)throw new Error('Não encontrei vendedores. É o INDICADORES do mês (com meta e Méd. 90 dias)?');
 S.full.base={vend:b.vend,store:b.store,em:hoje(),arq:nome};return salvarFull().then(function(){return Object.keys(b.vend).length+' vendedores, '+Object.keys(b.store).length+' lojas'})};
var aplicarSemana=function(rows,nome,n){if(!S.full.base)throw new Error('Envie primeiro a base de metas (INDICADORES do mês).');
 var r=E.fechar(S.full.base,E.parse(rows),campAtual().param.regua);if(!r.linhas.length)throw new Error('Nenhum vendedor correlacionou. Confira se é o INDICADORES da semana.');
 S.full.semanas[n]={linhas:r.linhas,excl:r.excl,arq:nome,em:hoje(),fechada:false,snap:null};
 return salvarFull().then(function(){return publicarSemana(n)}).then(function(){return r.linhas.length+' vendedores correlacionados, '+r.excl.length+' excluídos'})};
var aplicarMeta=function(rows,nome){var lojas={};rows.slice(1).forEach(function(r){if(r&&r[0]&&!/^(Filtros|ano_|nome|sk_)/.test(String(r[0]))&&ehLoja(r[0])&&isNum(r[1]))lojas[String(r[0]).trim()]={m:r[1],f:isNum(r[2])?r[2]:0}});
 if(!Object.keys(lojas).length)throw new Error('Não encontrei lojas. É o arquivo META?');S.full.lojas=lojas;S.full.arq=nome;S.full.em=hoje();
 return salvarFull().then(publicarMeta).then(function(){return Object.keys(lojas).length+' lojas'})};
window.Camp={
 base:upload(aplicarBase),semana:upload(aplicarSemana),meta:upload(aplicarMeta),
 aba:function(a){S.aba=a;render()},camp:trocarCamp,
