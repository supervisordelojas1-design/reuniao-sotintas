function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fonte(c,peso,tam,disp){c.font=peso+' '+tam+'px '+(disp?'"Bricolage Grotesque"':'"Public Sans"')+',system-ui,sans-serif'}
function caber(c,t,max){t=String(t);if(c.measureText(t).width<=max)return t;while(t.length>1&&c.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
function quebrar(c,t,max,n){var ps=String(t).split(/\s+/),L=[],a='';ps.forEach(function(p){var z=a?a+' '+p:p;if(c.measureText(z).width>max&&a){L.push(a);a=p}else a=z});if(a)L.push(a);if(L.length>n){L=L.slice(0,n);L[n-1]=caber(c,L[n-1]+' …',max)}return L}
function fundoCard(c){var g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b1a3d');g.addColorStop(.55,'#12306e');g.addColorStop(1,'#1C3F8F');c.fillStyle=g;c.fillRect(0,0,W,H);
 var r=c.createRadialGradient(W,0,0,W,0,700);r.addColorStop(0,'rgba(211,32,39,.35)');r.addColorStop(1,'rgba(211,32,39,0)');c.fillStyle=r;c.fillRect(0,0,W,H);
 var y=c.createRadialGradient(0,H,0,0,H,620);y.addColorStop(0,'rgba(255,209,0,.18)');y.addColorStop(1,'rgba(255,209,0,0)');c.fillStyle=y;c.fillRect(0,0,W,H);
 c.fillStyle='#D32027';c.fillRect(0,0,W,18);
 for(var i=0;i<27;i++)for(var j=0;j<2;j++){c.fillStyle=(i+j)%2?'rgba(255,255,255,.85)':'rgba(255,255,255,.08)';c.fillRect(i*40,H-84+j*20,40,20)}}
function caixa(c,x,y,w,h,forte){rr(c,x,y,w,h,22);c.fillStyle=forte?'rgba(255,209,0,.14)':'rgba(255,255,255,.08)';c.fill();c.strokeStyle=forte?'rgba(255,209,0,.7)':'rgba(255,255,255,.16)';c.lineWidth=2;c.stroke()}
function desenharCard(c,x,v,onde){
 fundoCard(c);var cc=conta(x,v.pct,v.pre),mes=MESTX.split(' ')[0];
 fonte(c,800,26);c.fillStyle='#FFD100';c.fillText(caber(c,('Sprint Final de '+mes+' · '+(x.tipo==='sup'?'Região '+x.nome:x.lojaNome)).toUpperCase(),W-144),72,92);
 var nome=x.tipo==='ger'?(x.semNome?'Gerente · '+x.lojaNome:x.nome):x.tipo==='sup'?'Supervisor · '+x.nome:x.nome;
 fonte(c,800,70,true);c.fillStyle='#fff';var L=quebrar(c,nome,W-144,2);L.forEach(function(t,i){c.fillText(t,72,168+i*76)});
 var y=168+(L.length-1)*76+50;fonte(c,600,30);c.fillStyle='#c9d6f2';
 c.fillText(caber(c,'Hoje '+pc(x.meta?x.fat/x.meta*100:0)+'% da meta · no ritmo fecha em '+pc(cc.pj)+'%',W-144),72,y);y+=46;
 /* o desafio */
 caixa(c,72,y,W-144,250,true);
 fonte(c,800,24);c.fillStyle='#FFD100';c.fillText('SUA META NO SPRINT',104,y+50);
 fonte(c,800,92,true);c.fillStyle='#fff';c.fillText(pc(v.pct,1)+'%',104,y+150);
 var wp=c.measureText(pc(v.pct,1)+'%').width;fonte(c,700,30);c.fillStyle='#c9d6f2';c.fillText('da meta',104+wp+16,y+150);
 fonte(c,600,28);c.fillStyle='#c9d6f2';c.fillText(caber(c,'fechar o mês em '+rs(cc.alvo),560),104,y+210);
 c.textAlign='right';fonte(c,800,24);c.fillStyle='#FFD100';c.fillText(v.pre!=null&&v.pre>0?'PRÊMIO':'GANHA SE BATER',W-104,y+50);
 fonte(c,800,64,true);c.fillStyle='#FFD100';c.fillText(v.pre!=null&&v.pre>0?rs(v.pre):rs(cc.ganha),W-104,y+140);
 if(v.pre>0&&cc.bonus>0){fonte(c,600,24);c.fillStyle='#c9d6f2';c.fillText('+ bônus de meta '+rs(cc.bonus),W-104,y+182)}
 c.textAlign='left';y+=280;
 /* o que falta */
 caixa(c,72,y,(W-144-20)/2,150);caixa(c,72+(W-144+20)/2,y,(W-144-20)/2,150);
 fonte(c,800,22);c.fillStyle='#9fb6e6';c.fillText('FALTA VENDER',100,y+44);c.fillText('POR DIA ÚTIL',72+(W-144+20)/2+28,y+44);
 fonte(c,800,50,true);c.fillStyle='#fff';c.fillText(cc.falta>0?rs(cc.falta):'Batido!',100,y+104);c.fillText(cc.falta>0?rs(cc.dia):'—',72+(W-144+20)/2+28,y+104);
 fonte(c,600,21);c.fillStyle='#c9d6f2';c.fillText(caber(c,'faltam '+pc(UR)+' dias úteis',(W-144)/2-60),100,y+136);c.fillText(caber(c,'hoje: '+rs(cc.ritmo)+' por dia',(W-144)/2-60),72+(W-144+20)/2+28,y+136);
 y+=186;
 /* onde buscar */
 if(onde){var itens=[];
  if(x.tipo==='sup')x.ls.slice().sort(function(a,b){return a.proj/a.meta-b.proj/b.meta}).slice(0,6).forEach(function(l){itens.push([l.lojaNome+' · '+l.cod,'projeta '+pc(l.meta?l.proj/l.meta*100:0,0)+'%'])});
  else{x.orc.filter(function(o){return !o.grande}).slice(0,3).forEach(function(o){itens.push(['Orçamento · '+o.cli,rs(o.v)])});x.par.slice(0,3).forEach(function(z){itens.push(['Cliente parado · '+z.cli,rs(z.avg)+'/mês'])})}
  var cabe=Math.floor((H-200-y-40)/62);itens=itens.slice(0,Math.max(0,cabe));
  if(itens.length){fonte(c,800,24);c.fillStyle='#9fb6e6';c.fillText(x.tipo==='sup'?'LOJAS PARA PUXAR':'ONDE BUSCAR',72,y);y+=18;
   itens.forEach(function(it){rr(c,72,y,W-144,52,14);c.fillStyle='rgba(255,255,255,.06)';c.fill();fonte(c,600,25);c.fillStyle='#fff';c.fillText(caber(c,it[0],660),96,y+35);
    c.textAlign='right';fonte(c,700,25);c.fillStyle='#FFD100';c.fillText(it[1],W-96,y+35);c.textAlign='left';y+=62})}}
 fonte(c,600,22);c.fillStyle='rgba(255,255,255,.75)';c.fillText(caber(c,'Base: meta do mês'+(QUANDO?' · números de '+QUANDO:'')+' · Só Tintas',W-144),72,H-110);
}
function gerarCard(){var cv=document.createElement('canvas');cv.width=W;cv.height=H;var c=cv.getContext('2d');desenharCard(c,CARD.x,CARD.v,$('cbOnde').checked);CARD.cv=cv;$('dlgImg').src=cv.toDataURL('image/png')}
function abrirCard(){var x=atual();if(!x)return;var v=lidos();
 if(!v.tem){var st=$('stSalvo');if(st){st.textContent='Lance o % do desafio para montar o card.';st.className='st erro'}if($('dPct'))$('dPct').focus();return}
 CARD={x:x,v:v};$('dlgT').textContent='Card do Sprint Final · '+(x.semNome?x.lojaNome:x.nome);
 var go=function(){gerarCard();var dg=$('dlg');if(dg.showModal&&!dg.open)dg.showModal();else dg.setAttribute('open','')};
 try{Promise.all([document.fonts.load('800 70px "Bricolage Grotesque"'),document.fonts.load('600 28px "Public Sans"'),document.fonts.load('800 24px "Public Sans"')]).then(go,go)}catch(e){go()}}
function baixarCard(){if(!CARD||!CARD.cv)return;var x=CARD.x,nm='sprint_final_'+(x.tipo==='sup'?'regiao_':x.tipo==='ger'?'loja_'+x.cod+'_':x.cod+'_')+String(x.semNome?x.lojaNome:x.nome).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_')+'_'+MESK+'.png';
 CARD.cv.toBlob(function(bl){if(!bl)return;var f=null;try{f=new File([bl],nm,{type:'image/png'})}catch(e){}
  var baixa=function(){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},8000)};
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:$('dlgT').textContent}).catch(baixa);return}baixa()},'image/png')}
document.addEventListener('change',function(ev){if(ev.target.id==='cbOnde'&&CARD)gerarCard()});

/* ===== eventos ===== */
function render(){lista();ficha()}
document.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;
 if(t.dataset.tab){ST.tab=t.dataset.tab;ST.sel=null;ST.reg='';['vend','ger','sup'].forEach(function(q){$('tb_'+q).setAttribute('aria-selected',ST.tab===q)});filtros();render();return}
 if(t.dataset.sel!=null){ST.sel=t.dataset.sel;render();if(window.matchMedia('(max-width:860px)').matches)$('ficha').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(t.id==='bAnt'||t.id==='bPro'){var L=filtrados(),i=L.indexOf(atual())+(t.id==='bPro'?1:-1);if(L[i]){ST.sel=L[i].chv;render()}return}
 if(t.id==='bSug'){var x=atual();if(x){$('dPct').value=sugestao(x);resultado();$('dPre').focus()}return}
 if(t.id==='bSalvar'){salvar(false);return}
 if(t.id==='bSalvarProx'){salvar(true);return}
 if(t.id==='bLimpar'){salvar(false,true);return}
 if(t.id==='btnPlan'){exportar();return}
 if(t.id==='bCard'){abrirCard();return}
 if(t.id==='dlgFechar'){var dg=$('dlg');if(dg.close)dg.close();else dg.removeAttribute('open');return}
 if(t.id==='dlgSalvar'){baixarCard();return}
});
document.addEventListener('input',function(ev){var t=ev.target;if(t.id==='dPct'||t.id==='dPre'){resultado();return}if(t.id==='fBusca'){ST.busca=t.value;render()}});
document.addEventListener('change',function(ev){if(ev.target.id==='fReg'){ST.reg=ev.target.value;ST.sel=null;render()}});
function filtros(){var regs=[];LOJAS.forEach(function(l){if(l.reg&&regs.indexOf(l.reg)<0)regs.push(l.reg)});regs.sort();
 $('fReg').innerHTML='<option value="">Todas as regiões</option>'+regs.map(function(r){return '<option value="'+esc(r)+'">'+esc(regCurta(r))+'</option>'}).join('');
 $('fReg').hidden=ST.tab==='sup'||regs.length<2}

function iniciar(dados,conf,pode,nome,gers){
 montar(dados,gers);PODE=!!pode;NOME_EU=nome||'';CFGM=conf||{};
 if(!LOJAS.length){aviso('Os números deste mês ainda não estão no Painel de Metas.');return}
 $('app').hidden=false;$('btnPlan').disabled=false;
 if(ESCOPO){$('tb_sup').hidden=true;if(ST.tab==='sup')ST.tab='vend'}
 $('sub').textContent=[ESCOPO?(LOJAS[0]&&LOJAS.every(function(l){return l.reg===LOJAS[0].reg})?'Região '+regCurta(LOJAS[0].reg):'Só a '+ESCOPO_TX)+' ('+LOJAS.length+(LOJAS.length===1?' loja':' lojas')+')':'',MESTX,QUANDO?'números de '+QUANDO:'',UR?'faltam '+pc(UR)+' dias úteis':'mês fechado'].filter(Boolean).join(' · ');
 $('rodape').innerHTML='<b>Como é a conta do potencial.</b> <b>Histórico</b>: a média mensal dos últimos 90 dias menos o que a pessoa projeta para este mês (só quando a média é maior). '+
  '<b>Carteira parada</b>: clientes CNPJ que compraram em pelo menos 2 dos 3 últimos meses fechados (média de R$ '+fmt(CART_MIN)+' ou mais) e ainda não compraram neste mês; entra '+pc(P_CART*100,0)+'% da média deles. '+
  '<b>Orçamentos em aberto</b>: entra 1/3 do valor dos feitos há até 15 dias e 1/5 dos mais antigos. São as mesmas regras das alavancas do Painel de Metas. '+
  '<b>Teto do mês</b>: o potencial nunca passa de +'+pc(P_TETO*100,0)+'% sobre o ritmo de venda de hoje nos dias úteis que faltam (no fim do mês o teto encolhe). Orçamento acima de '+pc(ORC_GRANDE*100,0)+'% da meta da loja aparece com ⚠ para conferir. '+
  'É uma <b>estimativa</b> para priorizar quem desafiar: as três fontes podem se sobrepor (um orçamento pode ser de um cliente da carteira). Gerente = números da loja inteira; supervisor = soma das lojas. '+
  '<b>Ganha</b> = só o bônus de atingimento de meta (95% · 100% · 130%) mais o prêmio do desafio.';
 filtros();render();
}
var q=new URLSearchParams(location.search);DEMO=!!q.get('demo');
if(DEMO){
 var cods=Object.keys(CURTO),regs=['SUPERVISOR BRUNO SÓ TINTAS','SUPERVISOR DANILO SÓ TINTAS','SUPERVISOR RAMON SÓ TINTAS','SUPERVISOR CARLOS EDUARDO SÓ TINTAS'];
 var sd=11,rnd=function(){sd=(sd*9301+49297)%233280;return sd/233280};
 var nomes=['ANA SOUZA','BRUNO LIMA','CARLA DIAS','DIEGO ROCHA','EDUARDA MELO','FABIO NUNES','GABRIEL REIS','HELENA CRUZ','IGOR PAIVA','JULIA MOTA'],cli=['CONSTRUTORA ALFA','PINTURAS BETA','CONDOMINIO GAMA','REFORMAS DELTA','ENGENHARIA SIGMA','OBRAS OMEGA','IMOBILIARIA KAPPA'];
 var O={},K={},hj=new Date(),iso=function(d){var x=new Date(hj.getTime()-d*864e5);return x.toISOString().slice(0,10)};
 var L=cods.map(function(c,i){var meta=Math.round(150000+rnd()*350000),alc=.6+rnd()*.5,fat=Math.round(meta*alc*16.5/21),vs=[];O[c]=[];K[c]={c:[]};
  for(var k=0;k<1+Math.floor(rnd()*3);k++){var nm=nomes[(i+k)%10]+' '+(k+1),vm=Math.round(60000+rnd()*120000),va=.5+rnd()*.7;vs.push([nm,vm,Math.round(vm*va*16.5/21),Math.round(vm*(.7+rnd()*.6))]);
   for(var o=0;o<Math.floor(rnd()*5);o++)O[c].push([nm,true,iso(Math.floor(rnd()*40)),cli[Math.floor(rnd()*7)]+' '+(o+1),'',Math.round(800+rnd()*14000),'']);
   for(var z=0;z<Math.floor(rnd()*6);z++){var b=600+rnd()*6000;K[c].c.push([cli[Math.floor(rnd()*7)]+' '+c+z+' - VEND.: '+nm,0,0,0,0,[b,b*1.1,b*.8,rnd()<.55?0:b]])}}
  vs.push(['ASSISTENTE '+c,3,0,0]);
  return [c,'SO TINTAS '+c,regs[i%4],meta,meta,fat,0,Math.round(meta*(.8+rnd()*.4)),[],vs]});
 var gm={};cods.forEach(function(c,i){if(i%7!==3)gm[c]=['Marta Pires','Jorge Alves','Rita Campos','Sandro Leal','Vera Nogueira'][i%5]});
 iniciar({p:['NOVEMBRO',2026,'2026-11-25',21,16.5,4.5],t:['','','','','2026-11-25 06:56:31'],L:L,O:O,K:K},null,q.get('demo')!=='ver','Bruno',gm);
} else if(!window.STDados||!STDados.crachaGuardado){aviso('Abra este painel pelo <b>Só Tintas App</b>, já com o seu login.')}
else {
 var liberado=(function(){var s=null;try{s=JSON.parse(localStorage.getItem('sotintas_sessao_v1')||'null')}catch(e){}
  var vis=null;try{vis=STDados.visao&&STDados.visao()}catch(e){}
  var bruno=!vis&&!!s&&((String(s.nome||'').trim().toLowerCase()==='bruno'&&/coorden/i.test(String(s.papel||'')))||String(s.email||'').toLowerCase()==='supervisordelojas1@sotintasnet.com.br');
  if(bruno)return true;
  try{if(window.parent!==window&&typeof window.parent.podePainel==='function'){var pd=typeof window.parent.padraoDesafios==='function'?!!window.parent.padraoDesafios():false;return !!window.parent.podePainel('verDesafios',pd)}}catch(e){}
  return false})();
 if(!liberado){aviso('Este painel é da coordenação e dos supervisores.')}
 else{aviso('Carregando os números do mês…');
  STDados.cracha().then(function(tk){
   var post=function(tipo){return fetch(API_PAINEL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tipo:tipo,u:'cracha',p:tk})}).then(function(r){return r.json()})};
   var pC=STDados.chamar('conteudoLer').then(function(j){return j&&j.ok&&j.cont?contDe(j.cont[TAB]):{}}).catch(function(){return {}});
   var pG=post('rally').then(function(j){var g={};if(j&&j.ok&&j.lojas)j.lojas.forEach(function(x){var n=nomeV(String(x[6]||''));if(n)g[cod3(x[0])]=n});return g}).catch(function(){return {}});
   var pN=STDados.chamar('niveis').then(function(j){NIV=j&&j.ok&&j.data||null}).catch(function(){});
   return Promise.all([post('dados'),pC,pG,pN]).then(function(a){var r=a[0],T=a[1]||{},GM=a[2]||{};
    if(!r||!r.ok){aviso(esc((r&&r.erro)||'Não consegui buscar os números do mês.'));return}
    aviso('');var c=STDados.crachaGuardado(),pf=c&&c.perfil,vis=null,s=null;try{vis=STDados.visao&&STDados.visao()}catch(e){}try{s=STDados.sessaoVisao()}catch(e){}
    var mk=String((r.dados&&r.dados.p&&r.dados.p[2])||'').slice(0,7);
    /* 26/11/2026: quem não é da coordenação/análise vê só as lojas do próprio crachá (supervisor = a área dele; gerente = a loja dele) */
    if(pf!=='coord'&&pf!=='anl'){var lj=((c&&c.lojas)||[]).map(function(x){return cod3(String(x).split(' - ')[0])}).filter(function(x){return x!=='000'});
     if(!lj.length){aviso('Não achei as lojas da sua área no seu login. Saia e entre de novo no app; se continuar, fale com a coordenação.');return}
     ESCOPO=lj;ESCOPO_TX=pf==='sup'?'sua área':'sua loja'}
    iniciar(r.dados,T[mk]?JSON.parse(JSON.stringify(T[mk])):null,pf==='coord'&&!vis,(s&&s.nome)||(c&&c.nome)||'',GM)})
  }).catch(function(e){aviso(esc((e&&e.message)||'Sem conexão com o servidor.'))})}
}
})();
