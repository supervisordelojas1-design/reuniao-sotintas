<style>
:root{

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}

.s-perdido{background:var(--badbg);color:var(--bad)}.s-prorrogado{background:var(--warnbg);color:var(--warn)}

select.sel{min-height:44px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:0 10px;font:600 14px var(--f-body);max-width:100%}
dialog{width:min(520px,calc(100% - 20px));max-height:calc(100dvh - 20px);border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0}

.toast{position:fixed;left:0;right:0;margin:auto;bottom:18px;width:max-content;max-width:calc(100% - 24px);background:#16233d;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)}

.abas{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

.agir{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border:0;border-radius:10px;padding:8px 12px;font:500 13px var(--f-body);color:var(--ink);background:var(--surface2)}
button.agir{cursor:pointer}.agir.r{background:var(--badbg)}.agir.a{background:var(--warnbg)}.agir.v{background:var(--okbg)}
.plc{width:100%;border-collapse:collapse;font-size:13px}
.plc th,.plc td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.plc thead th{border-top:0;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.plc th:first-child{text-align:left}
.mot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;gap:8px;font-size:12.5px}
.barra{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden}.barra i{display:block;height:100%;background:var(--bad)}
.marca{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:600}.marca input{width:20px;height:20px;accent-color:var(--navy)}
.obra{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.obra legend{padding:0 6px}
@media(max-width:420px){.kpi b{font-size:15px}.btn{padding:9px 8px;font-size:13px}}

<script>
(function(){
  function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var p=(qp('tema')||'').toLowerCase(), t=(p==='claro'||p==='light')?'light':(p==='escuro'||p==='dark')?'dark':null;
  if(!t){ var s=(ls('st_tema')||'').toLowerCase(); t=(s==='light'||s==='claro')?'light':'dark'; }
  window.__setTema=function(tema){ document.documentElement.setAttribute('data-theme',tema); document.documentElement.style.colorScheme=tema;
    var ic=document.getElementById('temaIc'), tx=document.getElementById('temaTx'); if(ic) ic.textContent=tema==='light'?'☀️':'🌙'; if(tx) tx.textContent=tema==='light'?'Claro':'Escuro';
    try{localStorage.setItem('st_tema',tema);}catch(e){} try{ if(window.parent&&window.parent!==window) window.parent.postMessage({st_tema:tema},'*'); }catch(e){} };
  window.__setTema(t);
  window.addEventListener('message',function(ev){ var d=ev&&ev.data; if(d&&(d.st_tema==='light'||d.st_tema==='dark')) window.__setTema(d.st_tema); });
  document.getElementById('btnTema').onclick=function(){ window.__setTema(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); };
})();

<script>
/* ═══════════════════════════════════════════════════════════════
   CRM DE VENDAS — orçamentos em aberto, carteira CNPJ, pós-venda CPF,
   pintores imobiliários e a visão do gerente. Todas as lojas.

   De onde vêm as listas:
     · orçamentos e carteira CNPJ: pacote do Painel de Metas (mesmo crachá);
       para o vendedor, casa pelo nome oficial da ficha do PDI Semanal.
     · pós-venda CPF: base enviada ao servidor pela rotina diária (compras
       de R$ 500 ou mais), nas janelas de 3, 15, 45 e 180 dias.
     · pintores: cadastrados aqui mesmo.
   Onde ficam os registros: no Servidor de Dados ST (ações crm* — arquivo
   crm.gs.txt). Enquanto o servidor não tiver essas ações, ou sem internet,
   tudo fica guardado NESTE aparelho e sobe sozinho na próxima vez que a
   tela abrir com o servidor respondendo.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var PAINEL_API_URL='https://script.google.com/macros/s/AKfycbzVe8joykFt0rWX9CjFgpeOaABckMFttVwV8u4e-yJh8qXPr6JTmlAzfgNjiAPAHGEwLg/exec';
  var MAXL=60;
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var brl=function(n){return 'R$ '+Math.round(Number(n)||0).toLocaleString('pt-BR');};
  var mil=function(n){n=Number(n)||0;return n>=1000?'R$ '+(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:n>=100000?0:1})+' mil':brl(n);};
  var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+N\s?\d+$/i,'').replace(/^\d+\s*-\s*/,'').replace(/[^A-Za-z ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();};
  var NK=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,' ').trim().toUpperCase();};
  var nm=function(s){return String(s||'').replace(/^\d+\s*-\s*/,'').replace(/\s*-?\s*N\s?\d+$/i,'').trim();};
  var code3=function(c){var m=/\d{1,3}/.exec(String(c||''));return m?('00'+m[0]).slice(-3):'';};
  var p2=function(n){return (n<10?'0':'')+n;};
  var agora=function(){return window.STHora?STHora.data():new Date();};
  var iso=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
  var hojeISO=function(){return iso(agora());};
  var meioDia=function(){var h=agora();return new Date(h.getFullYear(),h.getMonth(),h.getDate(),12,0,0);};
  var dBr=function(s){var p=String(s||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]:'';};
  var diasDesde=function(s){var t=new Date(s).getTime();return isNaN(t)?null:(Date.now()-t)/864e5;};
  function toast(m){ [].forEach.call(document.querySelectorAll('.toast'),function(x){x.remove();}); var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},3200); }
  function novoId(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  var STATUS={novo:'Sem contato',neg:'Em negociação',fechado:'Fechado',validado:'Fechado e validado',perdido:'Perdido',prorrogado:'Prorrogado',
              contato:'Em conversa',pedido:'Vai comprar',semint:'Sem compra agora',feito:'Pós-venda feito',venda:'Gerou nova venda',naoquer:'Não quer contato'};
  var COR={novo:'novo',neg:'neg',contato:'neg',fechado:'fechado',validado:'fechado',pedido:'fechado',feito:'fechado',venda:'fechado',perdido:'perdido',naoquer:'perdido',prorrogado:'prorrogado',semint:'prorrogado'};
  var FIM=/^(fechado|validado|perdido|pedido|semint|feito|venda|naoquer)$/;
  var CANAIS=['Ligação','WhatsApp','Visita','E-mail','Na loja'];
  var RESULT=['Falei com o cliente','Não atendeu','Deixei recado'];
  var CHANCE={alta:['Alta',.7],media:['Média',.4],baixa:['Baixa',.15]};
  var TIPO={
    orc:{sit:[['neg','Em negociação'],['fechado','Fechado'],['perdido','Perdido'],['prorrogado','Prorrogado']],def:'neg',
         motivos:['Preço','Comprou no concorrente','Sem estoque','Prazo de entrega','Cliente adiou a obra','Cliente não responde','Outro']},
    cart:{sit:[['contato','Em conversa'],['pedido','Vai comprar'],['semint','Sem compra agora']],def:'contato',
         motivos:['Sem obra no momento','Comprou no concorrente','Preço','Problema com entrega ou atendimento','Outro']},
    pos:{sit:[['feito','Pós-venda feito'],['venda','Gerou nova venda'],['naoquer','Não quer contato']],def:'feito'},
    pin:{sit:[['contato','Ligação feita']],def:'contato',assuntos:['Acompanhamento de obra','Oferta ou campanha','Convite para treinamento ou evento','Pós-venda','Outro']}
  };
  var ETAPAS=[[3,12,'3 dias','Satisfação','“Deu tudo certo com o material? Precisa de mais alguma coisa para terminar?” Peça a avaliação no Google.'],
              [15,24,'15 dias','Complemento','Como está a obra? Ofereça o que costuma faltar: selador, massa, rolo, fita e a tinta de acabamento.'],
              [45,54,'45 dias','Recompra','Obra terminada? Pergunte da próxima etapa (fachada, muro, portões) e peça indicação.'],
              [180,189,'6 meses','Manutenção','Seis meses da pintura: ofereça retoque, limpeza e proteção. Lembre das campanhas do mês.']];
  var ESPEC=['Residencial','Predial / condomínio','Textura / grafiato','Epóxi / piso','Madeira'];
  var ABAS=[['orc','Orçamentos'],['cart','Carteira'],['pos','Pós-venda'],['pin','Pintores'],['ger','Loja']];

  var C=null, S=null, PERFIL='', LIDER=false, LOJAS=[], LOJA='', OFICIAL='';
  var D={orc:[],cart:[],pos:[],pin:[]}, REG=[], PIN=[], POS=[], HIST={};
  var PAINEL_FALHOU=false, TAB='orc', FIL={orc:'todos',cart:'todos',pos:'e0',pin:'todos'}, VEND='', SERVIDOR=null, LER=false, ABERTO={}, CARTN=0;
  var chave=function(k){ return 'st_crm_'+k+'_v1:'+norm(S&&S.nome); };
  function lerLocal(k){ try{ return JSON.parse(localStorage.getItem(chave(k))||'[]')||[]; }catch(e){ return []; } }
  function gravarLocal(k,l){ try{ localStorage.setItem(chave(k),JSON.stringify(l.slice(-500))); }catch(e){} }

  /* ───────── fontes ───────── */
  function dataOrc(x){ var t=String(x||''), m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t); if(m) return new Date(+m[1],+m[2]-1,+m[3],12,0,0);
    m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t); if(m) return new Date(+m[3],+m[2]-1,+m[1],12,0,0); var d=new Date(t); return isNaN(d.getTime())?null:d; }
  function doPainel(){
    return fetch(PAINEL_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tipo:'dados',u:'cracha',p:C.tk})})
      .then(function(r){return r.json();}).then(function(j){ var d=(j&&j.dados)||j||{}; return {O:d.O||{},K:d.K||{}}; }).catch(function(){ PAINEL_FALHOU=true; return {O:{},K:{}}; });
  }
  function orcsDe(O){
    var base=meioDia(), l=[];
    Object.keys(O).forEach(function(cod){ (O[cod]||[]).forEach(function(r){
      if(!r||!r[6]) return; var d=dataOrc(r[2]);
      l.push({tipo:'orc',loja:code3(cod),vend:nm(r[0]),doc:String(r[6]),cli:String(r[3]||'').replace(/^\d+-/,'').trim(),tel:String(r[4]||''),valor:Number(r[5])||0,dias:d?Math.max(0,Math.round((base-d)/864e5)):null});
    }); });
    return l;
  }
  /* carteira CNPJ: mesma regra do Painel — zerado no mês (a positivar) ou projetando menos de 70% da própria média */
  function cartDe(K){
    var l=[], visto={};
    Object.keys(K).forEach(function(cod){ var box=K[cod]||{}, n=box.n||1, loja=code3(cod);
      (box.c||[]).forEach(function(c){
        var pv=String(c[0]||'').split(/ - VEND\.?:\s*/i), nome=pv[0].replace(/^\d+-/,'').trim(), media=Number(c[1])||0, ativos=Number(c[2])||0, proj=Number(c[3])||0;
        var g=proj<=0?(media>0?'POS':''):(proj<media*0.7?'SUB':''); if(!g||!nome) return;
        var doc='C:'+loja+':'+NK(nome); if(visto[doc]) return; visto[doc]=1;
        l.push({tipo:'cart',loja:loja,vend:pv.length>1?nm(pv[1]):'',doc:doc,cli:nome,tel:'',grupo:g,rec:g==='POS'&&ativos>=5,media:media,ativos:ativos,meses:n,proj:proj,valor:g==='POS'?media:media-proj});
      });
    });
    return l;
  }
  function daSemana(){
    return STDados.chamar('semana').then(function(j){
      if(!j||!j.ok) return null;
      var a=(j.linhas||[]).filter(function(x){return x.semana===j.atual;})[0]||(j.linhas||[])[0];
      if(!a||!a.comp) return null;
      return {nome:a.comp.nome||'',orcs:(a.comp.orcs||[]).map(function(o){ return {tipo:'orc',loja:LOJAS[0]||'',vend:nm(a.comp.nome||S.nome),doc:String(o.doc||''),cli:String(o.cli||''),tel:String(o.tel||''),valor:Number(o.valor)||0,dias:o.dias}; }).filter(function(o){return o.doc;})};
    }).catch(function(){ return null; });
  }
  function meuNome(v){
    var a=norm(v), b=norm(OFICIAL), c=norm(S.nome); if(!a) return false;
    if(b&&(a===b||a.indexOf(b)===0||b.indexOf(a)===0)) return true;
    var t=c.split(' ').filter(Boolean); return t.length>0&&t.every(function(x){ return (' '+a+' ').indexOf(' '+x+' ')>=0; });
  }
  function posDe(linhas){
    var base=meioDia(), l=[];
    (linhas||[]).forEach(function(r){
      var d=dataOrc(r.data); if(!d) return; var dias=Math.round((base-d)/864e5), e=-1;
      ETAPAS.forEach(function(E,i){ if(dias>=E[0]&&dias<=E[1]) e=i; }); if(e<0) return;
      var loja=code3(r.loja), ck=loja+':'+NK(r.cli);
      l.push({tipo:'pos',loja:loja,vend:nm(r.vend),doc:'P:'+String(r.data).slice(0,10)+':'+ck+':'+ETAPAS[e][0],ck:ck,cli:r.cli,tel:'',valor:Number(r.valor)||0,prod:r.prod||'',data:String(r.data).slice(0,10),dias:dias,etapa:e});
    });
    return l;
  }

  /* ───────── registros (servidor + cópia no aparelho) ───────── */
  function juntar(a,b,campo){ var m={}; a.concat(b).forEach(function(x){ if(!x||!x.id) return; var y=m[x.id];
      if(!y||!campo||String(x[campo]||'')>=String(y[campo]||'')) m[x.id]=campo?x:Object.assign({},y||{},x); }); return Object.keys(m).map(function(k){return m[k];}); }
  function indexar(){ HIST={}; REG.forEach(function(x){ (HIST[x.doc]=HIST[x.doc]||[]).push(x); });

      else { SERVIDOR=false; REG=lerLocal('reg'); PIN=lerLocal('pin'); POS=[]; }

      else { SERVIDOR=false; toast('Guardado neste aparelho. Sobe quando o servidor estiver ligado.'); }

  /* ───────── listas ───────── */
  function montarDados(pn,sem){

      orc.push({tipo:'orc',loja:x.loja,vend:x.vend||'',doc:String(x.doc),cli:x.cli||'',tel:x.cTel||'',valor:Number(x.valor)||0,dias:null,fora:true}); } });

    REG.forEach(function(x){ if(x.tipo!=='pos') return; var ck=String(x.doc).split(':').slice(2,4).join(':'); if(x.status==='naoquer') fora[ck]=1; if(x.cTel&&!tel[ck]) tel[ck]=x.cTel; });
    D.pos=posDe(POS).filter(function(o){ o.tel=tel[o.ck]||''; return naLoja(o)&&(!fora[o.ck]||(HIST[o.doc]||[]).length); });
    if(PERFIL==='vend'){ var mp=D.pos.filter(function(o){return meuNome(o.vend);}); if(mp.length) D.pos=mp; }
    D.pin=PIN.filter(function(p){ return !p.arq&&LOJAS.indexOf(p.loja)>=0; }).map(function(p){ return Object.assign({tipo:'pin',doc:'T:'+p.id,cli:p.nome,vend:p.resp||p.por||'',valor:0},p); });

  function daAba(){ return D[TAB].filter(function(o){ return (!LOJA||o.loja===LOJA)&&(!VEND||norm(o.vend)===VEND); }).map(function(o){ o.e=estado(o); return o; }); }

  function entra(o,f){
    var e=o.e, hj=hojeISO();
    if(f==='hoje') return proxHoje(o);
    if(o.tipo==='orc'){
      if(f==='todos') return !FIM.test(e.st);
      if(f==='sem') return e.st==='novo';
      if(f==='venc') return e.st==='neg'&&e.u.prev&&e.u.prev<hj;
      if(f==='fechado') return e.st==='fechado'||e.st==='validado';
      return e.st===f;
    }
    if(o.tipo==='cart'){
      var aberto=e.st==='novo';
      if(f==='todos') return aberto;
      if(f==='rec') return aberto&&o.rec;
      if(f==='sub') return aberto&&o.grupo==='SUB';
      return f==='feitos'&&!aberto;
    }
    if(o.tipo==='pos'){ if(f==='feitos') return e.st!=='novo'; return e.st==='novo'&&f==='e'+o.etapa; }
    if(f==='todos') return true;

        (ABERTO[o.doc]?'<ul class="hist">'+e.h.slice(1).map(function(x){ return '<li>'+esc(dBr(x.em))+' · '+esc(x.canal||'')+' · '+esc(x.res||'')+' · '+esc(STATUS[x.status]||'')+(x.obs?' · “'+esc(x.obs)+'”':'')+'</li>'; }).join('')+'</ul>':'');

      (LER?'':'<button type="button" class="btn" data-reg="'+esc(o.doc)+'">Registrar</button>')+'</div>'+

  }
  function kpi(r,v,al){ return '<div class="kpi"><span>'+r+'</span><b'+(al?' class="alerta"':'')+'>'+v+'</b></div>'; }

          var e0=D.pos.filter(function(o){return !(HIST[o.doc]||[]).length;}); for(var i=0;i<ETAPAS.length;i++){ if(e0.some(function(o){return o.etapa===i;})){ FIL.pos='e'+i; break; } }
          montar();
        });
      });
    }).catch(function(e){ falha('Não consegui abrir',(e&&e.message)||String(e)); });
  }
