<!doctype html><html lang="pt-BR" data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDI Semanal · Só Tintas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f1522; --surface:#1a2336; --surface2:#222d44; --ink:#eef2fb; --muted:#9aa5bb; --line:#2c3850;
  --accent:#ff3b47; --navy:#4f7cf0; --ok:#3fbf7f; --bad:#ff6b6b; --warn:#ffab5e; --amarelo:#FFD200;
  --okbg:#12301f; --badbg:#3a1a20; --warnbg:#3a2717; --navybg:#1e2b4d;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f8; --ink:#16233d; --muted:#5a677f; --line:#e4e9f3;
  --navy:#1C3F8F; --ok:#178048; --bad:#c42a22; --warn:#b35600;
  --okbg:#e1f3e8; --badbg:#fdeceb; --warnbg:#ffefdd; --navybg:#e7edf9;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.topbar{height:8px;background:var(--accent);border-radius:0 0 6px 6px;margin:-20px 0 4px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.05;margin:4px 0 0;color:var(--accent)}
h2{font-family:var(--f-display);font-size:18px;margin:0 0 8px}
h3{font-size:14px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:700 13px var(--f-body);cursor:pointer}
.btn.azul{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.verde{background:var(--ok);border-color:var(--ok);color:#06130b}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.c-aguardando{background:var(--surface2);color:var(--muted)}.c-liberado{background:var(--navybg);color:var(--navy)}
.c-respondido{background:var(--okbg);color:var(--ok)}.c-nao_respondeu,.c-nao_feito{background:var(--badbg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:10px;padding:8px 10px}.kpi span{display:block;font-size:11.5px;color:var(--muted)}.kpi b{font-size:17px}
.comp{border-left:4px solid var(--navy);padding:8px 12px;margin:10px 0;background:var(--surface2);border-radius:0 10px 10px 0}
.comp .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;margin-right:6px}
.lista{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.lista li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding:4px 0}
.lista li span:last-child{color:var(--muted);white-space:nowrap}
.mais{background:none;border:0;color:var(--navy);font:700 12.5px var(--f-body);cursor:pointer;padding:4px 0}
.q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.q p{margin:0 0 6px;font-weight:700}
.q label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.q label:hover{background:var(--surface2)}
.q input{margin-top:3px;accent-color:var(--navy)}
.q.erro{border-color:var(--bad)}
.rev{display:flex;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.rev .ok{color:var(--ok);font-weight:800}.rev .x{color:var(--bad);font-weight:800}
.vend{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.vend-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vend-top b{font-size:15px}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fech{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.fech label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.fech input,.fech select{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:600 14px var(--f-body)}
.aviso{background:var(--warnbg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
.bom{background:var(--okbg);border-radius:10px;padding:8px 12px;font-size:13px}
.toast{position:fixed;left:0;right:0;margin:auto;bottom:18px;width:max-content;max-width:calc(100% - 24px);background:#16233d;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.relogio{font-variant-numeric:tabular-nums}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.filtros button{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 12.5px var(--f-body);cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.placar{width:100%;border-collapse:collapse;font-size:13px}
.placar th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
.placar td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.placar td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.placar tr.sel td{background:var(--navybg)}
.barra{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px;min-width:60px}
.barra i{display:block;height:100%;background:var(--ok)}
.barra i.med{background:var(--warn)}.barra i.ruim{background:var(--bad)}
.pos{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font-weight:800;font-size:12px;margin-right:6px}
@media(max-width:520px){.placar .esc{display:none}}
</style></head><body>
<div class="wrap">
  <div class="topbar"></div>
  <header>
    <div><div class="eyebrow">Só Tintas · desenvolvimento</div><h1>PDI Semanal</h1><div class="sub" id="sub">Carregando…</div></div>
    <button type="button" class="btn" id="btnTema"><span id="temaIc">🌙</span> <span id="temaTx">Escuro</span></button>
  </header>
  <main id="raiz"><p class="sub">Carregando o PDI semanal…</p></main>
</div>
<script>
(function(){
  function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var p=(qp('tema')||'').toLowerCase(), t=(p==='claro'||p==='light')?'light':(p==='escuro'||p==='dark')?'dark':null;
  if(!t){ var s=(ls('st_tema')||'').toLowerCase(); t=(s==='light'||s==='claro')?'light':'dark'; }
  window.__setTema=function(tema){ document.documentElement.setAttribute('data-theme',tema); document.documentElement.style.colorScheme=tema;
    var ic=document.getElementById('temaIc'), tx=document.getElementById('temaTx'); if(ic) ic.textContent=tema==='light'?'☀️':'🌙'; if(tx) tx.textContent=tema==='light'?'Claro':'Escuro';
    try{localStorage.setItem('st_tema',tema);}catch(e){} try{ if(window.parent&&window.parent!==window) window.parent.postMessage({st_tema:tema},'*'); }catch(e){} };
  window.__setTema(t);
  window.addEventListener('message',function(ev){ var d=ev&&ev.data; if(d&&(d.st_tema==='light'||d.st_tema==='dark')) window.__setTema(d.st_tema); });
  document.getElementById('btnTema').onclick=function(){ window.__setTema(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); };
})();
</script>
<script src="st-hora.js?v=1"></script>
<script src="st-dados.js?v=90"></script>
<script src="mentor/assets/conteudo-base.js"></script>
<script src="mentor/assets/conteudo-questoes.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   PDI SEMANAL — gerente libera, vendedor responde (até o prazo), gerente fecha a semana.
   Os dados e o gabarito ficam no Servidor de Dados ST; aqui só a tela.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  /* "2026-10-20 08:15" ou data convertida pela planilha ("Tue Oct 20 2026 08:15:00 GMT-0300") → "20/10 08:15" */
  var quando=function(s){s=String(s||'');var p=function(n){return ('0'+n).slice(-2);};
    if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(8,10)+'/'+s.slice(5,7)+(s.length>=16?' '+s.slice(11,16):'');
    var d=new Date(s);if(!isNaN(d)&&window.STHora)d=STHora.data(d.getTime());return isNaN(d)?s:p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());};
  var brl=function(n){return 'R$ '+Math.round(Number(n)||0).toLocaleString('pt-BR');};
  var pct=function(x){return x==null||!isFinite(x)?'—':Math.round(x*100)+'%';};
  var dBr=function(iso){var p=String(iso||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]:'';};
  var SIT={aguardando:'Aguardando o PDI',liberado:'Avaliação liberada',respondido:'Respondido',nao_respondeu:'Não respondeu no prazo',nao_feito:'PDI não feito no prazo'};
  var D=null, ABERTOS={}, RESP={}, MENTOR=null;
  /* nome sem sobra do sistema ("Fulano - Vermelha", "Fulano 2") */
  var nm=function(s){return String(s||'').replace(/\s+-\s+\S.*$/,'').replace(/\s+\d+\s*$/,'').trim();};
  /* filtro por supervisor (só coordenação); lembra a escolha neste aparelho */
  var FILTRO=''; try{ FILTRO=localStorage.getItem('st_semana_filtro')||''; }catch(e){}
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2800); }
  function chip(s){ return '<span class="chip c-'+esc(s)+'">'+esc(SIT[s]||s)+'</span>'; }
  function visao(){ try{ return !!(window.STDados&&STDados.visao&&STDados.visao()); }catch(e){ return false; } }
  function prazoTxt(p){ if(!p) return ''; var x=p.split(' '); return dBr(x[0])+' às '+(x[1]||'').replace(':00','h'); }

  var SUPD=null, GERD=null, PEND=[];
  function carregar(){
    return STDados.chamar('semana').then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não respondeu.');
      D=j; var ps=[];
      if(j.perfil==='sup'||j.perfil==='coord') ps.push(STDados.chamar('semanaSup').then(function(k){ SUPD=(k&&k.ok)?k:null; }).catch(function(){ SUPD=null; }));
      if(j.perfil==='ger'||j.perfil==='sup'||j.perfil==='coord') ps.push(STDados.chamar('semanaGer').then(function(k){ GERD=(k&&k.ok)?k:null; }).catch(function(){ GERD=null; }));
      return Promise.all(ps);
    }).then(function(){ montar(); }).catch(function(e){ $('raiz').innerHTML='<div class="card"><h2>Não consegui abrir</h2><p class="sub">'+esc(e.message||e)+'</p><button class="btn azul" type="button" id="deNovo">Tentar de novo</button></div>'; $('deNovo').onclick=carregar; });
  }

  /* ───────── compromissos (mesma ficha para vendedor e gerente) ───────── */
  function blocoComp(c, id){
    if(!c) return '<p class="sub">Sem compromissos registrados.</p>';
    var h='<div class="kpis"><div class="kpi"><span>Meta do mês</span><b>'+brl(c.meta)+'</b></div><div class="kpi"><span>Realizado</span><b>'+brl(c.fat)+'</b></div>'+
      '<div class="kpi"><span>Projeção</span><b>'+pct(c.pp)+'</b></div><div class="kpi"><span>Precisa por dia útil</span><b>'+brl(c.dia)+'</b></div></div>';
    h+='<div class="comp"><span class="n">1</span><b>'+(c.foco?'Indicador: '+esc(c.foco.nome)+' — de '+esc(c.foco.atual)+' para '+esc(c.foco.meta):'Indicadores CPF na meta: foco em volume')+'</b>'+
      (c.foco?'<div style="margin-top:4px"><b>Ação:</b> '+esc(c.foco.acao)+'</div><div><b>O gerente observa:</b> '+esc(c.foco.obs)+'</div>':'')+'</div>';
    var L=c.lista||[], ab=ABERTOS[id+':l'];
    h+='<div class="comp"><span class="n">2</span><b>Positivar '+(c.positMeta||10)+' clientes CNPJ na semana (2 por dia útil)</b><div class="sub">Lista de '+L.length+' clientes da carteira sem compra no mês</div>'+
      '<ul class="lista">'+L.slice(0,ab?L.length:5).map(function(x){return '<li><span>'+esc(x.cli)+(x.daLoja?' <span class="sub">(sem vendedor)</span>':'')+'</span><span>média '+brl(x.media)+'</span></li>';}).join('')+'</ul>'+
      (L.length>5?'<button class="mais" type="button" data-mais="'+esc(id)+':l">'+(ab?'Mostrar menos':'Ver os '+L.length+' clientes')+'</button>':'')+'</div>';
    var O=c.orcs||[];
    h+='<div class="comp"><span class="n">3</span><b>Retornar '+O.length+' orçamento'+(O.length===1?'':'s')+' em aberto</b>'+
      (O.length?'<ul class="lista">'+O.map(function(o){return '<li><span>'+esc(o.cli)+(o.tel?' · <a href="tel:'+esc(String(o.tel).replace(/[^\d+]/g,''))+'" style="color:var(--navy)">'+esc(o.tel)+'</a>':'')+'</span><span>'+brl(o.valor)+(o.dias!=null?' · '+o.dias+' dias':'')+'</span></li>';}).join('')+'</ul>':'<div class="sub">Nenhum orçamento em aberto no seu nome.</div>')+'</div>';
    return h;
  }

  /* ───────── avaliação do Mentor: o próximo módulo da trilha que ainda não foi aprovado ───────── */
  function semente(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function embaralha(a,s){ a=a.slice(); for(var i=a.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; var j=(s>>>16)%(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function prepararMentor(linha){
    var C0=window.CONTEUDO||{};
    /* módulos e questões publicados pela coordenação no Painel do Gestor valem mais que os do arquivo */
    return STDados.chamar('conteudoLer').catch(function(){return null;}).then(function(k){
      var cc=(k&&k.ok&&k.cont)||{}, C={modulos:cc.modulos||C0.modulos, questoes:cc.questoes||C0.questoes};
      if(!C.modulos||!C.questoes) return null;
      (C.questoes||[]).forEach(function(q){ if(typeof q.opcoes==='string'){ try{ q.opcoes=JSON.parse(q.opcoes); }catch(e){ q.opcoes=[]; } } if(q.correta!=null) q.correta=Number(q.correta); });
      var mods=C.modulos.filter(function(m){return m.ativo!==false;}).sort(function(a,b){return a.ordem-b.ordem;});
      return STDados.chamar('mentorLer').catch(function(){return null;}).then(function(j){
      var tent=(j&&j.eu&&j.eu.tentativas)||[], ok={}; tent.forEach(function(t){ if(t.aprovado) ok[t.modulo_id]=1; });
      var m=mods.filter(function(x){return !ok[x.id];})[0];
      if(!m){ var sem=Number(String(linha.semana).replace(/-/g,''))||0; m=mods[sem%mods.length]; }
      var qs=embaralha(C.questoes.filter(function(q){return q.modulo_id===m.id;}), semente(linha.chave)).slice(0,5);
      return { modulo:m.id, titulo:m.titulo, icone:m.icone||'🎓', qs:qs };
      });
    });
  }

  /* ───────── tela do vendedor ───────── */
  function telaVendedor(){
    var atual=D.linhas.filter(function(l){return l.semana===D.atual;})[0], ant=D.linhas.filter(function(l){return l.semana===D.anterior;})[0];
    $('sub').textContent=atual?'Semana de '+dBr(atual.semana)+' · '+nm(atual.comp?atual.comp.nome:''):'';
    if(!atual){ $('raiz').innerHTML='<div class="card"><h2>Ainda não há PDI semanal para você</h2><p class="sub">Ele chega toda segunda de manhã, junto com o resumo da loja.</p></div>'; return; }
    var h='<section class="card"><div class="vend-top"><h2 style="margin:0">Seus 3 compromissos da semana</h2>'+chip(atual.situacao)+'</div>'+blocoComp(atual.comp,atual.chave)+'</section>';
    h+='<section class="card" id="aval"><h2>Avaliação da semana</h2>';
    if(atual.situacao==='aguardando') h+='<p>A avaliação libera quando o seu gerente marcar que fez o PDI semanal com você.</p><p class="aviso">Prazo para responder: <b>'+esc(prazoTxt(atual.prazo))+'</b>. Converse com o seu gerente antes disso.</p>';
    else if(atual.situacao==='liberado') h+='<p class="aviso">Responda até <b>'+esc(prazoTxt(atual.prazo))+'</b>. São '+(atual.questoes||[]).length+' questões sobre o seu PDI e mais a avaliação do Mentor. Só dá para enviar uma vez.</p><div id="questoes"><p class="sub">Preparando as questões…</p></div>';
    else if(atual.situacao==='respondido') h+=resultado(atual.aval);
    else h+='<p class="aviso">'+esc(SIT[atual.situacao])+'. Fale com o seu gerente.</p>';
    h+='</section>';
    var antAberta=ant&&(ant.situacao==='liberado'||ant.situacao==='aguardando');
    if(antAberta){
      var hA='<section class="card" id="avalAnt"><div class="vend-top"><h2 style="margin:0">⏳ Avaliação da semana passada ('+dBr(ant.semana)+')</h2>'+chip(ant.situacao)+'</div>';
      if(ant.situacao==='aguardando') hA+='<p>Ainda dá tempo! A avaliação libera quando o seu gerente marcar que fez o PDI semanal da semana passada com você.</p><p class="aviso">Prazo: <b>'+esc(prazoTxt(ant.prazo))+'</b>.</p>';
      else hA+='<p class="aviso">Prazo estendido: responda até <b>'+esc(prazoTxt(ant.prazo))+'</b>. Só dá para enviar uma vez.</p><div id="aquestoes"><p class="sub">Preparando as questões…</p></div>';
      h=hA+'</section>'+h;
    }
    if(ant&&!antAberta) h+='<section class="card"><h2>Semana passada ('+dBr(ant.semana)+')</h2>'+(ant.aval?'<p>Avaliação: <b>'+ant.aval.nota+'/'+ant.aval.total+'</b>'+(ant.aval.mentor?' · Mentor '+ant.aval.mentor.acertos+'/'+ant.aval.mentor.total:'')+'</p>':'<p class="sub">'+esc(SIT[ant.situacao]||'')+'</p>')+
      (ant.fechamento?'<p>Fechamento do gerente: <b>'+ant.fechamento.posit+'</b> de '+((ant.comp&&ant.comp.positMeta)||10)+' positivações · <b>'+ant.fechamento.orcs+'</b> de '+((ant.comp&&ant.comp.orcs)||[]).length+' orçamentos retornados</p>':'<p class="sub">O gerente ainda não registrou o fechamento.</p>')+'</section>';
    $('raiz').innerHTML=h;
    if(antAberta&&ant.situacao==='liberado'){
      if(visao()) $('aquestoes').innerHTML='<p class="sub">Modo "Ver como": as questões só aparecem para o próprio vendedor.</p>';
      else prepararMentor(ant).then(function(M){ montarQuestoes(ant,M,'a'); });
    }
    if(atual.situacao==='liberado'){
      if(visao()){ $('questoes').innerHTML='<p class="sub">Modo "Ver como": as questões só aparecem para o próprio vendedor.</p>'; return; }
      prepararMentor(atual).then(function(M){ MENTOR=M; montarQuestoes(atual); });
    }
  }
  function resultado(a){
    if(!a) return '';
    var h='<div class="bom" style="font-size:15px">Você acertou <b>'+a.nota+' de '+a.total+'</b> sobre o seu PDI'+(a.mentor?' e <b>'+a.mentor.acertos+' de '+a.mentor.total+'</b> no Mentor ('+esc(a.mentor.titulo||a.mentor.modulo)+')':'')+'.</div>';

  /* ───────── placar do ritual (coordenação): supervisores lado a lado + filtro ───────── */
  function supsAtuais(){ return (SUPD&&SUPD.linhas||[]).filter(function(x){return x.semana===SUPD.atual;}); }
  function codsDe(x){ var d=x.dados||{}; if(d.carteira&&d.carteira.cods) return d.carteira.cods; return (d.auditoria||[]).map(function(a){return a.cod;}); }
  function lojasDoFiltro(){
    if(D.perfil!=='coord'||!FILTRO) return null;
    var x=supsAtuais().filter(function(s){return s.supervisor===FILTRO;})[0]; if(!x) return null;
    var o={}; codsDe(x).forEach(function(c){ o[String(c)]=1; }); return o;
  }
  function placar(){
    if(D.perfil!=='coord') return '';
    var S=supsAtuais(); if(!S.length) return '';
    if(FILTRO&&!S.some(function(s){return s.supervisor===FILTRO;})) FILTRO='';
    var A=D.linhas.filter(function(l){return l.semana===D.atual;});
    var R=S.map(function(x){
      var cs={}; codsDe(x).forEach(function(c){cs[String(c)]=1;});
      var a=A.filter(function(l){return cs[l.loja];}), f=a.filter(function(l){return l.situacao!=='aguardando'&&l.situacao!=='nao_feito';}).length, r=a.filter(function(l){return l.aval;});
      var med=r.length?r.reduce(function(s,l){return s+l.aval.nota/(l.aval.total||10)*10;},0)/r.length:null;
      var G=gerAtual().filter(function(g){return cs[g.loja];}), gf=G.filter(function(g){return g.feito_em;}).length;
      return { sup:x.supervisor, lojas:Object.keys(cs).length, n:a.length, f:f, r:r.length, pf:a.length?f/a.length:0, pr:a.length?r.length/a.length:0, med:med, plano:!!x.plano, sit:x.situacao, nota:x.aval?x.aval.nota+'/'+x.aval.total:'', gn:G.length, gf:gf };
    }).sort(function(a,b){ return (b.pf-a.pf)||(b.pr-a.pr)||((b.med||0)-(a.med||0)); });
    var tot=R.reduce(function(o,x){o.n+=x.n;o.f+=x.f;o.r+=x.r;return o;},{n:0,f:0,r:0});
    var cor=function(x){return x>=.8?'':x>=.5?'med':'ruim';};
    var h='<section class="card"><div class="vend-top"><h2 style="margin:0">🏆 Placar do ritual</h2><span class="sub">Rede: feito <b>'+tot.f+'/'+tot.n+'</b> · respondido <b>'+tot.r+'/'+tot.n+'</b></span></div>';
    h+='<div class="filtros" role="group" aria-label="Filtrar por supervisor"><button type="button" data-filtro="" aria-pressed="'+(!FILTRO)+'">Todos</button>'+
      R.map(function(x){return '<button type="button" data-filtro="'+esc(x.sup)+'" aria-pressed="'+(FILTRO===x.sup)+'">'+esc(String(x.sup).split(' ')[0])+'</button>';}).join('')+'</div>';
    h+='<table class="placar"><thead><tr><th>Supervisor</th><th>PDI feito</th><th>Respondido</th><th class="n">Nota média</th><th class="esc">Plano</th><th>Com a coordenação</th><th class="esc">Com os gerentes</th></tr></thead><tbody>'+
      R.map(function(x,i){ return '<tr'+(FILTRO===x.sup?' class="sel"':'')+'><td><span class="pos">'+(i+1)+'</span><b>'+esc(x.sup)+'</b><div class="sub">'+x.lojas+' lojas · '+x.n+' vendedores</div></td>'+
        '<td>'+pct(x.pf)+' <span class="sub">('+x.f+'/'+x.n+')</span><div class="barra"><i class="'+cor(x.pf)+'" style="width:'+Math.round(x.pf*100)+'%"></i></div></td>'+
        '<td>'+pct(x.pr)+' <span class="sub">('+x.r+'/'+x.n+')</span><div class="barra"><i class="'+cor(x.pr)+'" style="width:'+Math.round(x.pr*100)+'%"></i></div></td>'+
        '<td class="n">'+(x.med!=null?x.med.toFixed(1).replace('.',','):'—')+'</td><td class="esc">'+(x.plano?'<span class="chip c-respondido">registrado</span>':'<span class="chip c-aguardando">pendente</span>')+'</td>'+
        '<td>'+(x.sit?chip(x.sit):'<span class="sub">—</span>')+(x.nota?' <span class="chip c-respondido">'+x.nota+'</span>':'')+'</td><td class="esc">'+(x.gn?x.gf+'/'+x.gn+' feitos':'<span class="sub">—</span>')+'</td></tr>'; }).join('')+
      '</tbody></table><p class="sub" style="margin:8px 0 0">Ordem: % de PDI feito, depois % respondido. Nota média em 0 a 10. Toque num nome acima para ver só a carteira dele.</p></section>';
    return h;
  }

  /* ───────── PDI semanal do supervisor ───────── */
  function blocoSup(){
    if(!SUPD||!SUPD.linhas||!SUPD.linhas.length) return '';
    var ro=visao(), h='';
    var vale=function(x){ return !(D.perfil==='coord'&&FILTRO)||x.supervisor===FILTRO; };
    SUPD.linhas.filter(function(x){return x.semana===SUPD.atual&&vale(x);}).forEach(function(x){
      var d=x.dados||{}, p=x.plano||{}, f=d.foco, ed=x.meu&&x.prazoAberto&&!ro;
      h+='<section class="card"><div class="vend-top"><h2 style="margin:0">'+(x.meu?'Meu PDI semanal':'PDI semanal de '+esc(x.supervisor))+'</h2><div class="linha">'+(x.plano?'<span class="chip c-respondido">Plano registrado</span>':(x.prazoAberto?'<span class="chip c-liberado">Plano até '+esc(prazoTxt(d.prazo))+'</span>':'<span class="chip c-nao_feito">Plano não registrado</span>'))+
        (x.situacao?'<span class="chip c-'+esc(x.situacao)+'">Com a coordenação: '+esc(SIT[x.situacao]||x.situacao)+'</span>':'')+(x.aval?'<span class="chip c-respondido">'+x.aval.nota+'/'+x.aval.total+'</span>':'')+'</div></div>';
      /* ritual da coordenação com o supervisor */
      h+='<div class="linha" style="margin:6px 0 2px">'+(D.perfil==='coord'&&!ro&&x.situacao==='aguardando'?(x.temQuestoes?'<button class="btn azul" type="button" data-supfeito="'+esc(x.chave)+'">✓ Fiz o PDI com o supervisor</button>':'<span class="sub">As questões do supervisor saem às 12h15 de segunda.</span>'):'')+
        (x.feito_em?'<span class="sub">PDI com a coordenação feito '+esc(quando(x.feito_em))+(x.feito_por?' por '+esc(x.feito_por):'')+(x.situacao==='liberado'&&x.prazoAval?' · responde até '+esc(prazoTxt(x.prazoAval)):'')+'</span>':(d.prazoFeito&&x.situacao==='aguardando'&&D.perfil==='coord'?'<span class="sub">marcar até '+esc(prazoTxt(d.prazoFeito))+'</span>':''))+'</div>';
      if(x.meu&&x.situacao==='liberado'&&!ro){ h+='<h3 style="margin-top:8px">Avaliação da semana com a coordenação</h3><p class="aviso">Responda até <b>'+esc(prazoTxt(x.prazoAval))+'</b>. São '+(x.questoes||[]).length+' questões sobre a sua carteira. Só dá para enviar uma vez.</p><div id="s'+SUPD.linhas.indexOf(x)+'_questoes"><p class="sub">Preparando as questões…</p></div>'; PEND.push({linha:x,px:'s'+SUPD.linhas.indexOf(x)+'_',acao:'semanaSupAval'}); }
      else if(x.aval&&(x.meu||D.perfil==='coord')) h+=resultado(x.aval);
      if(d.carteira) h+='<div class="kpis" style="margin-top:8px"><div class="kpi"><span>Carteira</span><b>'+d.carteira.lojas+' lojas</b></div><div class="kpi"><span>Atingido</span><b>'+pct(d.carteira.pct)+'</b></div><div class="kpi"><span>Projeção</span><b>'+pct(d.carteira.pp)+'</b></div><div class="kpi"><span>Falta</span><b>'+brl(d.carteira.falta)+'</b></div></div>';
      if(f) h+='<div class="comp"><span class="n">1</span><b>Loja foco: '+esc(f.cod)+' '+esc(f.nome)+'</b> — projeção '+pct(f.pp)+', faltam '+brl(f.gap)+'<div class="sub">Visita presencial até quarta e plano escrito com '+esc(f.gerente)+'.'+(f.planejadas&&f.planejadas.length?' Na agenda: '+f.planejadas.map(dBr).join(', '):' Ainda sem visita na agenda.')+'</div></div>';
      var A=d.auditoria||[];
      h+='<div class="comp"><span class="n">2</span><b>Auditoria do ritual: '+(A.length?A.length+' loja(s) com PDI semanal incompleto':'todas as lojas em dia')+'</b>'+(A.length?'<ul class="lista">'+A.map(function(a){return '<li><span>'+esc(a.cod)+' '+esc(a.nome)+' · '+esc(a.gerente)+'</span><span>feito '+a.feitos+'/'+a.nV+' · respondido '+a.resp+'/'+a.nV+'</span></li>';}).join('')+'</ul>':'')+'</div>';
      if(d.indicador) h+='<div class="comp"><span class="n">3</span><b>Indicador da carteira: '+esc(d.indicador.nome)+' em '+esc(d.indicador.atual)+' (meta '+esc(d.indicador.meta)+')</b><div class="sub">'+esc(d.indicador.acao)+'</div></div>';
      if(ed) h+='<div class="fech" style="grid-template-columns:1fr"><label>Data da visita à loja foco<input type="date" id="spVisita" value="'+esc(p.visita||'')+'"></label>'+
        '<label>Ação combinada com o gerente da loja foco<textarea id="spAcao" rows="3" style="background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:500 14px var(--f-body)">'+esc(p.acao||'')+'</textarea></label>'+
        '<label>Auditoria: o que vou cobrar de cada gerente<textarea id="spAud" rows="2" style="background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:500 14px var(--f-body)">'+esc(p.auditoria||'')+'</textarea></label>'+
        '<label>Indicador da carteira: como vou trabalhar<textarea id="spInd" rows="2" style="background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:500 14px var(--f-body)">'+esc(p.indicador||'')+'</textarea></label></div>'+
        '<div class="linha" style="margin-top:8px"><button class="btn azul" type="button" data-supplano="'+esc(x.chave)+'">'+(x.plano?'Atualizar meu plano':'Registrar meu plano')+'</button><span class="sub">até '+esc(prazoTxt(d.prazo))+'</span></div>';
      else if(x.plano) h+='<div class="bom" style="margin-top:8px"><b>Plano:</b> visita em '+esc(dBr(p.visita))+' · '+esc(p.acao)+(p.auditoria?'<br><b>Auditoria:</b> '+esc(p.auditoria):'')+(p.indicador?'<br><b>Indicador:</b> '+esc(p.indicador):'')+'<div class="sub">registrado por '+esc(p.por||'')+' em '+esc(String(p.em||'').slice(8,10)+'/'+String(p.em||'').slice(5,7)+' '+String(p.em||'').slice(11,16))+'</div></div>';
      h+='</section>';
    });
    SUPD.linhas.filter(function(x){return x.semana===SUPD.anterior&&vale(x);}).forEach(function(x){
      var p=x.plano||{}, f=x.fechamento||{}, d=x.dados||{}, pode=!ro&&(x.meu||D.perfil==='coord');
      h+='<section class="card"><h3>Fechamento do supervisor · semana de '+dBr(x.semana)+(x.meu?'':' · '+esc(x.supervisor))+'</h3>'+
        '<p class="sub" style="margin:0 0 6px">Plano: '+(x.plano?'visita em '+esc(dBr(p.visita))+' na loja '+esc(d.foco?d.foco.cod+' '+d.foco.nome:'')+' · '+esc(p.acao):'não registrado')+'</p>'+
        (pode?'<div class="fech"><label>Fez a visita?<select id="sfV_'+esc(x.chave)+'"><option value="">—</option><option value="sim"'+(f.visitou==='sim'?' selected':'')+'>Sim</option><option value="nao"'+(f.visitou==='nao'?' selected':'')+'>Não</option></select></label>'+
          '<label>Resultado<input type="text" id="sfR_'+esc(x.chave)+'" value="'+esc(f.resultado||'')+'" placeholder="Ex.: projeção da loja subiu de 70% para 82%"></label></div>'+
          '<div class="linha" style="margin-top:8px"><button class="btn" type="button" data-supfechar="'+esc(x.chave)+'">Salvar fechamento</button>'+(x.fechamento?'<span class="sub">salvo por '+esc(f.por||'')+'</span>':'')+'</div>'
        :(x.fechamento?'<p>Visitou: <b>'+(f.visitou==='sim'?'sim':'não')+'</b> · '+esc(f.resultado||'')+'</p>':'<p class="sub">Sem fechamento.</p>'))+'</section>';
    });
    return h;
  }
  function montar(){ if(D.perfil==='vend') telaVendedor(); else { var pl=placar(); telaLider(); var b=blocoSup(); if(b) $('raiz').insertAdjacentHTML('afterbegin',b); if(pl) $('raiz').insertAdjacentHTML('afterbegin',pl); PEND.forEach(function(q){ if(visao()) $(q.px+'questoes').innerHTML='<p class="sub">Modo "Ver como": as questões só aparecem para a própria pessoa.</p>'; else montarQuestoes(q.linha,null,q.px,q.acao); }); PEND=[]; } }

  document.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    if(t.dataset.filtro!=null){ FILTRO=t.dataset.filtro; try{ localStorage.setItem('st_semana_filtro',FILTRO); }catch(e){} montar(); return; }
    if(t.dataset.mais){ ABERTOS[t.dataset.mais]=!ABERTOS[t.dataset.mais]; montar(); return; }
    if(t.dataset.abrir){ ABERTOS[t.dataset.abrir]=!ABERTOS[t.dataset.abrir]; montar(); return; }
    if(t.dataset.feito){
      t.disabled=true; t.textContent='Liberando…';
      STDados.chamar('semanaFeito',{chave:t.dataset.feito}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Avaliação liberada para o vendedor.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='✓ Fiz o PDI semanal'; toast(err.message); });
      return;
    }
    if(t.dataset.gerfeito){
      t.disabled=true; t.textContent='Liberando…';
      STDados.chamar('semanaGerFeito',{chave:t.dataset.gerfeito}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Avaliação liberada para o gerente até '+prazoTxt(j.prazoAval)+'.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='✓ Fiz o PDI com o gerente'; toast(err.message); });
      return;
    }
    if(t.dataset.supfeito){
      t.disabled=true; t.textContent='Liberando…';
      STDados.chamar('semanaSupFeito',{chave:t.dataset.supfeito}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Avaliação liberada para o supervisor até '+prazoTxt(j.prazoAval)+'.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='✓ Fiz o PDI com o supervisor'; toast(err.message); });
      return;
    }
    if(t.dataset.gerfechar){
      var gch=t.dataset.gerfechar, gc=document.getElementById('gfC_'+gch).value, gr=document.getElementById('gfR_'+gch).value;
      if(!gc){ toast('Informe se o combinado foi cumprido.'); return; }
      t.disabled=true; t.textContent='Salvando…';
      STDados.chamar('semanaGerFechar',{chave:gch,cumprido:gc,resultado:gr}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Fechamento salvo.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='Salvar fechamento'; toast(err.message); });
      return;
    }
    if(t.dataset.supplano){
      t.disabled=true; t.textContent='Salvando…';
      STDados.chamar('semanaSupPlano',{chave:t.dataset.supplano,visita:$('spVisita').value,acaoTxt:$('spAcao').value,auditoria:$('spAud').value,indicador:$('spInd').value})
        .then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Plano registrado.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='Registrar meu plano'; toast(err.message); });
      return;
    }
    if(t.dataset.supfechar){
      var ch=t.dataset.supfechar, vv=document.getElementById('sfV_'+ch).value, rr=document.getElementById('sfR_'+ch).value;
      if(!vv){ toast('Informe se a visita foi feita.'); return; }
      t.disabled=true; t.textContent='Salvando…';
      STDados.chamar('semanaSupFechar',{chave:ch,visitou:vv,resultado:rr}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Fechamento salvo.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='Salvar fechamento'; toast(err.message); });
      return;
    }
    if(t.dataset.fechar){
      var k=t.dataset.fechar, q=function(a){return document.querySelector('['+a+'="'+CSS.escape(k)+'"]');};
      var ps=q('data-fp').value, os=q('data-fo').value; if(ps===''||os===''){ toast('Preencha positivações e orçamentos.'); return; }
      t.disabled=true; t.textContent='Salvando…';
      STDados.chamar('semanaFechar',{chave:k,posit:ps,orcs:os,indicador:q('data-fi').value}).then(function(j){ if(!j||!j.ok) throw new Error((j&&j.erro)||'O servidor não confirmou.'); toast('Fechamento salvo.'); return carregar(); })
        .catch(function(err){ t.disabled=false; t.textContent='Salvar fechamento'; toast(err.message); });
    }
  });
  if(window.STDados) carregar(); else $('raiz').innerHTML='<p class="sub">Abra pelo Só Tintas App.</p>';
})();
</script>
