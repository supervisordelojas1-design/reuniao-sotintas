<style>

.btn.mini{min-height:30px;padding:4px 9px;font-size:11.5px;border-radius:8px}.box2{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13px}.box2 ul{margin:6px 0 0;padding-left:18px}

<script>
(function(){
  function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var p=(qp('tema')||'').toLowerCase(), t=(p==='claro'||p==='light')?'light':(p==='escuro'||p==='dark')?'dark':null;
  if(!t){ var s=(ls('st_tema')||'').toLowerCase(); t=(s==='light'||s==='claro')?'light':'dark'; }
  window.__setTema=function(tema){ document.documentElement.setAttribute('data-theme',tema); document.documentElement.style.colorScheme=tema;
    var ic=document.getElementById('temaIc'), tx=document.getElementById('temaTx'); if(ic) ic.textContent=tema==='light'?'☀️':'🌙'; if(tx) tx.textContent=tema==='light'?'Claro':'Escuro';
    try{localStorage.setItem('st_tema',tema);}catch(e){} try{ if(window.parent&&window.parent!==window) window.parent.postMessage({st_tema:tema},'*'); }catch(e){} };
  window.__setTema(t);
  window.addEventListener('message',function(ev){ var d=ev&&ev.data; if(d&&(d.st_tema==='light'||d.st_tema==='dark')) window.__setTema(d.st_tema); });
  document.getElementById('btnTema').onclick=function(){ window.__setTema(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'); };
})();
</script>

<script src="st-dados.js?v=93"></script>
<script>
let DIAS=[];
/* dia de semana de maior movimento da loja: maior índice de faturamento entre segunda e sexta */
const forte=l=>{const W=['seg','ter','qua','qui','sex'];let k=0;(l.idx||[]).forEach((v,i)=>{if(v>l.idx[k])k=i});return l.idx&&l.idx.length?[W[k],l.idx[k]]:['',0]};
const DIA7=6048e5,D1=864e5;
const SEG0=(()=>{const d=new Date();d.setHours(12,0,0,0);if(d.getDay()===0)d.setDate(d.getDate()+1);return new Date(d.getTime()-((d.getDay()+6)%7)*D1)})();
const semIni=k=>new Date(SEG0.getTime()+k*DIA7),dm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const semKey=k=>{const d=semIni(k);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const par=k=>Math.round(semIni(k).getTime()/DIA7)%2;
function setDias(){const b=semIni(S.sem);DIAS=[['seg','Seg'],['ter','Ter'],['qua','Qua'],['qui','Qui'],['sex','Sex'],['sab','Sáb']].map(([d,l],i)=>[d,l+' '+new Date(b.getTime()+i*D1).getDate()])}
const daVez=k=>P.find(p=>p.id===(par(k)?'g':TOP))||P.find(p=>p.id===TOP)||P[0];
const vagasEf=()=>P.length<=4?1:S.vagas;
const EU=()=>(P.find(p=>p.id==='v2')||P.find(p=>p.id==='v1')||P[0]).id;
const NOME_DIA={seg:'segunda',ter:'terça',qua:'quarta',qui:'quinta',sex:'sexta',sab:'sábado'};
// sem = semanas desde a última folga de sábado (rodízio)
let LOJAS=[];
const loja=()=>LOJAS[S.loja];
const DNOME={seg:'segunda',ter:'terça',qua:'quarta',qui:'quinta',sex:'sexta'};
let EQUIPES={},REG={},SALVOS={},CFG={},BASE='';
const TODOS=[
 {id:'g', nome:'Carla',  cargo:'Gerente',    pct:97,  sem:6, obs:'% da loja'},
 {id:'a', nome:'Paulo',  cargo:'Assistente', pct:null,sem:5},
 {id:'v1',nome:'Marina', cargo:'Vendedor',  pct:112, sem:4},
 {id:'v2',nome:'Diego',  cargo:'Vendedor',   pct:98,  sem:7},
 {id:'v3',nome:'Renata', cargo:'Vendedor',  pct:91,  sem:8},
 {id:'x', nome:'João',   cargo:'Auxiliar',   pct:null,sem:9}
];
const EQ4=['g','a','v1','v2'];
let P=TODOS.filter(p=>EQ4.includes(p.id));
const TOP='v1'; // vendedor de maior performance
/* alta performance: o vendedor TOP e todo vendedor que bateu 100% da meta no mês fechado */
const alta=p=>p.cargo==='Vendedor'&&(p.id===TOP||(p.pct!==null&&p.pct>=100));
/* almoço: o gerente não sai junto com o assistente nem com vendedor de alta performance */
function almJuntos(){if(S.alm.g===undefined||!P.some(p=>p.id==='g'))return [];return P.filter(p=>p.id!=='g'&&(p.id==='a'||alta(p))&&S.alm[p.id]===S.alm.g)}
function montaAlmoco(){
  S.alm={};const n=[0,0,0],poe=(p,k)=>{S.alm[p.id]=k;n[k]++};
  P.filter(p=>p.id==='g').forEach(p=>poe(p,0));
  P.filter(p=>p.id==='a').forEach(p=>poe(p,1));
  P.filter(p=>p.id!=='a'&&alta(p)).forEach(p=>poe(p,n[2]<=n[1]?2:1));
  P.filter(p=>S.alm[p.id]===undefined).forEach(p=>poe(p,n.indexOf(Math.min(...n))));
}
const SLOTS=['12h–13h','13h–14h','14h–15h'];
const TABS=[['semana','Grade da semana'],['fila','Fila do sábado'],['geral','Rede e regiões'],['ferias','Férias'],['banco','Banco de horas']];
const S={fer:{},ini:8,fim:18,equipe:'real',nivel:'rede',reg:'Bruno',cargoF:'todos',loja:0,segLock:true,min2:false,aperto:'comp',crit:'fila',sem:0,perfil:'gerente',sab:'curto',modo:'B',vagas:1,tab:'semana',folga:{},alm:{g:1,a:2,v1:0,v2:1,v3:2,x:0}};

const SAB={curto:['Curto atual','8h às 13h','13h'],curto9:['Curto 9h–13h','9h às 13h','13h'],curto12:['Curto reduzido','8h às 12h','12h'],integral:['Integral atual','8h às 18h','18h'],integral17:['Integral reduzido','8h às 17h','17h']};
const curto=()=>S.sab.startsWith('curto');
const $=id=>document.getElementById(id);
const nome=id=>P.find(p=>p.id===id).nome;
const hm=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
let RO=false,PFREAL='coord';
const podeEditar=()=>!RO&&(S.perfil==='gerente'||S.perfil==='supervisor'||S.perfil==='coord');

function filaPerf(){return P.filter(p=>p.pct!==null).sort((a,b)=>b.pct-a.pct||b.sem-a.sem)}
function filaRod(){return P.filter(p=>p.pct===null).sort((a,b)=>b.sem-a.sem)}

function conflito(f){ // regras de dupla
  const r=[],g=f.g,top=f[TOP];
  P.forEach(p=>{const d=f[p.id];if(!d)return;
    if(p.cargo==='Gerente'&&d==='seg')r.push('O gerente ('+p.nome+') está de folga na segunda.');
    if(p.cargo==='Vendedor'&&g&&d===g)r.push((p.id===TOP?'O vendedor de maior performance (':'O vendedor (')+p.nome+') está de folga junto com o gerente ('+NOME_DIA[d]+').');
    if(p.cargo==='Assistente'&&g&&d===g)r.push('Gerente e assistente ('+p.nome+') estão de folga no mesmo dia ('+NOME_DIA[d]+').');
    if(p.cargo==='Auxiliar'&&g&&d===g)r.push('O auxiliar ('+p.nome+') está de folga junto com o gerente ('+NOME_DIA[d]+').');

function calc(k){
  const f={};
  const cand=S.crit==='rod'?[daVez(k),...filaPerf()]:[...filaPerf()]; const rod=[...filaRod()];
  let vagas=vagasEf();
  for(const p of cand){ if(vagas<1)break; f[p.id]='sab'; if(conflito(f).length){delete f[p.id];continue} vagas--; break }
  if(vagasEf()===2){ for(const p of rod){ f[p.id]='sab'; if(conflito(f).length){delete f[p.id];continue} break } }
  const PRI={Gerente:0,Assistente:1,Auxiliar:2,Vendedor:3};const ordem=[...P].sort((x,y)=>PRI[x.cargo]-PRI[y.cargo]).map(p=>p.id);
  for(const id of ordem){
    if(f[id])continue;
    let best=null,bn=99;
    for(const d of loja().dias.filter(d=>d!=='seg'||!S.segLock)){
      f[id]=d; const ok=!conflito(f).length; delete f[id];

      if(n<bn){bn=n;best=d}
    }
    f[id]=best||loja().dias.find(d=>d!=='seg'||!S.segLock);
  }
  return f;
}

/* Almoço: a loja nunca fica sem ninguém. vazios() lista dia e hora em que todos os presentes estão em almoço. */
const SLOTH=[12,13,14];
function vazios(f=S.folga){
  const T=plano(f),out=[];
  ['seg','ter','qua','qui','sex','sab'].forEach(d=>{
    const pr=P.filter(p=>T[p.id][d]);if(!pr.some(p=>T[p.id][d].l>0))return;
    for(let h=12;h<16;h++){
      const aberta=pr.some(p=>h>=T[p.id][d].a&&h<T[p.id][d].b);if(!aberta)continue;
      const na=pr.filter(p=>{const o=T[p.id][d];if(h<o.a||h>=o.b)return false;const st=SLOTH[S.alm[p.id]];return !(o.l>0&&h>=st&&h<st+o.l)}).length;
      if(!na)out.push([d,h]);
    }
  });
  return out;
}
function ajustaAlmoco(){
  for(let g=0;g<12;g++){
    const v=vazios();if(!v.length)return;
    const T=plano(S.folga),d=v[0][0],pr=P.filter(p=>T[p.id][d]).sort((x,y)=>(x.id==='g')-(y.id==='g'));
    let ok=false;
    for(const p of pr){const antes=S.alm[p.id];
      for(let k=0;k<3&&!ok;k++){if(k===antes)continue;S.alm[p.id]=k;
        if(almJuntos().length||vazios().length>=v.length)S.alm[p.id]=antes;else ok=true}
      if(ok)break}
    if(!ok)return;
  }
}
const lab=o=>o?o.a+'h–'+o.b+'h':'FOLGA';
const mins=o=>o?(o.b-o.a-o.l)*60:0;
function plano(f){
  const WD=['seg','ter','qua','qui','sex'],T={};P.forEach(p=>T[p.id]={});
  const fimSab=parseInt(SAB[S.sab][2]),pres=d=>P.filter(p=>f[p.id]!==d),ini=S.ini,fim=S.fim;
  P.forEach(p=>{if(f[p.id]==='sab')T[p.id].sab=null});
  const ps=pres('sab');let sabEdge=false;
  if(curto())ps.forEach((p,i)=>T[p.id].sab=S.sab==='curto9'?{a:9,b:13,l:0}:fimSab===12||i%2===0?{a:8,b:12,l:0}:{a:9,b:13,l:0});
  else if(fimSab===17)ps.forEach(p=>T[p.id].sab={a:8,b:17,l:1});
  else sabEdge=true;
  const diaCheio=p=>curto()&&S.modo==='B'&&f[p.id]!=='sab'; // quem trabalha sábado curto faz 9h nos dias de semana
  const modo=curto()&&S.aperto==='comp'?'nada':S.aperto==='comp'&&P.length<=3?'alm':S.aperto;
  const owed={},longs={},N={},M=S.min2?2:1;P.forEach(p=>{owed[p.id]=0;longs[p.id]=0});
  const dias=WD.map(d=>[d,ini,fim]);if(sabEdge)dias.push(['sab',8,18]);
  dias.forEach(([d,i0,f0],di)=>{
    const pr=pres(d),Wd=f0-i0,flex=[];N[d]=pr.length;
    P.forEach(p=>{if(f[p.id]===d)T[p.id][d]=null});
    pr.forEach(p=>{const L=Math.min(d!=='sab'&&diaCheio(p)?9:8,Wd-1);if(L+1>=Wd)T[p.id][d]={a:i0,b:f0,l:Wd-L};else flex.push([p,L])});
    const kf=Math.floor(flex.length/2);
    flex.forEach(([p,L],i)=>{const naFraca=((i+di)%flex.length)<kf,abre=loja().fraca==='a'?naFraca:!naFraca;T[p.id][d]=abre?{a:i0,b:i0+L+1,l:1}:{a:f0-L-1,b:f0,l:1}});
    if(modo==='nada'||Wd!==10)return;
    for(let g=0;g<3;g++){
      const ab=pr.filter(p=>T[p.id][d].a===i0).length,fe=pr.filter(p=>T[p.id][d].b===f0).length;
      if(ab>=M&&fe>=M)break;
      const c=pr.filter(p=>{const o=T[p.id][d];return !o.x&&o.b-o.a===9&&(ab<M?o.a!==i0:o.b!==f0)}).sort((x,y)=>longs[x.id]-longs[y.id]);
      if(!c.length)break;
      const q=c[0];longs[q.id]++;
      if(modo==='comp'){T[q.id][d]={a:i0,b:f0,l:1,x:1};owed[q.id]++}else T[q.id][d]={a:i0,b:f0,l:2,x:2};
    }
  });
  if(modo==='comp'){
    const pref=['sex','qui','qua','ter','sab','seg'].filter(d=>dias.some(x=>x[0]===d)),sh={};
    [...P].sort((x,y)=>(y.id==='g')-(x.id==='g')).forEach(p=>{
      while(owed[p.id]>0){
        const d=pref.find(d=>{const o=T[p.id][d];return N[d]>=4&&o&&!o.x&&o.b-o.a===9&&(sh[d]||0)<2&&!(d==='seg'&&p.id==='g')});
        if(!d)break;
        const o=T[p.id][d],i0=d==='sab'?8:ini;T[p.id][d]=o.a===i0?{a:o.a,b:o.b-1,l:1,x:-1}:{a:o.a+1,b:o.b,l:1,x:-1};
        sh[d]=(sh[d]||0)+1;owed[p.id]--;
      }
    });
  }
  T._owed=owed;return T;
}
function minutos(id,f=S.folga){const T=plano(f);return ['seg','ter','qua','qui','sex','sab'].reduce((s,d)=>s+mins(T[id][d]),0)}
function turno(p,i,d,f=S.folga){return lab(plano(f)[p.id][d])}
function cobre(d,f=S.folga){
  const T=plano(f),fn=d==='sab'?parseInt(SAB[S.sab][2]):S.fim,an=d==='sab'?(S.sab==='curto9'?9:8):S.ini;
  const pres=P.map(p=>({p,o:T[p.id][d]})).filter(x=>x.o).map(x=>({p:x.p,o:x.o,t:lab(x.o)}));
  const g=pres.find(o=>o.p.id==='g');
  const resp=g?g.p:(pres.find(o=>o.p.id===TOP)||pres.find(o=>o.p.id==='a')||pres[0]).p;
  return {pres,resp,subst:!g,fim:fn+'h',ini:an+'h',abre:pres.filter(x=>x.o.a===an),fecha:pres.filter(x=>x.o.b===fn)};
}
function alertas(){
  const bad=conflito(S.folga), warn=[];
  for(const [d] of DIAS){
    if(d==='seg')continue;
    const fora=P.filter(p=>S.folga[p.id]===d);
    const vend=P.filter(p=>p.cargo.startsWith('Vend')&&S.folga[p.id]!==d).length;
    if(vend<1){const nv=P.filter(p=>p.cargo.startsWith('Vend')).length;(nv<=1?warn:bad).push(nv<=1?'Loja com 1 vendedor: na '+NOME_DIA[d]+' o balcão fica sem vendedor.':'Nenhum vendedor escalado na '+NOME_DIA[d]+'.')}

  }
  for(const [d] of DIAS){

    if(c.abre.length<min)warn.push('Abertura da '+NOME_DIA[d]+' com '+c.abre.length+' pessoa(s) às '+c.ini+'.');
    if(c.fecha.length<min)warn.push('Fechamento da '+NOME_DIA[d]+' com '+c.fecha.length+' pessoa(s) às '+c.fim+'.');
  }
  P.forEach(p=>{const mm=minutos(p.id);if(mm<2400)warn.push(p.nome+' fecha a semana em '+hm(mm)+': a loja está liberando '+hm(2400-mm)+'.');if(mm>2400)bad.push(p.nome+' passa de 40h na semana ('+hm(mm)+').')});
  const ow=plano(S.folga)._owed;if(ow)P.forEach(p=>{if(ow[p.id]>0)warn.push(p.nome+' fica com +'+ow[p.id]+'h sem dia para compensar nesta semana.')});

  if(S.folga[primeiro.id]!=='sab')
    warn.push(S.crit==='rod'?'É a vez de '+primeiro.nome+' no rodízio do sábado e a folga não está com '+'essa pessoa'+'.':primeiro.nome+' é o 1º da fila do sábado e não está com a folga.');
  vazios().forEach(([d,h])=>bad.push((d==='sab'?'No sábado':'Na '+DNOME[d])+', das '+h+'h às '+(h+1)+'h, a loja fica sem ninguém: todos os presentes estão em almoço. Troque o horário de almoço de uma pessoa.'));
  almJuntos().forEach(p=>bad.push((p.id==='a'?'Gerente e assistente':'Gerente e '+p.nome+' (vendedor de alta performance)')+' estão no mesmo horário de almoço ('+SLOTS[S.alm.g]+').'));
  for(let s=0;s<3;s++){const n=P.filter(p=>S.alm[p.id]===s).length;if(n>Math.max(3,Math.ceil(P.length/3)))warn.push('Mais de 3 pessoas almoçando às '+SLOTS[s]+'.')}
  return {bad,warn};
}

  lin.forEach(r=>{
    if(niv!=='loja'&&r.l.reg!==reg){reg=r.l.reg;h+='<tr class="cob"><th colspan="7" style="text-align:left">Região '+reg+'</th></tr>'}
    h+='<tr><td class="nome"><b>'+r.l.c+'</b> '+r.l.n+'<small>'+r.P.filter(ok).length+' pessoas'+(r.i===S.loja?' · loja aberta na grade':'')+'</small></td>'+dias.map(d=>'<td style="text-align:left"'+(d===forte(r.l)[0]?' class="fortec" title="Dia de maior movimento desta loja ('+forte(r.l)[1]+'% da média)"':'')+'>'+(d===forte(r.l)[0]?'<small class="fx">🔥 maior movimento</small>':'')+(r.P.filter(p=>ok(p)&&r.f[p.id]===d).map(p=>'<span class="chip" style="background:'+CGC[p.cargo]+'" title="'+p.cargo+'">'+CGL[p.cargo]+'</span> '+p.nome.split(' ')[0]).join('<br>')||'<span style="color:var(--muted)">—</span>')+'</td>').join('')+'</tr>';
  });
  h+='</table></div><p class="note">🔥 marca o dia de maior movimento de cada loja, de segunda a sexta.</p><p class="note">A escala de cada loja é a sugerida pelas regras e pelo movimento dela. Ajustes feitos à mão valem só para a loja aberta na grade.</p>';
  return h;
}
function aplicaCfg(){const c=CFG[loja().c];if(!c)return;if(c.sab&&SAB[c.sab])S.sab=c.sab;if(typeof c.seg==='boolean')S.segLock=c.seg;if(c.hor&&HOR[c.hor])[S.ini,S.fim]=c.hor.split('-').map(Number);['modo','aperto','crit'].forEach(k=>{if(c[k])S[k]=c[k]});if(c.vagas)S.vagas=+c.vagas}
function carregaSemana(){const sv=SALVOS[loja().c+'|'+semKey(S.sem)];S.salvo=null;
  if(sv&&sv.folga){const f={},a={};let okk=true;P.forEach(p=>{if(sv.folga[p.nome])f[p.id]=sv.folga[p.nome];else okk=false;if(sv.alm&&sv.alm[p.nome]!=null)a[p.id]=+sv.alm[p.nome]});
    if(okk){S.folga=f;Object.assign(S.alm,a);S.salvo=sv;return}}
  sugerir();}
function salvarSemana(){
  const folga={},alm={};P.forEach(p=>{folga[p.nome]=S.folga[p.id];alm[p.nome]=S.alm[p.id]});const k=loja().c+'|'+semKey(S.sem);
  toast('Salvando…');
  STDados.chamar('escalaSalvar',{loja:loja().c,sem:semKey(S.sem),folga,alm},true).then(r=>{if(!r||!r.ok)throw new Error((r&&r.erro)||'O servidor não confirmou.');SALVOS[k]={folga,alm,por:r.por,em:r.em};S.salvo=SALVOS[k];render();toast('Escala salva.')}).catch(e=>toast('Não salvou: '+e.message));
}
function salvarCfg(){
  if(S.perfil!=='coord'||!REAL||RO||PFREAL!=='coord')return;const cfg={sab:S.sab,seg:S.segLock,hor:S.ini+'-'+S.fim,modo:S.modo,aperto:S.aperto,crit:S.crit,vagas:S.vagas};CFG[loja().c]=cfg;
  STDados.chamar('escalaCfg',{loja:loja().c,cfg},true).then(r=>{if(!r||!r.ok)throw new Error((r&&r.erro)||'O servidor não confirmou.')}).catch(e=>toast('A seleção não foi gravada: '+e.message));
}
function trocaLoja(i){S.loja=i;aplicaRec(loja());aplicaCfg();montaEquipe();opcoes();['modo','aperto','crit'].forEach(k=>$(k).value=S[k]);$('vagas').value=S.vagas;carregaSemana();render()}
$('hor').onchange=e=>{[S.ini,S.fim]=e.target.value.split('-').map(Number);salvarCfg();render()};
$('loja').onchange=e=>trocaLoja(+e.target.value);
$('seg').onchange=e=>{S.segLock=e.target.value==='1';salvarCfg();sugerir();S.salvo=null;render()};
$('aperto').onchange=e=>{S.aperto=e.target.value;salvarCfg();render()};
$('crit').onchange=e=>{S.crit=e.target.value;salvarCfg();sugerir();S.salvo=null;render()};
$('sem').onchange=e=>{S.sem=+e.target.value;carregaSemana();render()};
$('perfil').onchange=e=>{S.perfil=e.target.value;render()};
$('sab').onchange=e=>{S.sab=e.target.value;salvarCfg();render()};
$('modo').onchange=e=>{S.modo=e.target.value;salvarCfg();render()};
$('vagas').onchange=e=>{S.vagas=+e.target.value;salvarCfg();sugerir();S.salvo=null;render()};
let REAL=false;
function boot(d){
  LOJAS=d.lojas;EQUIPES=d.equipes;REG=d.reg;SALVOS=d.salvos||{};CFG=d.cfg||{};BASE=d.base||'';
  LOJAS.forEach(l=>l.reg=Object.keys(REG).find(k=>REG[k].includes(l.c))||'Sem região');
  $('loja').innerHTML=LOJAS.map((l,i)=>'<option value="'+i+'">'+l.c+' · '+l.n+'</option>').join('');
  $('sem').innerHTML=[0,1,2,3,4,5].map(k=>'<option value="'+k+'">'+dm(semIni(k))+' a '+dm(new Date(semIni(k).getTime()+5*D1))+(k===0?' (semana atual)':'')+'</option>').join('');
  PFREAL=d.pf||'coord';RO=!!d.leitura;const eCo=PFREAL==='coord'&&!RO;
  const lib=(d.perfis||[]).map(p=>({sup:'supervisores',ger:'gerentes',anl:'análise'}[p])).filter(Boolean);
  $('info').innerHTML='';
  $('rodape').innerHTML=eCo?BASE+(d.baseEm?' Base enviada em '+d.baseEm+'.':'')+' <label style="text-decoration:underline;cursor:pointer;margin-left:6px">Atualizar base<input type="file" accept=".json" style="display:none" onchange="enviarBase(this)"></label>':'';
  S.perfil={coord:'coord',anl:'coord',sup:'supervisor',ger:'gerente'}[PFREAL]||'gerente';$('perfil').value=S.perfil;
  if(!REG[S.reg])S.reg=Object.keys(REG)[0]||S.reg;if(S.perfil==='supervisor')S.nivel='reg';
  REAL=true;trocaLoja(0);
}
function enviarBase(inp){
  const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let b;try{b=JSON.parse(rd.result)}catch(e){return falhaMsg('O arquivo não é uma base válida.')}
    $('info').textContent='Enviando a base…';
    STDados.chamar('escalaBase',{base:b},true).then(r=>{if(!r||!r.ok)throw new Error((r&&r.erro)||'o servidor não confirmou.');return STDados.chamar('escalaListar',{},true)}).then(r=>{if(!r||!r.ok||r.semBase)throw new Error('a base não voltou do servidor.');boot(r);toast('Base atualizada.')}).catch(e=>falhaMsg('Não consegui enviar a base: '+(e&&e.message||e)))};
  rd.readAsText(f);
}
const BTN_BASE='<label class="btn alt" style="display:inline-block;margin-top:10px;cursor:pointer">Enviar a base do mês<input type="file" accept=".json" style="display:none" onchange="enviarBase(this)"></label>';
function falhaMsg(m){$('info').textContent=m}
function falha(m){$('info').textContent=m;$('view').innerHTML='<p style="margin:0">'+m+'</p>'}
if(window.STDados)STDados.cracha().then(()=>STDados.chamar('escalaListar',{},true)).then(r=>{if(!r||!r.ok)throw new Error((r&&r.erro)||'o servidor ainda não tem a Escala.');if(r.semBase){$('info').textContent='Falta a base do mês.';$('view').innerHTML='<p style="margin:0">A Escala está pronta, mas o servidor ainda não tem a base do mês (lojas, equipes e % da meta).</p>'+BTN_BASE;return}boot(r)}).catch(e=>falha('Não consegui abrir a Escala: '+(e&&e.message||e)));
else falha('Abra a Escala por dentro do Só Tintas App.');
</script>
